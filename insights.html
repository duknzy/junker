        async function autoFixUnclassifiedSubjects() {
            if (!currentUser) return;
            let updatedCount = 0;
            const updates = {};
            const now = new Date().toISOString();

            // 1. レッスンの未分類・その他を自動判別
            Object.entries(rawLessons).forEach(([id, lesson]) => {
                if (!lesson) return;
                const currentSubj = lesson.subject;
                if (!currentSubj || currentSubj === "未分類" || currentSubj === "その他") {
                    const detected = detectSubjectFromLesson(lesson);
                    if (detected && detected !== "未分類" && detected !== "その他") {
                        updates[`lessons/${id}/subject`] = detected;
                        updates[`lessons/${id}/updatedAt`] = now;
                        lesson.subject = detected;

                        if (Array.isArray(lesson.memorizationPoints)) {
                            lesson.memorizationPoints.forEach(p => { p.subject = detected; });
                            updates[`lessons/${id}/memorizationPoints`] = lesson.memorizationPoints;
                        }
                        if (Array.isArray(lesson.lessonMemos)) {
                            lesson.lessonMemos.forEach(m => { m.subject = detected; });
                            updates[`lessons/${id}/lessonMemos`] = lesson.lessonMemos;
                        }
                        updatedCount++;
                    }
                }
            });

            // 2. 問題の未分類・その他を自動判別
            Object.entries(rawProblems).forEach(([id, prob]) => {
                if (!prob || !prob.insight) return;
                const currentSubj = prob.subject;
                if (!currentSubj || currentSubj === "未分類" || currentSubj === "その他") {
                    const text = [prob.title, prob.short_title, prob.field, prob.insight].join(" ").toLowerCase();
                    let detected = null;
                    if (/政治|経済|財政|租税|金融|市場|雇用|労働|社会保障|福祉|司法|地方自治|諸課題|中小企業|少子|高齢|消費者/i.test(text)) detected = "政治・経済";
                    else if (/公共/i.test(text)) detected = "公共";
                    else if (/公民|倫理/i.test(text)) detected = "公民";
                    else if (/数学|微分|積分|ベクトル|数列|三角関数|確率/i.test(text)) detected = "数学";
                    else if (/物理|力学|電磁気|波動/i.test(text)) detected = "物理";
                    else if (/化学|mol|酸化|還元|酸|塩基|元素|周期表|周期律|構成粒子|三態|熱運動|結合/i.test(text)) detected = "化学";
                    else if (/生物|遺伝|細胞|dna/i.test(text)) detected = "生物";
                    else if (/情報|プログラミング|python/i.test(text)) detected = "情報";
                    else if (/地理/i.test(text)) detected = "地理";
                    else if (/日本史/i.test(text)) detected = "日本史";
                    else if (/世界史/i.test(text)) detected = "世界史";
                    else if (/英語|文法/i.test(text)) detected = "英語";
                    else if (/国語|現代文|古文/i.test(text)) detected = "国語";

                    if (detected) {
                        updates[`problems/${id}/subject`] = detected;
                        prob.subject = detected;
                        updatedCount++;
                    }
                }
            });

            if (updatedCount === 0) {
                showToast("未分類データの自動判別候補が見つかりませんでした。右側の「一括変更」から任意の教科を指定してください。", "info", 4000);

        // 🧠 数式正規化＆穴埋め枠の修復処理
        function normalizeMathSyntax(str) {
            if (!str) return "";
            let s = String(str);

            // 1. \bbox[...] または \bbox[...]{...} の波括弧抜け・表記ゆれを完全正規化
            s = s.replace(/\\bbox\s*\[[^\]]*\]\s*\{((?:[^{}]*|\{[^{}]*\})*)\}/g, (_, content) => {
                let c = content.trim();
                while (/^\\text\{([\s\S]*)\}$/.test(c)) {
                    c = c.replace(/^\\text\{([\s\S]*)\}$/, "$1").trim();
                }
                if (!c) c = "\\quad";
                return `\\bbox[2px,border:1px solid]{\\text{${c}}}`;
            });

            s = s.replace(/\\bbox\s*\[[^\]]*\]\s*([0-9A-Za-zぁ-んァ-ヶー一-龠々]+)/g, (_, content) => {
                let c = content.trim();
                while (/^\\text\{([\s\S]*)\}$/.test(c)) {
                    c = c.replace(/^\\text\{([\s\S]*)\}$/, "$1").trim();
                }
                if (!c) c = "\\quad";
                return `\\bbox[2px,border:1px solid]{\\text{${c}}}`;
            });

            s = s.replace(/\\bbox\s*\[[^\]]*\](?!\s*\{)/g, `\\bbox[2px,border:1px solid]{\\text{\\quad}}`);

            // 2. \fbox, \boxed, \framebox の正規化
            s = s.replace(/\\(?:fbox|boxed|framebox)(?:\s*\[[^\]]*\])?\s*\{((?:[^{}]*|\{[^{}]*\})*)\}/g, (_, content) => {
                let c = content.trim();
                while (/^\\text\{([\s\S]*)\}$/.test(c)) {
                    c = c.replace(/^\\text\{([\s\S]*)\}$/, "$1").trim();
                }
                if (!c) c = "\\quad";
                return `\\bbox[2px,border:1px solid]{\\text{${c}}}`;
            });
            s = s.replace(/\\(?:fbox|boxed|framebox)(?:\s*\[[^\]]*\])?\s+([0-9A-Za-zぁ-んァ-ヶー一-龠々]+)/g, (_, content) => {
                let c = content.trim();
                while (/^\\text\{([\s\S]*)\}$/.test(c)) {
                    c = c.replace(/^\\text\{([\s\S]*)\}$/, "$1").trim();
                }
                if (!c) c = "\\quad";
                return `\\bbox[2px,border:1px solid]{\\text{${c}}}`;
            });
            s = s.replace(/\\(?:fbox|boxed|framebox)(?:\s*\[[^\]]*\])?(?!\s*\{)/g, `\\bbox[2px,border:1px solid]{\\text{\\quad}}`);

            // 3. $...$ の外にある \bbox や孤立した TeX 記号を $...$ で保護
            const parts = s.split(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g);
            for (let i = 0; i < parts.length; i += 2) {
                let chunk = parts[i];
                if (!chunk) continue;

                // \bbox が $ の外にある場合、$ で包む
                chunk = chunk.replace(/(\\bbox\[2px,border:1px solid\]\{\\text\{[^}]*\}\}(?:\^[0-9A-Za-z^\circ]+)?)/g, '$$$1$$');

                // 孤立した TeX 記号・数式コマンドを $...$ で包む
                chunk = chunk.replace(/(\\(?:triangle|angle|sqrt|frac|vec|alpha|beta|gamma|theta|pi|pm|mp|le|ge|leqq|geqq|neq|approx|sim|equiv|subset|supset|cap|cup|times|div|cdot|int|sum|lim|log|ln|sin|cos|tan)\b[^\s$、。,.)）]*)/g, '$$$1$$');

                // 不正な連続 $$ や 空の $$ を整理
                chunk = chunk.replace(/\$\s*\$/g, '');

                parts[i] = chunk;
            }

            return parts.join("");
        }

        function formatQuestionText(raw) {
            if (!raw) return "";
            let t = normalizeMathSyntax(raw);
            t = t.replace(/\\n/g, '\n').replace(/\r\n?/g, '\n').trim();
            const noWordBefore = "(?<![0-9A-Za-zぁ-んァ-ヶー一-龠々'’])";
            t = t.replace(new RegExp(noWordBefore + "\\(\\s*([1-9]|10)\\s*\\)(?!\\d)", "g"), "\n\n($1)");
            t = t.replace(new RegExp(noWordBefore + "\\(\\s*(i{1,3}|iv)\\s*\\)", "gi"), "\n($1)");
            return t.replace(/\n{3,}/g, "\n\n").replace(/^\n+/, "").trim().replace(/\n/g, "<br>");
        }

        // Markdown＆数式フォーマット関数
        function renderFormattedMarkdown(text) {
            if (!text) return "";
            let trimmed = normalizeMathSyntax(text).trim();
            const mathBlocks = [];
            let placeholderText = trimmed.replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g, (match) => {
                mathBlocks.push(match);
                return `%%%MATH_${mathBlocks.length - 1}%%%`;
            });
            let formatted = placeholderText
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            formatted = formatted.replace(/^###\s*(.+)$/gm, '<h4 style="font-size:0.92rem; font-weight:800; color:var(--brand-primary); margin:0.5rem 0 0.2rem 0; border-bottom:1px solid var(--brand-border); padding-bottom:0.2rem;">$1</h4>');
            formatted = formatted.replace(/^---\s*$/gm, '<hr style="border:none; border-top:1px dashed var(--border-color); margin:0.5rem 0;">');
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong style="font-weight:700;">$1</strong>');
            formatted = formatted.replace(/^(\d+\.)\s*/gm, '<span style="color:var(--brand-primary); font-weight:800; margin-right:0.3rem;">$1</span>');
            formatted = formatted.replace(/%%%MATH_(\d+)%%%/g, (_, idx) => mathBlocks[idx]);
            return formatted.replace(/\n/g, '<br>');
        }

        // ⚡ 数式検出・超軽量局所MathJaxスケジューラ（数式を含まない9割の通常カードは完全スキップ）
        function containsMathSyntax(text) {
            if (!text || typeof text !== 'string') return false;
            return /(\$|\\\(|\\\[|\\frac|\\sqrt|\\sum|\\int|\\bbox|\\boxed|\\alpha|\\beta|\\theta|\\pm|\\times|\\div|\\neq|\\leqq|\\geqq|\\triangle|\\angle)/.test(text);
        }

        let pendingMathElements = new Set();
        let mathScheduleTimer = null;

        function scheduleMathTypeset(targetOrTargets) {
            if (!window.MathJax || !window.MathJax.typesetPromise) return;

            const targets = Array.isArray(targetOrTargets) ? targetOrTargets : [targetOrTargets];
            targets.forEach(t => {
                if (!t) return;
                if (typeof t === "string") {
                    const el = document.querySelector(t);
                    if (el) collectMathElements(el);
                } else if (t.nodeType === Node.ELEMENT_NODE) {
                    collectMathElements(t);
                }
            });

            function isElementVisible(node) {
                if (!node || !node.isConnected) return false;
                // 折りたたまれた単元アコーディオンや非表示要素内はレンダリングをスキップ
                if (node.closest && node.closest('.group-content.collapsed, [style*="display: none"], [style*="display:none"]')) {
                    return false;
                }
                return true;
            }

            function collectMathElements(container) {
                if (container.classList && container.classList.contains("tex2jax_process")) {
                    if (containsMathSyntax(container.textContent) && isElementVisible(container)) {
                        pendingMathElements.add(container);
                    }
                }
                if (container.querySelectorAll) {
                    const list = container.querySelectorAll(".tex2jax_process");
                    list.forEach(node => {
                        if (containsMathSyntax(node.textContent) && isElementVisible(node)) {
                            pendingMathElements.add(node);
                        }
                    });
                }
            }

            if (pendingMathElements.size === 0) return;

            if (mathScheduleTimer) clearTimeout(mathScheduleTimer);
            mathScheduleTimer = setTimeout(() => {
                const toProcess = Array.from(pendingMathElements);
                pendingMathElements.clear();
                if (toProcess.length === 0) return;

                const executeTypeset = () => {
                    if (typeof MathJax.typesetClear === "function") {
                        try { MathJax.typesetClear(toProcess); } catch (e) {}
                    }
                    MathJax.typesetPromise(toProcess).catch(err => {
                        console.debug("MathJax typeset skipped:", err);
                    });
                };

                if ('requestIdleCallback' in window) {
                    requestIdleCallback(executeTypeset, { timeout: 600 });
                } else {
                    requestAnimationFrame(executeTypeset);
                }
            }, 40);
        }

        // ⚡ 段階的チャンク描画用定数・状態
        const CHUNK_SIZE = 36;
        let insightsDisplayCount = CHUNK_SIZE;
        let memorizeDisplayCount = CHUNK_SIZE;
        let activeInfiniteObservers = {};

        function resetDisplayLimits() {
            insightsDisplayCount = CHUNK_SIZE;
            memorizeDisplayCount = CHUNK_SIZE;
        }

        function setupInfiniteScroll(targetId, onIntersect) {
            const target = document.getElementById(targetId);
            if (!target || !('IntersectionObserver' in window)) return;

            if (activeInfiniteObservers[targetId]) {
                activeInfiniteObservers[targetId].disconnect();
            }

            const observer = new IntersectionObserver((entries) => {
                if (entries[0] && entries[0].isIntersecting) {
                    observer.disconnect();
                    delete activeInfiniteObservers[targetId];
                    onIntersect();
                }
            }, { rootMargin: '350px' });

            observer.observe(target);
            activeInfiniteObservers[targetId] = observer;
        }

        // 🧠 授業・単元・暗記事項の統一ソート関数
        function compareLessonItems(a, b, sortMode) {
            const lessonA = a.lessonId ? rawLessons[a.lessonId] : null;
            const lessonB = b.lessonId ? rawLessons[b.lessonId] : null;

            // 🎯 習得度順（未習得・要復習優先）: weak (1) -> unlearned (2) -> learning (3) -> mastered (4)
            if (sortMode === "mastery_weak_first" || sortMode === "mastery_asc") {
                const getStatusWeight = (item) => {
                    const st = item.status;
                    if (st === "weak") return 1;
                    if (st === "unlearned") return 2;
                    if (st === "learning") return 3;
                    if (st === "mastered") return 4;
                    return 2;
                };
                const weightA = getStatusWeight(a);
                const weightB = getStatusWeight(b);
                if (weightA !== weightB) return weightA - weightB;
                const levelA = typeof a.boxLevel === "number" ? a.boxLevel : 0;
                const levelB = typeof b.boxLevel === "number" ? b.boxLevel : 0;
                if (levelA !== levelB) return levelA - levelB;
                const lapsesA = a.lapses || 0;
                const lapsesB = b.lapses || 0;
                if (lapsesA !== lapsesB) return lapsesB - lapsesA;
                return new Date(b.insightUpdatedAt || b.createdAt || 0) - new Date(a.insightUpdatedAt || a.createdAt || 0);
            }

            // 🏆 習得度順（覚えた・習得済優先）: mastered (1) -> learning (2) -> weak (3) -> unlearned (4)
            if (sortMode === "mastery_mastered_first" || sortMode === "mastery_desc") {
                const getStatusWeightDesc = (item) => {
                    const st = item.status;
                    if (st === "mastered") return 1;
                    if (st === "learning") return 2;
                    if (st === "weak") return 3;
                    if (st === "unlearned") return 4;
                    return 4;
                };
                const weightA = getStatusWeightDesc(a);
                const weightB = getStatusWeightDesc(b);
                if (weightA !== weightB) return weightA - weightB;
                const levelA = typeof a.boxLevel === "number" ? a.boxLevel : 0;
                const levelB = typeof b.boxLevel === "number" ? b.boxLevel : 0;
                if (levelA !== levelB) return levelB - levelA;
                return new Date(b.insightUpdatedAt || b.createdAt || 0) - new Date(a.insightUpdatedAt || a.createdAt || 0);
            }

            // 🔥 忘却期日順 (SRS期日順: 今日以前の期限切れが最優先、未着手、未来期日)
            if (sortMode === "srs_due") {
                const today = getTodayStr();
                const getDueScore = (item) => {
                    if (item.status === "weak") return 0;
                    if (!item.nextReviewDate) return item.status === "mastered" ? 999999 : 10;
                    if (item.nextReviewDate <= today) return 1;
                    const diffDays = (new Date(item.nextReviewDate) - new Date(today)) / (1000 * 60 * 60 * 24);
                    return 100 + diffDays;
                };
                const scoreA = getDueScore(a);
                const scoreB = getDueScore(b);
                if (scoreA !== scoreB) return scoreA - scoreB;
                return new Date(b.insightUpdatedAt || b.createdAt || 0) - new Date(a.insightUpdatedAt || a.createdAt || 0);
            }

            if (sortMode === "custom") {
                const ordA = lessonA && typeof lessonA.orderIndex === "number" ? lessonA.orderIndex : 999999;
                const ordB = lessonB && typeof lessonB.orderIndex === "number" ? lessonB.orderIndex : 999999;
                if (ordA !== ordB) return ordA - ordB;
                const timeA = lessonA ? (lessonA.createdAt || 0) : new Date(a.createdAt || 0).getTime();
                const timeB = lessonB ? (lessonB.createdAt || 0) : new Date(b.createdAt || 0).getTime();
                if (timeA !== timeB) return timeA - timeB;
                return (a.orderIndex || 0) - (b.orderIndex || 0);
            }
            if (sortMode === "lesson_desc") {
                const timeA = lessonA ? (lessonA.createdAt || 0) : new Date(a.createdAt || 0).getTime();
                const timeB = lessonB ? (lessonB.createdAt || 0) : new Date(b.createdAt || 0).getTime();
                return timeB - timeA;
            }
            if (sortMode === "lesson_asc") {
                const timeA = lessonA ? (lessonA.createdAt || 0) : new Date(a.createdAt || 0).getTime();
                const timeB = lessonB ? (lessonB.createdAt || 0) : new Date(b.createdAt || 0).getTime();
                return timeA - timeB;
            }
            if (sortMode === "lesson_title") {
                const titleA = (lessonA && lessonA.title) || a.short_title || a.field || "";
                const titleB = (lessonB && lessonB.title) || b.short_title || b.field || "";
                return titleA.localeCompare(titleB, "ja");
            }
            if (sortMode === "oldest") {
                return new Date(a.insightUpdatedAt || a.createdAt || 0) - new Date(b.insightUpdatedAt || b.createdAt || 0);
            }
            if (sortMode === "subject") {
                const subA = (a.subject || "") + (a.field || "");
                const subB = (b.subject || "") + (b.field || "");
                return subA.localeCompare(subB, "ja");
            }
            // newest (デフォルト)
            return new Date(b.insightUpdatedAt || b.createdAt || 0) - new Date(a.insightUpdatedAt || a.createdAt || 0);
        }

        // 🧠 1. 気づきメモ描画（段階的読み込み & 局所数式レンダリング）
        function renderInsights(isLoadMore = false) {
            const container = document.getElementById("view-insights");
            const query = searchInput.value.trim().toLowerCase();
            const subject = subjectSelect.value;
            const sort = sortSelect.value;
            const selectedLesson = lessonFilterSelect ? lessonFilterSelect.value : "ALL";

            let items = [
                ...Object.values(rawProblems).filter(p => p && p.insight && p.insight.trim() !== "").map(p => ({ ...p, sourceType: "problem" })),
                ...buildLessonMemoItems()
            ];

            if (subject !== "ALL") items = items.filter(p => (p.subject || "未分類") === subject);
            if (isUnitFilterActive()) {
                items = items.filter(p => isUnitSelected(p.lessonId, p.field, p.short_title));
            } else if (selectedLesson !== "ALL") {
                items = items.filter(p => p.lessonId === selectedLesson || p.field === selectedLesson || p.short_title === selectedLesson);
            }
            if (filterPinnedOnly) items = items.filter(p => !!p.isPinned);
            if (query) {
                items = items.filter(p =>
                    (p.insight || "").toLowerCase().includes(query) ||
                    (p.short_title || "").toLowerCase().includes(query) ||
                    (p.field || "").toLowerCase().includes(query) ||
                    (p.title || "").toLowerCase().includes(query)
                );
            }

            // ソート（スター付きは常に最優先）
            items.sort((a, b) => {
                if (a.isPinned !== b.isPinned) return a.isPinned ? -1 : 1;
                return compareLessonItems(a, b, sort);
            });

            if (items.length === 0) {
                container.innerHTML = "";
                showEmptyNotice("該当する「気づき・極意メモ」が見つかりませんでした。");
                return;
            }
            hideEmptyNotice();

            // 単元グループ化の処理
            if (isGrouped) {
                const groups = {};
                items.forEach(p => {
                    const key = `${p.subject || "未分類"} ＞ ${p.field || "全般"}`;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(p);
                });

                container.innerHTML = Object.entries(groups).map(([groupKey, groupItems]) => {
                    const isExpanded = expandedGroups.has(groupKey);
                    const rowsHtml = insightViewMode === "card"
                        ? `<div class="insight-grid">${groupItems.map(p => renderCardHtml(p)).join("")}</div>`
                        : `<div class="insight-compact-list">${groupItems.map(p => renderCompactRowHtml(p)).join("")}</div>`;

                    return `
                        <div class="group-section">
                            <div class="group-header ${isExpanded ? '' : 'collapsed'}" data-group="${groupKey}">
                                <span>📁 ${groupKey} (${groupItems.length}件)</span>
                                <span class="group-chevron">▼</span>
                            </div>
                            <div class="group-content ${isExpanded ? '' : 'collapsed'}" data-content="${groupKey}">
                                ${rowsHtml}
                            </div>
                        </div>
                    `;
                }).join("");

                // アコーディオン開閉
                container.querySelectorAll(".group-header").forEach(header => {
                    header.addEventListener("click", () => {
                        const key = header.getAttribute("data-group");
                        if (expandedGroups.has(key)) expandedGroups.delete(key);
                        else expandedGroups.add(key);
                        renderInsights();
                    });
                });

            } else {
                // フラット表示（⚡ 段階的チャンク描画）
                const totalItems = items.length;
                const visibleItems = items.slice(0, insightsDisplayCount);
                const hasMore = totalItems > insightsDisplayCount;

                const cardsHtml = insightViewMode === "card"
                    ? `<div class="insight-grid">${visibleItems.map(p => renderCardHtml(p)).join("")}</div>`
                    : `<div class="insight-compact-list">${visibleItems.map(p => renderCompactRowHtml(p)).join("")}</div>`;

                let loadMoreHtml = "";
                if (hasMore) {
                    const remaining = totalItems - insightsDisplayCount;
                    loadMoreHtml = `
                        <div class="load-more-wrap" id="insights-load-more-wrap">
                            <button type="button" class="load-more-btn" id="btn-insights-load-more">
                                <span>▼ さらに読み込む（残り ${remaining} 件）</span>
                            </button>
                            <span class="load-more-info">全 ${totalItems} 件中 ${visibleItems.length} 件を表示中</span>
                        </div>
                    `;
                }

                container.innerHTML = cardsHtml + loadMoreHtml;

                if (hasMore) {
                    const btn = document.getElementById("btn-insights-load-more");
                    if (btn) {
                        btn.onclick = () => {
                            insightsDisplayCount += CHUNK_SIZE;
                            renderInsights(true);
                        };
                    }
                    setupInfiniteScroll("insights-load-more-wrap", () => {
                        insightsDisplayCount += CHUNK_SIZE;
                        renderInsights(true);
                    });
                }
            }

            // ⚡ 数式記法を含む要素だけをピンポイントで非同期レンダリング
            scheduleMathTypeset(container);
        }

        // 🧠【新設】暗記事項ビュー（単元・分類別一覧 or カードグリッド ＆ 状態絞り込み対応）
        function renderMemorize(isLoadMore = false) {
            const container = document.getElementById("view-memorize");
            const query = searchInput.value.trim().toLowerCase();
            const subject = subjectSelect.value;
            const sort = sortSelect.value;
            const selectedLesson = lessonFilterSelect ? lessonFilterSelect.value : "ALL";

            let items = buildMemorizationItems();

            if (subject !== "ALL") items = items.filter(p => (p.subject || "未分類") === subject);
            if (isUnitFilterActive()) {
                items = items.filter(p => selectedInsightUnitIds.has(p.lessonId));
            } else if (selectedLesson !== "ALL") {
                items = items.filter(p => p.lessonId === selectedLesson);
            }
            if (query) {
                items = items.filter(p =>
                    (p.insight || "").toLowerCase().includes(query) ||
                    (p.short_title || "").toLowerCase().includes(query) ||
                    (p.field || "").toLowerCase().includes(query) ||
                    (p.category || "").toLowerCase().includes(query) ||
                    (p.question || "").toLowerCase().includes(query) ||
                    (p.answer || "").toLowerCase().includes(query)
                );
            }

            // 状態（ステータス）フィルター
            if (memorizeStatusFilter === "unlearned") {
                items = items.filter(p => p.status === "unlearned");
            } else if (memorizeStatusFilter === "mastered") {
                items = items.filter(p => p.status === "mastered");
            } else if (memorizeStatusFilter === "weak") {
                items = items.filter(p => p.status === "weak");
            }

            items.sort((a, b) => compareLessonItems(a, b, sort));

            if (items.length === 0) {
                container.innerHTML = "";
                showEmptyNotice("該当する「暗記事項」が見つかりませんでした。条件を変更するか、「＋ 単語追加」から新しいカードを登録してください。");
                return;
            }
            hideEmptyNotice();

            // 単元・分類グループ表示（単語帳・辞書ビュー）
            if (memorizeViewMode === "grouped") {
                renderMemorizeGrouped(container, items);
                scheduleMathTypeset(container);
                return;
            }

            // グリッド（カード一覧） or 爆速リスト表示
            const totalItems = items.length;
            const visibleItems = items.slice(0, memorizeDisplayCount);
            const hasMore = totalItems > memorizeDisplayCount;

            const mainHtml = memorizeViewMode === "compact"
                ? `<div class="insight-compact-list">${visibleItems.map(p => renderMemorizeCompactRowHtml(p)).join("")}</div>`
                : `<div class="insight-grid">${visibleItems.map(p => renderMemorizeCardHtml(p)).join("")}</div>`;

            let loadMoreHtml = "";
            if (hasMore) {
                const remaining = totalItems - memorizeDisplayCount;
                loadMoreHtml = `
                    <div class="load-more-wrap" id="memorize-load-more-wrap">
                        <button type="button" class="load-more-btn" id="btn-memorize-load-more">
                            <span>▼ さらに読み込む（残り ${remaining} 件）</span>
                        </button>
                        <span class="load-more-info">全 ${totalItems} 件中 ${visibleItems.length} 件を表示中</span>
                    </div>
                `;
            }

            container.innerHTML = mainHtml + loadMoreHtml;

            if (hasMore) {
                const btn = document.getElementById("btn-memorize-load-more");
                if (btn) {
                    btn.onclick = () => {
                        memorizeDisplayCount += CHUNK_SIZE;
                        renderMemorize(true);
                    };
                }
                setupInfiniteScroll("memorize-load-more-wrap", () => {
                    memorizeDisplayCount += CHUNK_SIZE;
                    renderMemorize(true);
                });
            }

            // ⚡ 数式記法を含む要素だけをピンポイントで非同期レンダリング
            scheduleMathTypeset(container);
        }

        // 🧠 単元・教科別の辞書・単語帳ビュー（オンデマンド遅延描画で3000件超も爆速描画）
        let dictUnitItemsDataMap = {};
        let expandedDictUnits = new Set();

        function renderMemorizeGrouped(container, items) {
            dictUnitItemsDataMap = {};
            const query = searchInput.value.trim().toLowerCase();
            const groupedBySubject = {};

            items.forEach(item => {
                const subj = item.subject || "未分類";
                if (!groupedBySubject[subj]) groupedBySubject[subj] = {};
                const lid = item.lessonId || "standalone";
                if (!groupedBySubject[subj][lid]) groupedBySubject[subj][lid] = [];
                groupedBySubject[subj][lid].push(item);
            });

            const totalUnitsCount = Object.values(groupedBySubject).reduce((acc, lMap) => acc + Object.keys(lMap).length, 0);
            const totalWordsCount = items.length;

            // 検索実行時はマッチした単元を自動展開、それ以外は以前開いた単元、または単元数が1個の時だけ展開
            const autoExpandAll = query.length > 0;

            let html = `
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.6rem; margin-bottom:1rem; padding:0.6rem 1rem; background:var(--bg-surface); border:1px solid var(--border-color); border-radius:var(--radius-md); box-shadow:var(--shadow-xs);">
                    <div style="font-size:0.84rem; font-weight:700; color:var(--text-primary); display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                        <span>📚 単元・分類別辞書</span>
                        <span style="font-size:0.75rem; color:var(--text-muted); font-weight:normal;">（全 ${totalUnitsCount} 単元 ｜ ${totalWordsCount} 語）</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:0.45rem; flex-wrap:wrap;">
                        <button type="button" class="flora-btn ${isRedSheetActive ? 'flora-btn-primary' : 'flora-btn-secondary'}" id="dict-red-sheet-btn" style="font-size:0.74rem; font-weight:700; padding:0.25rem 0.65rem;" onclick="toggleRedSheetMode()" title="赤シートのように解答・解説を隠し、タップした項目だけめくって答え合わせができます">
                            ${isRedSheetActive ? '👁️ 解答をすべて表示' : '📕 赤シート（解答を隠す）'}
                        </button>
                        <button type="button" class="flora-btn flora-btn-secondary" style="font-size:0.74rem; font-weight:700; padding:0.25rem 0.65rem;" onclick="expandAllDictUnits()">
                            ▼ すべて展開
                        </button>
                        <button type="button" class="flora-btn flora-btn-secondary" style="font-size:0.74rem; font-weight:700; padding:0.25rem 0.65rem;" onclick="collapseAllDictUnits()">
                            ▲ すべて折りたたむ
                        </button>
                    </div>
                </div>
                <div class="dict-units-container">
            `;

            let isFirstUnit = true;
            const currentSort = sortSelect ? sortSelect.value : "custom";

            Object.entries(groupedBySubject).forEach(([subj, lessonMap]) => {
                const subjectTotalWords = Object.values(lessonMap).reduce((sum, list) => sum + list.length, 0);
                html += `
                    <div class="dict-subject-divider">
                        <span>📚 ${escapeHtml(subj)}</span>
                        <span style="font-size:0.75rem; font-weight:normal; opacity:0.85;">(${subjectTotalWords} 語)</span>
                    </div>
                `;

                // 📚 教科内での授業リストをソート
                const lessonEntries = Object.entries(lessonMap);
                lessonEntries.sort(([lidA, itemsA], [lidB, itemsB]) => {
                    const lessonA = rawLessons[lidA] || {};
                    const lessonB = rawLessons[lidB] || {};

                    if (currentSort === "custom") {
                        const ordA = typeof lessonA.orderIndex === "number" ? lessonA.orderIndex : 999999;
                        const ordB = typeof lessonB.orderIndex === "number" ? lessonB.orderIndex : 999999;
                        if (ordA !== ordB) return ordA - ordB;
                        return (lessonA.createdAt || 0) - (lessonB.createdAt || 0);
                    }
                    if (currentSort === "lesson_desc") {
                        return (lessonB.createdAt || 0) - (lessonA.createdAt || 0);
                    }
                    if (currentSort === "lesson_asc") {
                        return (lessonA.createdAt || 0) - (lessonB.createdAt || 0);
                    }
                    if (currentSort === "lesson_title") {
                        const titleA = lessonA.title || (itemsA[0] && itemsA[0].short_title) || "";
                        const titleB = lessonB.title || (itemsB[0] && itemsB[0].short_title) || "";
                        return titleA.localeCompare(titleB, "ja");
                    }
                    if (currentSort === "words_desc") {
                        return itemsB.length - itemsA.length;
                    }
                    if (currentSort === "mastery_asc" || currentSort === "mastery_weak_first") {
                        const mastA = itemsA.filter(p => p.status === "mastered").length / (itemsA.length || 1);
                        const mastB = itemsB.filter(p => p.status === "mastered").length / (itemsB.length || 1);
                        return mastA - mastB;
                    }
                    if (currentSort === "mastery_mastered_first") {
                        const mastA = itemsA.filter(p => p.status === "mastered").length / (itemsA.length || 1);
                        const mastB = itemsB.filter(p => p.status === "mastered").length / (itemsB.length || 1);
                        return mastB - mastA;
                    }
                    if (currentSort === "srs_due") {
                        const today = getTodayStr();
                        const dueA = itemsA.filter(p => p.status === "weak" || (p.nextReviewDate && p.nextReviewDate <= today)).length;
                        const dueB = itemsB.filter(p => p.status === "weak" || (p.nextReviewDate && p.nextReviewDate <= today)).length;
                        return dueB - dueA;
                    }
                    if (currentSort === "oldest") {
                        const timeA = Math.min(...itemsA.map(p => new Date(p.insightUpdatedAt || p.createdAt || 0).getTime()));
                        const timeB = Math.min(...itemsB.map(p => new Date(p.insightUpdatedAt || p.createdAt || 0).getTime()));
                        return timeA - timeB;
                    }
                    // newest
                    const timeA = Math.max(...itemsA.map(p => new Date(p.insightUpdatedAt || p.createdAt || 0).getTime()));
                    const timeB = Math.max(...itemsB.map(p => new Date(p.insightUpdatedAt || p.createdAt || 0).getTime()));
                    return timeB - timeA;
                });

                const totalLessonsInSubj = lessonEntries.length;

                lessonEntries.forEach(([lid, unitItems], lessonIdx) => {
                    const unitId = `${subj}_${lid}`;
                    // 単元内の単語リストも指定のソート順（習得度順など）でソート
                    unitItems.sort((a, b) => compareLessonItems(a, b, currentSort));
                    dictUnitItemsDataMap[unitId] = unitItems;

                    // 初期展開フラグ：検索時は全開、または以前開いた単元、または最初の1単元のみ開く
                    const isExpanded = autoExpandAll || expandedDictUnits.has(unitId) || (isFirstUnit && totalUnitsCount <= 3);
                    if (isExpanded) expandedDictUnits.add(unitId);
                    isFirstUnit = false;

                    const lessonTitle = (unitItems[0] && unitItems[0].short_title) || "暗記単元";
                    const totalCount = unitItems.length;
                    const masteredCount = unitItems.filter(p => p.status === "mastered").length;
                    const unlearnedCount = unitItems.filter(p => p.status === "unlearned").length;
                    const weakCount = unitItems.filter(p => p.status === "weak").length;
                    const pct = totalCount > 0 ? Math.round((masteredCount / totalCount) * 100) : 0;

                    const canMoveUp = lessonIdx > 0;
                    const canMoveDown = lessonIdx < totalLessonsInSubj - 1;

                    // ⚡ 遅延描画（Lazy Render）：展開されている単元のみ初期HTMLを生成、折りたたみ単元は開いた時にオンデマンド生成
                    const wordsHtml = isExpanded ? unitItems.map(p => renderDictWordRow(p)).join("") : "";

                    html += `
                        <div class="dict-unit-item ${isExpanded ? '' : 'collapsed'}" id="dict-unit-${unitId}" data-unit-id="${unitId}">
                            <div class="dict-unit-header" onclick="toggleDictUnitCollapse('${unitId}', event)">
                                <div class="dict-unit-title-row">
                                    <span class="badge badge-physics" style="font-size:0.74rem;">${escapeHtml(subj)}</span>
                                    <span class="dict-unit-title">📘 ${escapeHtml(lessonTitle)}</span>
                                    <span class="dict-unit-badge">${totalCount} 語</span>
                                </div>
                                <div class="dict-unit-stats">
                                    <div class="dict-progress-box">
                                        <div class="dict-progress-bar-bg">
                                            <div class="dict-progress-bar-fill" style="width:${pct}%;"></div>
                                        </div>
                                        <span class="dict-progress-text">✅ ${masteredCount}/${totalCount} 習得 (${pct}%) ｜ 🌱 未習得 ${unlearnedCount}${weakCount > 0 ? ` ｜ 🔄 要復習 ${weakCount}` : ''}</span>
                                    </div>
                                    <div style="display:flex; align-items:center; gap:0.4rem;" onclick="event.stopPropagation();">
                                        <!-- 📚 授業並べ替え操作ボタン -->
                                        <div style="display:inline-flex; align-items:center; gap:0.2rem; background:var(--bg-subtle); padding:0.15rem 0.25rem; border-radius:var(--radius-sm); border:1px solid var(--border-color);" title="同一教科内での授業の表示順を並べ替え">
                                            <button type="button" class="dict-lesson-order-btn" onclick="moveDictLessonOrder('${escapeHtml(subj)}', '${lid}', -1, event)" ${canMoveUp ? '' : 'disabled'} title="この授業を1つ上に移動">▲</button>
                                            <button type="button" class="dict-lesson-order-btn" onclick="moveDictLessonOrder('${escapeHtml(subj)}', '${lid}', 1, event)" ${canMoveDown ? '' : 'disabled'} title="この授業を1つ下に移動">▼</button>
                                        </div>
                                        <button type="button" class="flora-btn flora-btn-secondary" style="font-size:0.75rem; font-weight:700; padding:0.28rem 0.65rem; color:#059669; border-color:rgba(16,185,129,0.4);" onclick="openCustomTestForLesson('${lid}', event)" title="この単元だけで絞り込みテストを開始">
                                            🎯 この単元をテスト
                                        </button>
                                        <button type="button" class="flora-btn flora-btn-secondary" style="font-size:0.75rem; font-weight:700; padding:0.28rem 0.65rem;" onclick="openAddWordModal('${lid}', '${escapeHtml(subj)}', event)" title="この単元に新しい単語を追加">
                                            ＋ 単語追加
                                        </button>
                                        <button type="button" class="dict-unit-collapse-btn ${isExpanded ? '' : 'collapsed'}" onclick="toggleDictUnitCollapse('${unitId}', event)" title="開閉">
                                            ▼
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="dict-word-list" style="display: ${isExpanded ? 'flex' : 'none'};" data-loaded="${isExpanded ? 'true' : 'false'}">
                                ${wordsHtml}
                            </div>
                        </div>
                    `;
                });
            });

            html += `</div>`;
            container.innerHTML = html;

            // 初期展開されている単元のみ数式をピンポイント処理
            const activeLists = container.querySelectorAll('.dict-word-list[data-loaded="true"]');
            if (activeLists.length > 0) {
                activeLists.forEach(list => scheduleMathTypeset(list));
            }
        }

        // 🧠 単語帳ビューの1行アイテム
        function renderDictWordRow(p) {
            let statusClass = "unlearned";
            let statusLabel = "🌱 未習得";
            let statusTitle = "クリックで「覚えた！」に変更";
            if (p.status === "mastered") {
                statusClass = "mastered";
                statusLabel = `✅ 覚えた (Lv.${p.boxLevel})`;
                statusTitle = "クリックで未習得に戻す";
            } else if (p.status === "weak") {
                statusClass = "weak";
                statusLabel = "🔄 要復習";
                statusTitle = "クリックで「覚えた！」に変更";
            } else if (p.status === "learning") {
                statusClass = "learning";
                statusLabel = `⚡ 復習中 (Lv.${p.boxLevel})`;
                statusTitle = "クリックで「覚えた！」に変更";
            }

            const cleanQ = (p.question || "").trim().replace(/^(?:Q[.:：]|問題[.:：]?)\s*/i, "") || p.rawContent || "";
            const cleanA = (p.answer || "").trim().replace(/^(?:A[.:：]|答え[.:：]?|解答[.:：]?)\s*/i, "") || p.rawContent || "";

            const cardMemoKey = `${p.lessonId}_${p.memoId}`;
            const userMemoObj = (typeof rawCardUserMemos !== "undefined" && rawCardUserMemos) ? (rawCardUserMemos[cardMemoKey] || rawCardUserMemos[`memorize_${p.lessonId}_${p.memoId}`]) : null;
            const userMemoText = userMemoObj?.memo ? userMemoObj.memo.trim() : '';

            // 📕 赤シート状態の判定
            const wordKey = `${p.lessonId}:${p.memoId}`;
            const isRevealed = revealedWordKeys.has(wordKey);
            const isCovered = isRedSheetActive && !isRevealed;
            const aTitle = isRedSheetActive
                ? (isRevealed ? "クリックで解答を再び隠す（赤シート）" : "クリックで解答を表示（赤シート）")
                : "クリックして編集";

            return `
                <div class="dict-word-row">
                    <button type="button" class="dict-status-btn ${statusClass}" onclick="toggleMemorizeMastered('${p.lessonId}', '${p.memoId}', event)" title="${statusTitle}">
                        ${statusLabel}
                    </button>
                    <div class="dict-q-box tex2jax_process" onclick="startEditMemorizeFromInsights('${p.lessonId}', '${p.memoId}', event)" title="クリックして編集">
                        <span style="font-weight:800; color:#4338ca; font-size:0.75rem; margin-right:0.35rem; background:rgba(99,102,241,0.1); padding:0.15rem 0.35rem; border-radius:4px;">Q.</span>${normalizeMathSyntax(cleanQ)}
                    </div>
                    <div class="dict-a-box tex2jax_process ${isCovered ? 'is-covered' : 'is-revealed'}" data-lesson-id="${p.lessonId}" data-memo-id="${p.memoId}" onclick="handleDictAnswerClick('${p.lessonId}', '${p.memoId}', event)" title="${aTitle}">
                        <div class="red-sheet-cover">
                            <span>📕 タップして解答を表示</span>
                        </div>
                        <div class="dict-a-content">
                            <span style="font-weight:800; color:#059669; font-size:0.75rem; margin-right:0.35rem; background:rgba(16,185,129,0.12); padding:0.15rem 0.35rem; border-radius:4px;">A.</span>${normalizeMathSyntax(cleanA)}
                            ${p.rawNote ? `<div style="font-size:0.75rem; color:#d97706; margin-top:0.3rem; background:rgba(245,158,11,0.08); padding:0.25rem 0.5rem; border-radius:4px;">💡 ${normalizeMathSyntax(p.rawNote)}</div>` : ''}
                            ${userMemoText ? `<div style="font-size:0.75rem; color:#059669; margin-top:0.3rem; background:rgba(16,185,129,0.08); padding:0.25rem 0.5rem; border-radius:4px; border-left:3px solid #10B981;">📝 <strong>自分用メモ:</strong> ${escapeHtml(userMemoText)}</div>` : ''}
                        </div>
                        ${isRedSheetActive && isRevealed ? `<span class="red-sheet-peek-indicator" title="クリックで隠す">👁️ 表示中</span>` : ''}
                    </div>
                    <div class="dict-meta-actions-wrap">
                        ${p.rawCategory ? `<span class="dict-cat-tag">🏷️ ${escapeHtml(p.rawCategory)}</span>` : ''}
                        <div class="dict-row-actions">
                            ${isRedSheetActive ? `
                                <button type="button" class="dict-row-btn" style="color:${isCovered ? '#ef4444' : 'var(--accent-cyan)'}; font-weight:700;" onclick="handleDictAnswerClick('${p.lessonId}', '${p.memoId}', event)" title="${isCovered ? '解答を表示' : '解答を隠す'}">
                                    ${isCovered ? '📕 めくる' : '👁️ 隠す'}
                                </button>
                            ` : ''}
                            <button type="button" class="dict-row-btn" style="color:#059669; border-color:rgba(16,185,129,0.35); font-weight:700;" onclick="startFlashcardForCard('memorize', '${p.lessonId}', '${p.memoId}', event)" title="このカードから演習">🎴 テスト</button>
                            <button type="button" class="dict-row-btn" style="color:var(--accent-cyan);" onclick="startEditMemorizeFromInsights('${p.lessonId}', '${p.memoId}', event)" title="編集">✏️</button>
                            <button type="button" class="dict-row-btn" style="color:var(--error);" onclick="deleteMemorizeFromInsights('${p.lessonId}', '${p.memoId}', event)" title="削除">🗑</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 🧠 単元の開閉トグル（オンデマンドで単語リストを描画）
        window.toggleDictUnitCollapse = function(unitId, e) {
            if (e) e.stopPropagation();
            const unitEl = document.getElementById(`dict-unit-${unitId}`);
            if (!unitEl) return;

            const listEl = unitEl.querySelector(".dict-word-list");
            const btnEl = unitEl.querySelector(".dict-unit-collapse-btn");

            const willExpand = unitEl.classList.contains("collapsed");

            if (willExpand) {
                expandedDictUnits.add(unitId);
                unitEl.classList.remove("collapsed");
                if (btnEl) btnEl.classList.remove("collapsed");

                // まだ単語HTMLが未生成の場合はオンデマンド生成
                if (listEl) {
                    if (listEl.getAttribute("data-loaded") !== "true") {
                        const items = dictUnitItemsDataMap[unitId] || [];
                        listEl.innerHTML = items.map(p => renderDictWordRow(p)).join("");
                        listEl.setAttribute("data-loaded", "true");
                    }
                    listEl.style.display = "flex";
                    scheduleMathTypeset(listEl);
                }
            } else {
                expandedDictUnits.delete(unitId);
                unitEl.classList.add("collapsed");
                if (btnEl) btnEl.classList.add("collapsed");
                if (listEl) {
                    listEl.style.display = "none";
                }
            }
        };

        // 🧠 すべての単元を展開
        window.expandAllDictUnits = function() {
            Object.keys(dictUnitItemsDataMap).forEach(unitId => {
                expandedDictUnits.add(unitId);
                const unitEl = document.getElementById(`dict-unit-${unitId}`);
                if (unitEl) {
                    unitEl.classList.remove("collapsed");
                    const btnEl = unitEl.querySelector(".dict-unit-collapse-btn");
                    if (btnEl) btnEl.classList.remove("collapsed");
                    const listEl = unitEl.querySelector(".dict-word-list");
                    if (listEl) {
                        if (listEl.getAttribute("data-loaded") !== "true") {
                            const items = dictUnitItemsDataMap[unitId] || [];
                            listEl.innerHTML = items.map(p => renderDictWordRow(p)).join("");
                            listEl.setAttribute("data-loaded", "true");
                        }
                        listEl.style.display = "flex";
                        scheduleMathTypeset(listEl);
                    }
                }
            });
        };

        // 🧠 すべての単元を折りたたむ
        window.collapseAllDictUnits = function() {
            expandedDictUnits.clear();
            Object.keys(dictUnitItemsDataMap).forEach(unitId => {
                const unitEl = document.getElementById(`dict-unit-${unitId}`);
                if (unitEl) {
                    unitEl.classList.add("collapsed");
                    const btnEl = unitEl.querySelector(".dict-unit-collapse-btn");
                    if (btnEl) btnEl.classList.add("collapsed");
                    const listEl = unitEl.querySelector(".dict-word-list");
                    if (listEl) {
                        listEl.style.display = "none";
                    }
                }
            });
        };

        window.openCustomTestForLesson = function(lessonId, e) {
            if (e) e.stopPropagation();
            selectedLessonFilterIds.clear();
            selectedLessonFilterIds.add(lessonId);
            openLessonPickerModal();
        };

        // リッチ対比カードのHTML
        function renderCardHtml(p) {
            if (p.sourceType === "lesson") return renderLessonMemoCardHtml(p);
            if (p.sourceType === "memorize") return renderMemorizeCardHtml(p);

            const isEditing = editingProblemId === p.id;
            const starClass = p.isPinned ? "active" : "";
            const pinnedClass = p.isPinned ? "pinned" : "";
            const safeTitle = (p.short_title || p.field || "問題").replace(/'/g, "\\'");

            const bodyContent = isEditing
                ? `
                    <div style="display:flex; flex-direction:column; gap:0.4rem;">
                        <div>
                            <label style="font-size:0.72rem; color:var(--text-muted); display:block; margin-bottom:0.15rem;">教科（科目）:</label>
                            <select id="inline-subject-${p.id}" style="width:100%; box-sizing:border-box; padding:0.3rem 0.5rem; font-size:0.78rem; background:var(--bg-subtle); border:1px solid var(--border-color); border-radius:var(--radius-sm); color:var(--text-primary);">
                                ${AVAILABLE_SUBJECTS.map(s => `<option value="${s}" ${s === (p.subject || "公共") ? "selected" : ""}>${s}</option>`).join("")}

                        </div>
                        <textarea class="inline-edit-textarea" id="inline-textarea-${p.id}">${p.insight || ""}</textarea>
                        <div style="display:flex; justify-content:flex-end; gap:0.4rem;">
                            <button type="button" class="tactile-btn tactile-btn-secondary" style="font-size:0.75rem; padding:0.25rem 0.6rem;" onclick="cancelEditInsight(event)">キャンセル</button>
                            <button type="button" class="tactile-btn" style="font-size:0.75rem; padding:0.25rem 0.6rem; background:var(--accent-cyan); color:#000;" onclick="saveInlineInsight('${p.id}', event)">💾 保存</button>
                        </div>
                    </div>
                `
                : `<div class="insight-text tex2jax_process" onclick="startEditInsight('${p.id}', event)" title="クリックしてその場で編集">${normalizeMathSyntax(p.insight)}</div>`;

            return `
                <div class="insight-card ${pinnedClass}">
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.4rem; margin-bottom:0.6rem;">
                            <span class="badge badge-physics" style="cursor:pointer; display:inline-flex; align-items:center; gap:0.25rem;" onclick="openQuickSubjectModal('problem', '${p.id}', '${safeTitle}', event)" title="クリックして教科を変更">
                                <span>${p.subject || "未分類"} // ${p.field || "未分類"}</span>
                                <span style="font-size:0.68rem; opacity:0.75;">▾</span>
                            </span>
                            <div style="display:flex; align-items:center; gap:0.5rem;">
                                <span style="font-size:0.72rem; color:var(--text-muted);">🗓️ ${formatDate(p.insightUpdatedAt || p.createdAt)}</span>
                                <button type="button" class="star-btn ${starClass}" onclick="togglePin('${p.id}', event)" title="スター（最上部に固定）">★</button>
                            </div>
                        </div>

                        <!-- 上半分：問題の型プレビュー -->
                        <div class="insight-problem-preview">
                            <div class="insight-problem-title">📌 ${p.short_title || "問題"}</div>
                            <div class="insight-problem-snippet tex2jax_process">${formatQuestionText(p.title || "（問題文なし）")}</div>
                        </div>

                    <!-- 下半分：掴んだ極意 -->
                    <div class="insight-body-box">
                        <div class="insight-body-label">
                            <span>🧠 掴んだ極意・解法の地図</span>
                            <div style="display:flex; gap:0.6rem;">
                                ${!isEditing ? `<button type="button" style="background:none; border:none; color:var(--accent-cyan); font-size:0.72rem; font-weight:800; cursor:pointer;" onclick="startEditInsight('${p.id}', event)">✏️ 編集</button>` : ''}
                                <button type="button" style="background:none; border:none; color:var(--error); font-size:0.72rem; font-weight:800; cursor:pointer;" onclick="deleteInsight('${p.id}', event)">🗑 削除</button>
                            </div>

                        ${bodyContent}

                    <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px dashed var(--border-color); padding-top:0.6rem; margin-top:auto; gap:0.4rem; flex-wrap:wrap;">

                            </button>

                    </div>
                </div>
            `;
        }

        // 授業メモ（lesson.html）カードのHTML
        function renderLessonMemoCardHtml(p) {
            const starClass = p.isPinned ? "active" : "";
            const pinnedClass = p.isPinned ? "pinned" : "";
            const partLabel = p.partTitle ? `第${p.partIndex + 1}回: ${p.partTitle}` : "";
            const memoKey = `${p.lessonId}:${p.memoId}`;
            const isEditing = editingLessonMemoKey === memoKey;
            const safeLessonTitle = (p.short_title || "授業メモ").replace(/'/g, "\\'");

                    <button type="button" onclick="startTypingForCard('memorize', '${p.lessonId}', '${p.memoId}', event)" style="flex-shrink:0; background:var(--brand-light); border:1px solid var(--brand-border); color:var(--brand-primary); cursor:pointer; font-size:0.74rem; font-weight:700; padding:0.22rem 0.5rem; border-radius:var(--radius-sm);" title="写経タイピング">⌨️ タイプ</button>
                    <button type="button" onclick="startEditMemorizeFromInsights('${p.lessonId}', '${p.memoId}', event)" style="flex-shrink:0; background:none; border:none; color:var(--accent-cyan); cursor:pointer; font-size:0.85rem;" title="編集">✏️</button>
                    <button type="button" onclick="deleteMemorizeFromInsights('${p.lessonId}', '${p.memoId}', event)" style="flex-shrink:0; background:none; border:none; color:var(--error); cursor:pointer; font-size:0.85rem;" title="削除">🗑</button>
                    <a href="lesson.html?id=${encodeURIComponent(p.lessonId)}" class="goto-btn" style="flex-shrink:0;">➔</a>
                </div>
            `;

        // 💬 2. AI質問ログ描画
        function renderQna() {
            const listPane = document.getElementById("qna-list-pane");
            const query = searchInput.value.trim().toLowerCase();
            const subject = subjectSelect.value;
            const sort = sortSelect.value;

            let entries = Object.entries(rawQnaLogs);
            if (subject !== "ALL") entries = entries.filter(([, l]) => (l.subject || "未分類") === subject);
            if (query) {
                entries = entries.filter(([, l]) =>
                    (l.shortTitle || "").toLowerCase().includes(query) ||
                    (l.field || "").toLowerCase().includes(query) ||
                    (l.messages || []).some(m => (m.content || "").toLowerCase().includes(query))
                );
            }

            entries.sort((a, b) => {
                if (sort === "oldest") return new Date(a[1].savedAt || 0) - new Date(b[1].savedAt || 0);
                if (sort === "subject") return (a[1].subject || "").localeCompare(b[1].subject || "", "ja");
                return new Date(b[1].savedAt || 0) - new Date(a[1].savedAt || 0);
            });

            if (entries.length === 0) {
                listPane.innerHTML = "";
                showEmptyNotice("該当する「AI質問ログ」が見つかりませんでした。");
                return;
            }
            hideEmptyNotice();

            listPane.innerHTML = entries.map(([id, log]) => {
                const firstUser = (log.messages || []).find(m => m.role === "user");
                const preview = firstUser ? firstUser.content : "（内容なし）";
                const activeCls = id === selectedQnaLogId ? "active" : "";
                return `
                    <div class="qna-list-item ${activeCls}" data-qna-id="${id}">
                        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.4rem;">
                            <span class="badge badge-physics" style="font-size:0.68rem;">${log.subject || "未分類"} // ${log.field || "未分類"}</span>
                            <span style="font-size:0.68rem; color:var(--text-muted);">${formatDate(log.savedAt)}</span>
                        </div>
                        <div style="font-weight:800; font-size:0.88rem; color:var(--accent-yellow); margin-top:0.3rem;">📌 ${log.shortTitle || "問題"}</div>
                        <div class="qna-item-preview">💬 ${preview}</div>
                    </div>
                `;
            }).join("");

            listPane.querySelectorAll("[data-qna-id]").forEach(el => {
                el.addEventListener("click", () => {
                    selectedQnaLogId = el.getAttribute("data-qna-id");
                    renderQna();
                    renderQnaDetail(selectedQnaLogId);
                });
            });

            if (selectedQnaLogId && rawQnaLogs[selectedQnaLogId]) {
                renderQnaDetail(selectedQnaLogId);
            }
        }

        function renderQnaDetail(logId) {
            const log = rawQnaLogs[logId];
            if (!log) return;

            document.getElementById("qna-detail-subject").textContent = `${log.subject || "未分類"} // ${log.field || "未分類"}`;
            document.getElementById("qna-detail-title").textContent = log.shortTitle || "無題の問題";
            document.getElementById("qna-detail-date").textContent = `🗓️ 記録日時: ${formatDate(log.savedAt)}`;

            const gotoBtn = document.getElementById("qna-detail-goto");
            gotoBtn.style.display = "inline-flex";
            gotoBtn.href = `problem.html?id=${encodeURIComponent(log.problemId)}`;

            const delBtn = document.getElementById("qna-detail-delete");
            delBtn.style.display = "inline-flex";
            delBtn.onclick = async () => {
                if (!confirm("この質問ログを削除しますか？")) return;
                try {
                    await remove(ref(database, 'users/' + currentUser.uid + '/qna_logs/' + logId));
                    selectedQnaLogId = null;
                    showToast("質問ログを削除しました。", "success", 2500);
                } catch (e) {
                    showToast("削除に失敗しました。", "error");
                }
            };

            const problemBox = document.getElementById("qna-detail-problem-box");
            const problemTextEl = document.getElementById("qna-detail-problem-text");
            const sourceProb = rawProblems[log.problemId];
            if (sourceProb && sourceProb.title) {
                problemTextEl.innerHTML = formatQuestionText(sourceProb.title);
                problemBox.style.display = "flex";
            } else {
                problemBox.style.display = "none";
            }

            const stream = document.getElementById("qna-messages-stream");
            stream.innerHTML = (log.messages || []).map(m => {
                const isUser = m.role === "user";
                if (isUser) {
                    let cleanUserText = (m.content || "").trim().replace(/\n{3,}/g, "\n\n");
                    const userContentHtml = formatQuestionText(cleanUserText);
                    return `
                        <div class="chat-turn-wrap chat-turn-user">
                            <div class="chat-bubble bubble-user tex2jax_process">${userContentHtml}</div>
                        </div>
                    `;
                } else {
                    const aiContentHtml = renderFormattedMarkdown(m.content || "");
                    const diagramHtml = m.diagramSvg ? `
                        <div style="margin-top: 0.6rem; border-radius: 8px; overflow: hidden; background: #1e293b; padding: 0.6rem;">
                            ${m.diagramSvg}
                        </div>
                    ` : "";
                    return `
                        <div class="chat-turn-wrap chat-turn-ai">
                            <div class="chat-sender-label">🤖 AIチューター</div>
                            <div class="chat-bubble bubble-ai tex2jax_process">
                                <div>${aiContentHtml}</div>
                                ${diagramHtml}
                            </div>
                        </div>
                    `;
                }
            }).join("");

            // ⚡ 数式記法を含む要素だけをピンポイントで非同期レンダリング
            scheduleMathTypeset([problemBox, stream]);
        }

        // 🎴 3. 語呂合わせ描画
        function renderMnemonics() {
            const container = document.getElementById("view-mnemonics");
            const query = searchInput.value.trim().toLowerCase();

            let items = Object.values(rawProblems).filter(p => p && p.subject === "世界史" && p.mnemonic && p.mnemonic.trim() !== "");

            if (query) {
                items = items.filter(p =>
                    (p.mnemonic || "").toLowerCase().includes(query) ||
                    (p.short_title || "").toLowerCase().includes(query) ||
                    (p.field || "").toLowerCase().includes(query)
                );

            if (items.length === 0) {

                showEmptyNotice("登録済みの「世界史 語呂合わせ」が見つかりませんでした。");

            }

            container.innerHTML = items.map(p => `
                <div class="mnemonic-card">

                        <span style="font-size:0.82rem; font-weight:800; color:var(--accent-yellow);">📌 ${p.short_title || "問題"}</span>
                    </div>
                    <div class="mnemonic-body">🎴 ${p.mnemonic}</div>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.4rem; padding-top:0.4rem; border-top:1px dashed var(--border-color); gap:0.4rem; flex-wrap:wrap;">
                        <div style="display:flex; gap:0.35rem;">
                            <button type="button" class="flashcard-card-btn" onclick="startFlashcardForCard('mnemonic', '${p.id}', '', event)" title="この語呂合わせからフラッシュカード演習を開始">
                                🎴 カード
                            </button>
                            <button type="button" class="typing-card-btn" onclick="startTypingForCard('mnemonic', '${p.id}', '', event)">
                                ⌨️ 写経タイピング

        // 🎯 教科ごとの視認性カラーバッジ生成
        function getSubjectColorBadge(subject) {
            const s = subject || "未分類";
            let bg = "rgba(107, 114, 128, 0.12)";
            let color = "var(--text-secondary)";
            let border = "rgba(107, 114, 128, 0.3)";
            if (s.includes("日本史") || s.includes("歴史")) {
                bg = "rgba(239, 68, 68, 0.12)"; color = "#ef4444"; border = "rgba(239, 68, 68, 0.3)";
            } else if (s.includes("世界史")) {
                bg = "rgba(245, 158, 11, 0.12)"; color = "#d97706"; border = "rgba(245, 158, 11, 0.3)";
            } else if (s.includes("政経") || s.includes("公共") || s.includes("公民") || s.includes("倫理")) {
                bg = "rgba(16, 185, 129, 0.12)"; color = "#059669"; border = "rgba(16, 185, 129, 0.3)";
            } else if (s.includes("地理")) {
                bg = "rgba(20, 184, 166, 0.12)"; color = "#0d9488"; border = "rgba(20, 184, 166, 0.3)";
            } else if (s.includes("英語")) {
                bg = "rgba(59, 130, 246, 0.12)"; color = "#2563eb"; border = "rgba(59, 130, 246, 0.3)";
            } else if (s.includes("国語")) {
                bg = "rgba(236, 72, 153, 0.12)"; color = "#db2777"; border = "rgba(236, 72, 153, 0.3)";
            } else if (s.includes("数学")) {
                bg = "rgba(139, 92, 246, 0.12)"; color = "#7c3aed"; border = "rgba(139, 92, 246, 0.3)";
            } else if (s.includes("物理") || s.includes("化学") || s.includes("生物") || s.includes("地学")) {
                bg = "rgba(6, 182, 212, 0.12)"; color = "#0891b2"; border = "rgba(6, 182, 212, 0.3)";
            } else if (s.includes("情報")) {
                bg = "rgba(99, 102, 241, 0.12)"; color = "#4f46e5"; border = "rgba(99, 102, 241, 0.3)";
            }
            return `<span style="display:inline-flex; align-items:center; font-size:0.72rem; font-weight:800; padding:0.18rem 0.55rem; border-radius:4px; background:${bg}; color:${color}; border:1px solid ${border};">${escapeHtml(s)}</span>`;
        }

        // 🎯 1.7 授業 選択問題（共通テスト形式）描画エンジン
        function renderDrills() {
            const container = document.getElementById("view-drills");
            if (!container) return;

            const query = searchInput.value.trim().toLowerCase();
            const selectedSubject = subjectSelect.value;
            const sort = sortSelect.value;
            const selectedLesson = lessonFilterSelect ? lessonFilterSelect.value : "ALL";

            const allDrills = buildChoiceDrillItems();

            // 統計情報集計（教科・授業絞り込みベース）
            let filteredDrills = allDrills;

            if (selectedSubject !== "ALL") {
                filteredDrills = filteredDrills.filter(d => (d.subject || "未分類") === selectedSubject);
            }
            if (isUnitFilterActive()) {
                filteredDrills = filteredDrills.filter(d => selectedInsightUnitIds.has(d.lessonId));
            } else if (selectedLesson !== "ALL") {
                filteredDrills = filteredDrills.filter(d => d.lessonId === selectedLesson);
            }

            const totalInScope = filteredDrills.length;
            const answeredInScope = filteredDrills.filter(d => d.isAnswered).length;
            const correctInScope = filteredDrills.filter(d => d.isCorrect).length;
            const wrongInScope = answeredInScope - correctInScope;
            const accuracyRate = answeredInScope > 0 ? Math.round((correctInScope / answeredInScope) * 100) : 0;

            const statsBadge = document.getElementById("drills-stats-badge");
            if (statsBadge) {
                statsBadge.innerHTML = `全 <b>${totalInScope}</b> 問 | 解答済: <b>${answeredInScope}</b> 問 (正解: <span style="color:#059669; font-weight:800;">${correctInScope}</span> / 誤答: <span style="color:#dc2626; font-weight:800;">${wrongInScope}</span>) | 正答率: <b>${accuracyRate}%</b>`;
            }

            // 検索クエリ適用
            if (query) {
                filteredDrills = filteredDrills.filter(d =>
                    (d.lead || "").toLowerCase().includes(query) ||
                    (d.lessonTitle || "").toLowerCase().includes(query) ||
                    (d.partTitle || "").toLowerCase().includes(query) ||
                    (d.trap_type || "").toLowerCase().includes(query) ||
                    (d.trap_explanation || "").toLowerCase().includes(query) ||
                    (d.explanation || "").toLowerCase().includes(query) ||
                    (d.statement_a || "").toLowerCase().includes(query) ||
                    (d.statement_b || "").toLowerCase().includes(query) ||
                    (d.options || []).some(opt => (opt.text || "").toLowerCase().includes(query))
                );
            }

            // 状態フィルター適用
            if (drillStatusFilter === "unanswered") {
                filteredDrills = filteredDrills.filter(d => !d.isAnswered);
            } else if (drillStatusFilter === "wrong") {
                filteredDrills = filteredDrills.filter(d => d.isAnswered && !d.isCorrect);
            } else if (drillStatusFilter === "correct") {
                filteredDrills = filteredDrills.filter(d => d.isCorrect);
            }

            // 形式フィルター適用
            if (drillTypeFilter !== "all") {
                filteredDrills = filteredDrills.filter(d => d.type === drillTypeFilter);
            }

            // ソート適用
            filteredDrills.sort((a, b) => {
                if (sort === "lesson_asc") {
                    const timeA = new Date(rawLessons[a.lessonId]?.createdAt || a.createdAt || 0).getTime();
                    const timeB = new Date(rawLessons[b.lessonId]?.createdAt || b.createdAt || 0).getTime();
                    if (timeA !== timeB) return timeA - timeB;
                    return (a.partIndex - b.partIndex);
                } else if (sort === "lesson_desc") {
                    const timeA = new Date(rawLessons[a.lessonId]?.createdAt || a.createdAt || 0).getTime();
                    const timeB = new Date(rawLessons[b.lessonId]?.createdAt || b.createdAt || 0).getTime();
                    if (timeA !== timeB) return timeB - timeA;
                    return (a.partIndex - b.partIndex);
                } else if (sort === "lesson_title") {
                    const tA = a.lessonTitle || "";
                    const tB = b.lessonTitle || "";
                    return tA.localeCompare(tB, "ja");
                } else if (sort === "oldest") {
                    return new Date(a.drillUpdatedAt || 0) - new Date(b.drillUpdatedAt || 0);
                } else {
                    // デフォルト最新順
                    return new Date(b.drillUpdatedAt || b.createdAt || 0) - new Date(a.drillUpdatedAt || a.createdAt || 0);
                }
            });

            if (filteredDrills.length === 0) {
                container.innerHTML = "";
                if (allDrills.length === 0) {
                    showEmptyNotice("選択問題が登録されている授業がまだありません。「授業一覧」から一括生成を実行してください。");
                } else {
                    showEmptyNotice("該当する条件の選択問題が見つかりませんでした。");
                }
                return;
            }
            hideEmptyNotice();

            const TYPE_LABELS = {
                combination: { label: "2文正誤組み合わせ", class: "pill-type-combination" },
                chronological: { label: "年代・順序整序", class: "pill-type-chronological" },
                true_false: { label: "正誤判定", class: "pill-type-true_false" },
                single_choice: { label: "4択問題", class: "pill-type-single_choice" }
            };

            const cardsHtml = filteredDrills.map((d, index) => {
                const isAnswered = d.isAnswered;
                const isCorrect = d.isCorrect === true;
                const cardStatusClass = isAnswered ? (isCorrect ? "status-correct" : "status-wrong") : "";
                const typeInfo = TYPE_LABELS[d.type] || { label: "選択問題", class: "pill-type-single_choice" };
                const subjBadge = getSubjectColorBadge(d.subject || "その他");

                // 文A/文B または 整序文
                let statementsHtml = "";
                if (d.statement_a || d.statement_b) {
                    statementsHtml = `
                        <div class="choice-drill-statements">
                            ${d.statement_a ? `<div class="choice-drill-statement-item"><span class="choice-drill-statement-tag">文 A</span><div style="flex:1;">${renderFormattedMarkdown(d.statement_a)}</div></div>` : ''}
                            ${d.statement_b ? `<div class="choice-drill-statement-item"><span class="choice-drill-statement-tag">文 B</span><div style="flex:1;">${renderFormattedMarkdown(d.statement_b)}</div></div>` : ''}
                        </div>
                    `;
                } else if (Array.isArray(d.statements) && d.statements.length > 0) {
                    const tagLabels = ["ア", "イ", "ウ", "エ", "オ", "カ"];
                    statementsHtml = `
                        <div class="choice-drill-statements">
                            ${d.statements.map((st, sIdx) => `
                                <div class="choice-drill-statement-item">
                                    <span class="choice-drill-statement-tag">${tagLabels[sIdx] || String(sIdx + 1)}</span>
                                    <div style="flex:1;">${renderFormattedMarkdown(st)}</div>
                                </div>
                            `).join("")}
                        </div>
                    `;
                }

                // 選択肢
                const optionsHtml = (d.options || []).map(opt => {
                    let optClass = "";
                    if (isAnswered) {
                        if (opt.number === d.correct_option) {
                            optClass = "opt-correct";
                        } else if (opt.number === d.userAnswer) {
                            optClass = "opt-wrong";
                        } else {
                            optClass = "opt-faded";
                        }
                    }
                    const optNumLabel = ["①", "②", "③", "④", "⑤", "⑥"][opt.number - 1] || `(${opt.number})`;

                    return `
                        <button type="button" class="choice-drill-option-btn ${optClass}" onclick="selectInsightChoiceDrillOption('${escapeHtml(d.lessonId)}', '${escapeHtml(d.id)}', ${opt.number})">
                            <span class="choice-drill-option-num">${optNumLabel}</span>
                            <span style="flex:1; min-width:0; word-break:break-word;">${renderFormattedMarkdown(opt.text)}</span>
                            ${isAnswered && opt.number === d.correct_option ? '<span style="color:#059669; font-weight:800; font-size:0.85rem; margin-left:auto;">✓ 正解</span>' : ''}
                            ${isAnswered && opt.number === d.userAnswer && !isCorrect ? '<span style="color:#dc2626; font-weight:800; font-size:0.85rem; margin-left:auto;">✕ あなたの選択</span>' : ''}
                        </button>
                    `;
                }).join("");

                // 解答後の解説・出題者の罠
                let resultBoxHtml = "";
                if (isAnswered) {
                    const resultBadge = isCorrect
                        ? `<div style="font-size:0.88rem; font-weight:800; color:#059669; display:flex; align-items:center; gap:0.35rem;">🎉 正解！ [正解: ${["①", "②", "③", "④", "⑤"][d.correct_option - 1] || d.correct_option}]</div>`
                        : `<div style="font-size:0.88rem; font-weight:800; color:#dc2626; display:flex; align-items:center; gap:0.35rem;">❌ 不正解（要復習） [あなたの選択: ${["①", "②", "③", "④", "⑤"][d.userAnswer - 1] || d.userAnswer} / 正解: ${["①", "②", "③", "④", "⑤"][d.correct_option - 1] || d.correct_option}]</div>`;

                    resultBoxHtml = `
                        <div style="margin-top:0.85rem; padding-top:0.75rem; border-top:1px dashed var(--border-color);">
                            ${resultBadge}

                            ${(d.trap_type || d.trap_explanation) ? `
                                <div class="choice-drill-trap-box">
                                    <div style="font-weight:800; color:#d97706; font-size:0.8rem; margin-bottom:0.3rem; display:flex; align-items:center; gap:0.35rem;">
                                        <span>⚠️ 共通テストの罠：${escapeHtml(d.trap_type || "引っかけの急所")}</span>
                                    </div>
                                    <div style="color:var(--text-primary); font-size:0.82rem; line-height:1.55;">
                                        ${renderFormattedMarkdown(d.trap_explanation || "")}
                                    </div>
                                </div>
                            ` : ''}

                            <div class="choice-drill-explanation-box">
                                <div style="font-weight:800; color:var(--text-secondary); font-size:0.8rem; margin-bottom:0.3rem;">
                                    💡 設問・選択肢の詳細解説
                                </div>
                                <div style="line-height:1.6; font-size:0.82rem;">
                                    ${renderFormattedMarkdown(d.explanation || "")}
                                </div>
                            </div>

                            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:0.75rem; flex-wrap:wrap; gap:0.5rem;">
                                <a href="lesson.html?id=${encodeURIComponent(d.lessonId)}" class="goto-btn" style="font-size:0.74rem;">
                                    📖 授業ノートを開く ➔
                                </a>
                                <div style="display:flex; gap:0.45rem;">
                                    <button type="button" class="flora-btn flora-btn-secondary btn-sm" onclick="retryInsightChoiceDrill('${escapeHtml(d.lessonId)}', '${escapeHtml(d.id)}')" style="font-size:0.74rem; padding:0.3rem 0.65rem;">
                                        🔄 もう一度解く
                                    </button>
                                    <button type="button" class="flora-btn btn-sm" onclick="saveInsightChoiceDrillToMistakeBook('${escapeHtml(d.lessonId)}', '${escapeHtml(d.id)}')" style="background:var(--accent-yellow); color:#000; font-weight:800; font-size:0.74rem; padding:0.3rem 0.75rem; border:none; border-radius:var(--radius-sm); cursor:pointer;">
                                        📥 誤答ノートに保存
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="choice-drill-card ${cardStatusClass}" id="insight-drill-card-${escapeHtml(d.lessonId)}_${escapeHtml(d.id)}">
                        <div class="choice-drill-header">
                            <div style="display:flex; align-items:center; gap:0.45rem; flex-wrap:wrap;">
                                ${subjBadge}
                                <span style="font-size:0.82rem; font-weight:700; color:var(--text-primary);">
                                    📘 ${escapeHtml(d.lessonTitle)}
                                </span>
                                <span style="font-size:0.75rem; color:var(--text-muted);">
                                    (${escapeHtml(d.partTitle)})
                                </span>
                            </div>
                            <div style="display:flex; align-items:center; gap:0.45rem;">
                                <span class="flora-badge ${typeInfo.class}" style="font-size:0.72rem; padding:0.15rem 0.5rem;">${typeInfo.label}</span>
                                <span style="font-size:0.74rem; font-weight:700; color:var(--text-secondary);">問${index + 1}</span>

        let audioCtx = null;
