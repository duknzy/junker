        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === "suspended") {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playTypingSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const now = ctx.currentTime;

                if (type === "type") {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(580 + Math.random() * 80, now);
                    osc.frequency.exponentialRampToValueAtTime(220, now + 0.035);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.035);
                } else if (type === "complete") {
                    const notes = [523.25, 659.25, 783.99, 1046.5];
                    notes.forEach((freq, idx) => {
                        const noteTime = now + idx * 0.07;
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = "triangle";
                        osc.frequency.setValueAtTime(freq, noteTime);
                        gain.gain.setValueAtTime(0.12, noteTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.32);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(noteTime);
                        osc.stop(noteTime + 0.32);
                    });
                }
            } catch (e) {
                // Ignore audio playback exceptions
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getCleanTypingText(text) {
            if (!text) return "";
            let t = String(text);
            t = t.replace(/\$\$(.*?)\$\$/gs, "$1");
            t = t.replace(/\$(.*?)\$/g, "$1");
            t = t.replace(/\\\[(.*?)\\\]/gs, "$1");
            t = t.replace(/\\\((.*?)\\\)/g, "$1");
            t = t.replace(/\\(rm|bf|cal|it)\b/g, "");
            t = t.replace(/\\(text|mathrm|mathbf|mathit)\{([^}]*)\}/g, "$2");
            t = t.replace(/\r\n/g, "\n").replace(/\r/g, "\n");
            t = t.replace(/\n\s*\n/g, "\n");
            t = t.trim();
            return t;
        }

        function normalizeTypingChar(ch) {
            if (!ch) return "";
            if (ch === "　") return " ";
            return ch.normalize("NFKC").toLowerCase();
        }

        const furiganaCache = new Map();

        async function fetchFurigana(text) {
            if (!text) return "";
            const cleanText = text.trim();
            if (furiganaCache.has(cleanText)) return furiganaCache.get(cleanText);

            // 1. 漢字を含まない（ひらがな・カタカナ・英数字・記号のみ）場合は即時変換
            if (!/[\u4E00-\u9FFF\u3400-\u4DBF]/.test(cleanText)) {
                const converted = katakanaToHiragana ? katakanaToHiragana(cleanText) : cleanText;
                furiganaCache.set(cleanText, converted);
                return converted;
            }

            // 2. サーバー環境（Express等）が存在する場合は高速な Kuromoji API を利用
            if (!isStaticHostingEnvironment()) {
                try {
                    const res = await fetch("/api/typing/furigana", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ text: cleanText })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        const hira = data?.hiragana || data?.furigana;
                        if (hira) {
                            furiganaCache.set(cleanText, hira);
                            return hira;
                        }
                    }
                } catch {
                    // silent fallback
                }
            }

            // 3. 静的ホスティング（GitHub Pages等）またはサーバー不在時: GeminiキーがあればGeminiでふりがな取得
            if (hasAvailableGeminiKey && hasAvailableGeminiKey()) {
                try {
                    const hira = await callGeminiChat(
                        [{ text: `次の日本語の【すべてひらがな】の読み（ふりがな）だけを返してください。解説や記号、句読点は含めず、ひらがなのみ1行で出力してください。\n\n対象: ${cleanText}` }],
                        "あなたは日本語の読み仮名（すべてひらがな）抽出器です。入力された文字列のふりがな（すべてひらがな）のみを返してください。",
                        { silentFallback: true, temperature: 0.0 }
                    );
                    if (hira && typeof hira === "string") {
                        const cleanHira = hira.trim().replace(/[^\u3040-\u309F\sー0-9a-zA-Z]/g, "");
                        if (cleanHira) {
                            furiganaCache.set(cleanText, cleanHira);
                            return cleanHira;
                        }
                    }
                } catch {
                    // silent fallback
                }
            }

            return cleanText;
        }

        function renderSushidaUI() {
            if (!currentSushidaGame) return;
            const state = currentSushidaGame.getDisplayState();

            typingCharCounter.textContent = `${state.currentMoraIdx} / ${state.totalMoras} モーラ`;

            // 1. 原文（漢字）行のハイライト
            const progressRatio = state.totalMoras > 0 ? (state.currentMoraIdx / state.totalMoras) : 0;
            const originalChars = Array.from(currentTargetText);
            const matchedOriginalCount = state.isCompleted ? originalChars.length : Math.floor(originalChars.length * progressRatio);

            let kanjiHtml = "";
            for (let i = 0; i < originalChars.length; i++) {
                const ch = originalChars[i];
                const disp = ch === "\n" ? "↵<br>" : (ch === " " ? "&nbsp;" : escapeHtml(ch));
                if (i < matchedOriginalCount) {
                    kanjiHtml += `<span class="kanji-matched">${disp}</span>`;
                } else if (i === matchedOriginalCount && !state.isCompleted) {
                    kanjiHtml += `<span class="kanji-current">${disp}</span>`;
                } else {
                    kanjiHtml += `<span class="kanji-remaining">${disp}</span>`;
                }
            }

            // 2. ふりがな（ひらがな）行のハイライト
            let kanaHtml = "";
            state.kanaParts.forEach((part) => {
                const disp = part.kana === " " ? "&nbsp;" : escapeHtml(part.kana);
                if (part.state === 'matched') {
                    kanaHtml += `<span class="kana-matched">${disp}</span>`;
                } else if (part.state === 'current' || part.state === 'in_progress') {
                    kanaHtml += `<span class="kana-current">${disp}</span>`;
                } else {
                    kanaHtml += `<span class="kana-remaining">${disp}</span>`;
                }
            });

            // 3. ローマ字（寿司打リアルタイム打鍵部）
            let romajiHtml = "";
            state.romajiParts.forEach((part) => {
                part.chars.forEach((c) => {
                    const disp = c.char === " " ? "&nbsp;" : escapeHtml(c.char);
                    if (c.state === 'matched') {
                        romajiHtml += `<span class="romaji-char-matched">${disp}</span>`;
                    } else if (c.state === 'current') {
                        romajiHtml += `<span class="romaji-char-current">${disp}</span>`;

                });

                <div class="sushida-board">
                    <div class="sushida-kanji-row">${kanjiHtml}</div>
                    <div class="sushida-kana-row">${kanaHtml}</div>

        let pendingSrsUpdates = {};

        async function flushPendingSrsUpdates() {
            if (!currentUser || !currentUser.uid) return;
            if (srsFlushTimer) {
                clearTimeout(srsFlushTimer);
                srsFlushTimer = null;
            }
            const keys = Object.keys(pendingSrsUpdates);
            if (keys.length === 0) return;

            const payload = {};
            for (const k of keys) {
                payload[`users/${currentUser.uid}/memorizeProgress/${k}`] = pendingSrsUpdates[k];
            }
            pendingSrsUpdates = {};

            try {
                // Firebase Realtime Database のマルチパス更新：1リクエストで一括書き込み
                await update(ref(database), payload);
            } catch (err) {
                console.warn("[Flora SRS] Batch progress save failed:", err);
            }
        }

            pendingSrsUpdates[pKey] = progressData;

            srsFlushTimer = setTimeout(() => {

        function playFcSound(type) {
            if (!fcSoundEnabled) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                if (type === "flip") {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(560, now + 0.07);
                    gain.gain.setValueAtTime(0.05, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.07);
                } else if (type === "mastered" || type === "correct") {
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = "triangle";
                        osc.frequency.setValueAtTime(freq, now + i * 0.07);
                        gain.gain.setValueAtTime(0.06, now + i * 0.07);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.2);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.07);
                        osc.stop(now + i * 0.07 + 0.2);
                    });
                } else if (type === "retry" || type === "wrong") {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(180, now + 0.16);
                    gain.gain.setValueAtTime(0.06, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.16);
                } else if (type === "finish") {
                    [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = "triangle";
                        osc.frequency.setValueAtTime(freq, now + i * 0.09);
                        gain.gain.setValueAtTime(0.07, now + i * 0.09);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.35);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + i * 0.09);
                        osc.stop(now + i * 0.09 + 0.35);
                    });
                }
            } catch (e) {}
        }

        function convertToFlashcard(raw, type) {
            if (!raw) return null;
            let card = null;

            if (type === 'memorize') {
                const content = (raw.rawContent || raw.content || raw.insight || "").trim();
                const note = (raw.rawNote || raw.note || "").trim();
                const category = (raw.rawCategory || raw.category || "").trim();
                const lessonTitle = raw.short_title || "暗記事項";

                let term = "";
                let definition = "";
                let backTermTitle = "";
                let backNote = note ? `💡 覚え方・ポイント: ${note}` : "";
                let frontPrompt = "Q. この重要事項の定義・急所を思い出そう";

                if (raw.question && raw.answer) {
                    term = raw.question.trim();
                    definition = raw.answer.trim();
                    backTermTitle = term;
                    frontPrompt = category ? `Q. この${category}の要点・公式を思い出そう` : "Q. この重要事項の要点を思い出そう";
                } else if (content.indexOf("：") !== -1 || content.indexOf(":") !== -1) {
                    const colonIdx = content.indexOf("：") !== -1 ? content.indexOf("：") : content.indexOf(":");
                    if (colonIdx > 0 && colonIdx < 50) {
                        term = content.slice(0, colonIdx).trim();
                        definition = content.slice(colonIdx + 1).trim();
                        backTermTitle = term;
                        frontPrompt = category ? `Q. この${category}の定義・要点を思い出そう` : "Q. この用語の定義・内容を思い出そう";
                    } else {
                        term = content;
                        definition = note || content;
                        backTermTitle = term;
                    }
                } else if (note) {
                    term = content;
                    definition = note;
                    backTermTitle = content;
                    backNote = "";
                    frontPrompt = category ? `Q. この${category}の定義・要点を思い出そう` : "Q. この重要事項の定義・要点を思い出そう";
                } else {
                    term = content;
                    definition = content;
                    backTermTitle = term;
                    frontPrompt = category ? `Q. この${category}の急所・内容を思い出そう` : "Q. この重要事項の内容・急所を思い出そう";
                    backNote = `単元: ${lessonTitle}`;
                }

                card = {
                    id: raw.id || `${raw.lessonId}:${raw.memoId}`,
                    type: 'memorize',
                    typeName: '暗記事項',
                    subject: raw.subject || '未分類',
                    category: category || '暗記事項',
                    sourceTitle: lessonTitle,
                    frontPrompt: frontPrompt,
                    frontMain: term,
                    frontHint: category ? `区分: ${category}` : '',
                    backTermTitle: backTermTitle,
                    backAnswer: definition,
                    backNote: backNote,
                    lessonId: raw.lessonId,
                    memoId: raw.memoId,
                    progressKey: `mem_${raw.lessonId || 'l'}_${raw.memoId || 'm'}`
                };
            } else if (type === 'problem') {
                card = {
                    id: raw.id,
                    type: 'problem',
                    typeName: '問題気づき',
                    subject: raw.subject || '未分類',
                    category: raw.field || '解法の極意',
                    sourceTitle: raw.short_title || raw.title || '問題演習',
                    frontPrompt: `🧠 この問題で掴んだ「解法の急所・思考の極意」は？`,

                    backTermTitle: raw.short_title || raw.title || '',
                    backAnswer: raw.mnemonic || '',
                    backNote: raw.title ? `詳細: ${raw.title.slice(0, 80)}` : '',
                    problemId: raw.id,
                    progressKey: `mnem_${raw.id}`
                };

            if (!card) return null;

        // 選択された授業IDセット (LocalStorage永続化)
        let selectedLessonFilterIds = new Set();

                    selectedLessonFilterIds = new Set(parsed);

        function saveSelectedLessons() {
            try {
                localStorage.setItem('fc_selected_lessons', JSON.stringify([...selectedLessonFilterIds]));
            } catch (e) {
                console.warn("Failed to save selected lessons:", e);

        // 全カードプール取得
        function getAllAvailableFlashcards() {
            const memList = buildMemorizationItems().map(p => convertToFlashcard(p, 'memorize'));
            const pList = Object.values(rawProblems).filter(p => p && p.insight && p.insight.trim() !== "").map(p => convertToFlashcard(p, 'problem'));
            const lmList = buildLessonMemoItems().map(p => convertToFlashcard(p, 'lesson_memo'));
            const qnaList = Object.entries(rawQnaLogs).map(([id, l]) => convertToFlashcard({ id, ...l }, 'qna'));
            const mnemList = Object.values(rawProblems).filter(p => p && p.subject === "世界史" && p.mnemonic && p.mnemonic.trim() !== "").map(p => convertToFlashcard(p, 'mnemonic'));
            return [...memList, ...pList, ...lmList, ...qnaList, ...mnemList].filter(item => item && (item.frontMain || item.backAnswer));
        }

        function getFlashcardPool(scope = "due") {
            let list = [];
            const currentSubject = subjectSelect ? subjectSelect.value : "ALL";
            const currentQuery = searchInput ? searchInput.value.trim().toLowerCase() : "";
            const today = getTodayStr();

            if (scope === "due") {
                // 本日の復習: 復習期限到来（または未学習Lv.0）のカードを優先
                const all = getAllAvailableFlashcards();
                const dueCards = all.filter(c => c.isDue);
                // 期限到来が少なければ、全体から追加
                list = dueCards.length > 0 ? dueCards : all;
                if (currentSubject !== "ALL") list = list.filter(c => c.subject === currentSubject);
            } else if (scope === "weak") {
                // 苦手特訓: lapsesが多い順、またはLv.1以下のカード
                const all = getAllAvailableFlashcards();
                list = all.filter(c => (c.srsLapses && c.srsLapses > 0) || (c.srsBoxLevel && c.srsBoxLevel === 1))
                          .sort((a, b) => (b.srsLapses || 0) - (a.srsLapses || 0));
                if (list.length === 0) list = all.slice(0, 20);
                if (currentSubject !== "ALL") list = list.filter(c => c.subject === currentSubject);
            } else if (scope === "lessons") {
                // 📚 ユーザーが選択した特定の授業（複数可）から出題
                const all = getAllAvailableFlashcards();
                if (selectedLessonFilterIds.size > 0) {
                    list = all.filter(c => c && c.lessonId && selectedLessonFilterIds.has(c.lessonId));
                    // もし授業IDで直接引けないカードでも、タイトルやsourceTitleが合致すれば含む
                    if (list.length === 0) {
                        const targetTitles = new Set();
                        selectedLessonFilterIds.forEach(id => {
                            if (rawLessons[id] && rawLessons[id].title) {
                                targetTitles.add(rawLessons[id].title.trim());
                            }
                        });
                        list = all.filter(c => c && c.sourceTitle && targetTitles.has(c.sourceTitle.trim()));
                    }
                } else {
                    list = all;
                }
                // モーダルのセレクトボックスの表示ラベルを更新
                const lessonsOpt = document.getElementById("fc-scope-lessons-opt");
                if (lessonsOpt) {
                    lessonsOpt.style.display = "block";
                    lessonsOpt.textContent = `📚 選択した授業 (${selectedLessonFilterIds.size}単元・${list.length}枚)`;
                }
            } else if (scope === "starred") {
                const all = getAllAvailableFlashcards();
                list = all.filter(c => c.backNote && c.backNote.includes("⭐"));
                if (currentSubject !== "ALL") list = list.filter(c => c.subject === currentSubject);
            } else if (scope === "current") {
                if (activeTab === "memorize") {
                    list = buildMemorizationItems().map(p => convertToFlashcard(p, 'memorize'));
                } else if (activeTab === "insights") {
                    const pList = Object.values(rawProblems).filter(p => p && p.insight && p.insight.trim() !== "").map(p => convertToFlashcard(p, 'problem'));
                    const lmList = buildLessonMemoItems().map(p => convertToFlashcard(p, 'lesson_memo'));
                    list = [...pList, ...lmList];
                } else if (activeTab === "qna") {
                    list = Object.entries(rawQnaLogs).map(([id, l]) => convertToFlashcard({ id, ...l }, 'qna'));
                } else if (activeTab === "mnemonics") {
                    list = Object.values(rawProblems).filter(p => p && p.subject === "世界史" && p.mnemonic && p.mnemonic.trim() !== "").map(p => convertToFlashcard(p, 'mnemonic'));
                }
                if (currentSubject !== "ALL") {
                    list = list.filter(item => item && item.subject === currentSubject);
                }
                if (typeof isUnitFilterActive === "function" && isUnitFilterActive()) {
                    list = list.filter(item => item && isUnitSelected(item.lessonId, item.category, item.sourceTitle));
                }
                if (currentQuery) {
                    list = list.filter(item => item && (
                        (item.frontMain || "").toLowerCase().includes(currentQuery) ||
                        (item.backAnswer || "").toLowerCase().includes(currentQuery) ||
                        (item.sourceTitle || "").toLowerCase().includes(currentQuery) ||
                        (item.subject || "").toLowerCase().includes(currentQuery)
                    ));
                }
            } else if (scope === "memorize") {
                list = buildMemorizationItems().map(p => convertToFlashcard(p, 'memorize'));
                if (currentSubject !== "ALL") list = list.filter(item => item && item.subject === currentSubject);
            } else if (scope === "insights") {
                const pList = Object.values(rawProblems).filter(p => p && p.insight && p.insight.trim() !== "").map(p => convertToFlashcard(p, 'problem'));
                const lmList = buildLessonMemoItems().map(p => convertToFlashcard(p, 'lesson_memo'));
                list = [...pList, ...lmList];
                if (currentSubject !== "ALL") list = list.filter(item => item && item.subject === currentSubject);
            } else if (scope === "qna") {
                list = Object.entries(rawQnaLogs).map(([id, l]) => convertToFlashcard({ id, ...l }, 'qna'));
                if (currentSubject !== "ALL") list = list.filter(item => item && item.subject === currentSubject);
            } else if (scope === "all") {
                list = getAllAvailableFlashcards();
            }

            return list.filter(item => item && (item.frontMain || item.backAnswer));
        }

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // 本日のダッシュボードバナー集計＆更新
        function updateSrsDashboardCounts() {
            const dueCountEl = document.getElementById("srs-due-count");
            const newCountEl = document.getElementById("srs-new-count");
            const masteredCountEl = document.getElementById("srs-mastered-count");
            const retentionRateEl = document.getElementById("srs-retention-rate");
            if (!dueCountEl) return;

            const all = getAllAvailableFlashcards();
            const today = getTodayStr();

            let dueCount = 0;
            let newCount = 0;
            let masteredCount = 0;

            all.forEach(c => {
                const level = c.srsBoxLevel || 0;
                if (level === 0) {
                    newCount++;
                    dueCount++; // 未学習も本日のタスクに含める
                } else if (level >= 4) {
                    masteredCount++;
                    if (c.srsNextReviewDate && c.srsNextReviewDate <= today) dueCount++;
                } else {
                    if (!c.srsNextReviewDate || c.srsNextReviewDate <= today) dueCount++;
                }
            });

            const total = all.length;
            const retention = total > 0 ? Math.round((masteredCount / total) * 100) : 0;

            dueCountEl.textContent = dueCount;
            if (newCountEl) newCountEl.textContent = newCount;
            if (masteredCountEl) masteredCountEl.textContent = masteredCount;
            if (retentionRateEl) retentionRateEl.textContent = `${retention}%`;
        }

        function openFlashcardModal(items, startIndex = 0, initialMode = null) {
            if (!items || items.length === 0) {
                showToast("出題対象のカードがありません。絞り込みを変更してください。", "warning");
                return;
            }

            if (initialMode) {
                fcCurrentMode = initialMode;
                if (fcModeTabs) {
                    fcModeTabs.querySelectorAll(".fc-mode-btn").forEach(b => {
                        b.classList.toggle("active", b.getAttribute("data-mode") === fcCurrentMode);
                    });
                }
            }

            // ドロップダウンや他のUIへのキーボード誤入力を防止するためフォーカス解除
            if (document.activeElement && document.activeElement.blur) {
                document.activeElement.blur();
            }

            // 各カードに元の並び順インデックスを記録＆再挑戦フラグ初期化
            items.forEach((item, idx) => {
                if (item._origIdx === undefined) item._origIdx = idx;
                item._isRetry = false;
            });

            updateFcShuffleButton();

            fcInitialCount = items.length;
            fcMasteredTotal = 0;
            fcRetryTotal = 0;
            fcLevelupTotal = 0;
            fcCardsAnsweredCount = 0;
            fcSessionWeakList = [];

            if (startIndex > 0 && startIndex < items.length) {
                if (fcIsShuffle) {
                    const target = items[startIndex];
                    const rest = items.filter((_, i) => i !== startIndex);
                    fcQueue = [target, ...shuffleArray(rest)];
                } else {
                    // 順番通りの場合: 指定カードから末尾まで進み、その後先頭から指定カード前までを演習
                    fcQueue = [...items.slice(startIndex), ...items.slice(0, startIndex)];
                }
            } else {
                fcQueue = fcIsShuffle ? shuffleArray(items) : [...items];
            }

            fcActiveContainer.style.display = "block";
            fcFinishView.style.display = "none";
            fcModal.style.display = "flex";

            renderNextFcCard();
        }

        // 日本語テキストの自然な句読点・助詞・熟語折り返し補助（変な改行の根絶）
        function formatJapanesePhrasing(rawText) {
            if (!rawText || typeof rawText !== "string") return "";
            
            // 数式トークンを保護
            const mathTokens = [];
            let text = rawText.replace(/(\$\$[\s\S]*?\$\$|\$[^\$]+?\$|\\\[[\s\S]*?\\\]|\\\(.*?\\\))/g, (m) => {
                mathTokens.push(m);
                return `___MATH_TOKEN_${mathTokens.length - 1}___`;
            });

            let safe = escapeHtml(text);

            // 1. 句読点・閉じ括弧・記号の直後に改行促進<wbr>
            safe = safe.replace(/([、。！？\?：:）\)」』】])/g, '$1<wbr>');
            
            // 2. 開き括弧・波ダッシュの直前に改行促進<wbr>
            safe = safe.replace(/([（\(「『【〜~])/g, '<wbr>$1');
            
            // 3. 複合助詞・接続表現の直前に改行促進<wbr>（文意・熟語の泣き別れを防止）
            safe = safe.replace(/(について|における|において|に対して|にとって|によって|とともに|をはじめ|に関して|として|という|こと|もの|ため|など|および|ならびに|ただし|または|あるいは)/g, '<wbr>$1');

            // 4. 2文字以上の漢字・カタカナに続く一文字助詞の前に区切りを促進
            safe = safe.replace(/([\u4e00-\u9faf\u30a0-\u30ff]{2,})(は|が|を|に|へ|で|と|より|から)([\u4e00-\u9faf\u3040-\u30ff])/g, '$1<wbr>$2$3');

            // 数式トークンを復元
            safe = safe.replace(/___MATH_TOKEN_(\d+)___/g, (_, idx) => mathTokens[parseInt(idx, 10)] || '');

            return normalizeMathSyntax(safe);
        }

        function renderNextFcCard() {
            if (fcQueue.length === 0) {
                showFcFinishView();
                return;
            }

            fcCurrentCard = fcQueue[0];
            fcIsFlipped = false;

            // ⚠️ 裏面を開いた状態で次へ進んだ際、次の問題の答えが一瞬見えてしまう（チラ見え）のを100%防止する:
            // 1. 次の裏面テキストを即座に空にする
            if (fcBackMainAnswer) fcBackMainAnswer.innerHTML = "";
            if (fcBackTermTitle) fcBackTermTitle.style.display = "none";
            if (fcBackNote) fcBackNote.style.display = "none";

            // 2. トランジション（アニメーション）を一時的に解除し、瞬時に表面（0度）へリセット
            if (fcCardInner) {
                fcCardInner.style.transition = "none";
            }
            if (fcCardStage) {
                fcCardStage.classList.remove("flipped");
                // 強制リフロー
                void fcCardStage.offsetHeight;
            }

            // 3. 次のアニメーションフレームで本来の3Dフリップトランジションを再有効化
            requestAnimationFrame(() => {
                if (fcCardInner) {
                    fcCardInner.style.transition = "";
                }
            });

            renderFcCurrentCard();

            // カード切り替え時の自然な進入演出
            if (fcCardStage) {
                fcCardStage.classList.remove("fc-card-advance");
                void fcCardStage.offsetWidth;
                fcCardStage.classList.add("fc-card-advance");
            }

            // オートプレイ実行中の場合は次のカードサイクルを開始
            if (typeof fcAutoplayActive !== "undefined" && fcAutoplayActive) {
                setTimeout(() => {
                    if (fcAutoplayActive && typeof runAutoplayCycle === "function") {
                        runAutoplayCycle();
                    }
                }, 350);
            }
        }

        // 現在のカード描画（モード切替時にも呼び出し可能）
        function renderFcCurrentCard() {
            if (!fcCurrentCard) return;

            // メタデータ
            fcMetaSubject.textContent = fcCurrentCard.subject || "公共";
            fcMetaType.textContent = fcCurrentCard.typeName || "暗記事項";

            // プログレス表示（演習問題数を連続カウントし、順番がリセットされたような錯覚を防止）
            const remaining = fcQueue.length;
            fcCounterProgress.textContent = `演習 ${fcCardsAnsweredCount + 1} 問目 / 全${fcInitialCount}枚 (残りキュー: ${remaining}枚)`;
            fcCountMastered.textContent = fcMasteredTotal;
            fcCountRetry.textContent = fcRetryTotal;

            const progressPct = Math.min(100, Math.round((fcMasteredTotal / fcInitialCount) * 100));
            fcProgressBarFill.style.width = `${progressPct}%`;

            // SRS レベルバッジ反映
            const boxLevel = fcCurrentCard.srsBoxLevel || 0;
            const levelClass = `fc-level-${boxLevel}`;
            const levelLabel = boxLevel === 0 ? "Lv.0 未学習" : boxLevel === 5 ? "Lv.5 🏆 習得済" : `Lv.${boxLevel}`;

            [fcFrontLevel, fcBackLevel].forEach(el => {
                if (el) {
                    el.className = `fc-level-badge ${levelClass}`;
                    el.textContent = levelLabel;
                }
            });

            // 復習期限インジケータ
            if (fcDueBadge) {
                fcDueBadge.style.display = fcCurrentCard.isDue ? "inline-block" : "none";
            }

            // 再挑戦（もう一度）カードのバッジ表示
            const fcFrontRetryBadge = document.getElementById("fc-front-retry-badge");
            if (fcFrontRetryBadge) {
                fcFrontRetryBadge.style.display = fcCurrentCard._isRetry ? "inline-flex" : "none";
            }

            // モードに応じた表面・裏面の出し分け
            const isReverse = fcCurrentMode === "reverse";
            const isQuiz = fcCurrentMode === "quiz";

            // ヘッダー情報
            fcFrontSubject.textContent = fcCurrentCard.subject || "公共";
            fcFrontCategory.textContent = isReverse ? "🔄 用語想起" : (fcCurrentCard.category || fcCurrentCard.typeName);
            fcFrontSource.textContent = fcCurrentCard.sourceTitle || "";

            let displayFrontText = "";
            let displayBackText = "";
            let displayPrompt = "";

            if (isReverse) {
                // リバース想起: 表面に用語/タイトル、裏面に解説/定義
                displayPrompt = "🔄 この用語・キーフレーズの定義や内容を思い出そう";
                displayFrontText = fcCurrentCard.backTermTitle || fcCurrentCard.frontMain || "";
                displayBackText = fcCurrentCard.backAnswer || fcCurrentCard.frontMain || "";
            } else {
                // 通常モード
                displayPrompt = fcCurrentCard.frontPrompt || "Q. この重要事項の定義・急所を思い出そう";
                displayFrontText = fcCurrentCard.frontMain || "";
                displayBackText = fcCurrentCard.backAnswer || "";
            }

            fcFrontPromptLabel.textContent = displayPrompt;

            // 文字数に応じた動的フォントサイジング＆美しい改行バランス
            const frontLen = (displayFrontText || "").length;
            fcFrontMainTerm.classList.remove("fc-text-xl", "fc-text-lg", "fc-text-md", "fc-text-sm", "fc-text-xs");
            if (frontLen <= 14) {
                fcFrontMainTerm.classList.add("fc-text-xl");
            } else if (frontLen <= 30) {
                fcFrontMainTerm.classList.add("fc-text-lg");
            } else if (frontLen <= 55) {
                fcFrontMainTerm.classList.add("fc-text-md");
            } else if (frontLen <= 90) {
                fcFrontMainTerm.classList.add("fc-text-sm");
            } else {
                fcFrontMainTerm.classList.add("fc-text-xs");
            }

            fcFrontMainTerm.innerHTML = formatJapanesePhrasing(displayFrontText);

            if (fcCurrentCard.frontHint && !isReverse) {
                fcFrontHint.textContent = fcCurrentCard.frontHint;
                fcFrontHint.style.display = "block";
            } else {
                fcFrontHint.style.display = "none";
            }

            // 🎯 4択スピードテストモードの処理
            if (isQuiz) {
                fcQuizBox.style.display = "grid";
                fcFrontFooter.style.display = "none";
                buildQuizOptions(displayBackText);
            } else {
                fcQuizBox.style.display = "none";
                fcFrontFooter.style.display = "flex";
            }

            // 裏面
            fcBackSubject.textContent = fcCurrentCard.subject || "公共";
            fcBackSource.textContent = fcCurrentCard.sourceTitle || "";

            if (fcBackTermTitle) {
                if (fcCurrentCard.backTermTitle && fcCurrentCard.backTermTitle !== displayBackText) {
                    fcBackTermTitle.innerHTML = formatJapanesePhrasing(fcCurrentCard.backTermTitle);
                    fcBackTermTitle.style.display = "block";
                } else {
                    fcBackTermTitle.style.display = "none";
                }
            }

            fcBackMainAnswer.innerHTML = formatJapanesePhrasing(displayBackText);

            if (fcCurrentCard.backNote) {
                fcBackNote.textContent = fcCurrentCard.backNote;
                fcBackNote.style.display = "block";
            } else {
                fcBackNote.style.display = "none";
            }

            // 📝 ユーザーメモの表示反映
            if (typeof updateFcUserMemoDisplay === "function") {
                updateFcUserMemoDisplay();
            }

            // ⚡ 数式記法を含む要素だけをピンポイントで非同期レンダリング
            scheduleMathTypeset(fcCardInner);
        }

        // 4択テストの選択肢生成
        function buildQuizOptions(correctAnswer) {
            fcQuizBox.innerHTML = "";
            const cleanCorrect = (correctAnswer || "").trim();

            // 他のカードから誤答ダミーを3つ選出
            const allCards = getAllAvailableFlashcards();
            const sameSubject = allCards.filter(c => c && c.subject === fcCurrentCard.subject && (c.backAnswer || c.frontMain) !== cleanCorrect);
            const pool = sameSubject.length >= 3 ? sameSubject : allCards.filter(c => (c.backAnswer || c.frontMain) !== cleanCorrect);

            const shuffledPool = shuffleArray(pool);
            const dummyTexts = [];
            for (const item of shuffledPool) {
                const text = (item.backAnswer || item.frontMain || "").trim();
                if (text && text !== cleanCorrect && !dummyTexts.includes(text)) {
                    dummyTexts.push(text);
                    if (dummyTexts.length === 3) break;
                }
            }

            // 3つ揃わなかった場合のフォールバック
            while (dummyTexts.length < 3) {
                dummyTexts.push(`ダミー選択肢 (${dummyTexts.length + 1})`);
            }

            const options = shuffleArray([
                { text: cleanCorrect, isCorrect: true },
                { text: dummyTexts[0], isCorrect: false },
                { text: dummyTexts[1], isCorrect: false },
                { text: dummyTexts[2], isCorrect: false }
            ]);

            const keyLabels = ["1", "2", "3", "4"];
            options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "fc-quiz-option";
                btn.setAttribute("data-correct", opt.isCorrect ? "true" : "false");
                btn.setAttribute("data-index", idx);

                const keySpan = document.createElement("span");
                keySpan.className = "fc-quiz-key";
                keySpan.textContent = keyLabels[idx];

                const textSpan = document.createElement("span");
                textSpan.className = "fc-quiz-text";
                textSpan.innerHTML = normalizeMathSyntax(escapeHtml(opt.text.length > 90 ? opt.text.slice(0, 90) + '…' : opt.text));

                btn.appendChild(keySpan);
                btn.appendChild(textSpan);

                btn.onclick = (e) => {
                    e.stopPropagation();
                    handleQuizSelection(btn, opt.isCorrect);
                };

                fcQuizBox.appendChild(btn);
            });
        }

        // 4択テストの回答処理
        function handleQuizSelection(selectedBtn, isCorrect) {

            const allBtns = fcQuizBox.querySelectorAll(".fc-quiz-option");

        // 🧠 4段階SRS評価エンジン（1:もう一度, 2:難しい, 3:覚えた, 4:簡単！）
        function rateFcCard(rating, skipFlipWait = false) {
            if (!fcCurrentCard) return;

            const card = fcCurrentCard;
            const prevLevel = card.srsBoxLevel || 0;
            let newLevel = prevLevel;
            let lapses = (card.srsLapses || 0);
            let reps = (card.srsReps || 0) + 1;
            let nextReviewDate = getTodayStr();

            // 演習問数をカウントアップ（順番がリセットされたような錯覚を防止）
            fcCardsAnsweredCount++;

            if (rating === 1) {
                // もう一度 (Again)
                playFcSound("retry");
                fcRetryTotal++;
                lapses += 1;
                newLevel = 1; // Lv.1へ降格
                nextReviewDate = getTodayStr(); // 本日中に再学習

                // 弱点リストに記録
                if (!fcSessionWeakList.some(c => c.progressKey === card.progressKey)) {
                    fcSessionWeakList.push(card);
                }

                // 再出題フラグを付与（UIで再挑戦カードとして表示）
                card._isRetry = true;

                // キューの後ろに再配置（数問直後に出てしまわないよう、キュー長に応じた適度な間隔を確保）
                fcQueue.shift();
                if (fcQueue.length <= 3) {
                    fcQueue.push(card);
                } else {
                    const minGap = fcQueue.length > 20 ? 6 : 4;
                    const maxGap = Math.min(10, Math.floor(fcQueue.length * 0.25));
                    const insertPos = Math.min(fcQueue.length, Math.max(minGap, maxGap));
                    fcQueue.splice(insertPos, 0, card);
                }
            } else {
                card._isRetry = false;
                if (rating === 2) {
                    // 難しい (Hard)
                    playFcSound("mastered");
                    fcMasteredTotal++;
                    newLevel = Math.max(1, prevLevel);
                    nextReviewDate = addDaysToDate(getTodayStr(), 1); // 1日後
                    fcQueue.shift();
                } else if (rating === 3) {
                    // 覚えた (Good)
                    playFcSound("mastered");
                    fcMasteredTotal++;
                    newLevel = Math.min(5, prevLevel + 1);
                    const intervalDays = SRS_INTERVALS[newLevel] || 3;
                    nextReviewDate = addDaysToDate(getTodayStr(), intervalDays);
                    if (newLevel > prevLevel) fcLevelupTotal++;
                    fcQueue.shift();
                } else if (rating === 4) {
                    // 簡単！ (Easy)
                    playFcSound("mastered");
                    fcMasteredTotal++;
                    newLevel = Math.min(5, prevLevel + 2);
                    const intervalDays = (SRS_INTERVALS[newLevel] || 7) + 3;
                    nextReviewDate = addDaysToDate(getTodayStr(), intervalDays);
                    if (newLevel > prevLevel) fcLevelupTotal++;
                    fcQueue.shift();
                }
            }

            // カードオブジェクトとローカルキャッシュを更新
            card.srsBoxLevel = newLevel;
            card.srsNextReviewDate = nextReviewDate;
            card.srsLapses = lapses;
            card.srsReps = reps;
            card.isDue = nextReviewDate <= getTodayStr();

            const pKey = sanitizeDbKey(card.progressKey);
            const progressData = {
                boxLevel: newLevel,
                nextReviewDate: nextReviewDate,
                lastReviewedAt: Date.now(),
                reps: reps,
                lapses: lapses,
                updatedAt: Date.now()
            };
            rawMemorizeProgress[pKey] = progressData;

            // Firebaseへバッチキューイング（毎問の個別writeを抑制し、通信数・書き込み数を激減）
            queueSrsUpdate(pKey, progressData);

            // ダッシュボード集計更新
            updateSrsDashboardCounts();

            // 解答チラ見え防止のため裏面テキストを即座にブランク化
            if (fcBackMainAnswer) fcBackMainAnswer.innerHTML = "";
            if (fcBackTermTitle) fcBackTermTitle.style.display = "none";
            if (fcBackNote) fcBackNote.style.display = "none";

            // 次のカードへ進む
            renderNextFcCard();
        }

        // ==========================================
        // 🔊 TTS（音声合成）読み上げ & オートプレイロジック
        // ==========================================
        let activeSpeechUtterance = null;
        function speakText(text, lang = "ja-JP") {
            if (!('speechSynthesis' in window)) {
                showToast("ブラウザの音声合成機能に対応していません", "warning");
                return Promise.resolve();
            }
            window.speechSynthesis.cancel();
            if (!text || !text.trim()) return Promise.resolve();

            const clean = text
                .replace(/`{1,3}[^`]+`{1,3}/g, "")
                .replace(/\$[^$]+\$/g, "")
                .replace(/[#*_\-\[\]()>~|]/g, " ")
                .replace(/[\u{1F300}-\u{1F6FF}\u{1F900}-\u{1F9FF}\u{2600}-\u{26FF}]/gu, "")
                .replace(/\s+/g, " ")
                .trim();

            if (!clean) return Promise.resolve();

            return new Promise((resolve) => {
                const utter = new SpeechSynthesisUtterance(clean);
                utter.lang = lang;
                utter.rate = 1.0;
                utter.pitch = 1.0;
                utter.onend = () => {
                    activeSpeechUtterance = null;
                    resolve();
                };
                utter.onerror = () => {
                    activeSpeechUtterance = null;
                    resolve();
                };
                activeSpeechUtterance = utter;
                window.speechSynthesis.speak(utter);
            });
        }

        function stopSpeech() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            activeSpeechUtterance = null;
        }

        function detectTextLang(text) {
            if (!text) return "ja-JP";
            const latin = (text.match(/[A-Za-z]/g) || []).length;
            const total = text.replace(/[\s\d\p{P}]/gu, "").length;
            if (total > 0 && (latin / total) > 0.5) return "en-US";
            return "ja-JP";
        }

        let fcAutoplayActive = false;
        let fcAutoplayTimer = null;

        function setFcAutoplayState(active) {
            fcAutoplayActive = active;
            const btn = document.getElementById("fc-autoplay-toggle");
            const indicator = document.getElementById("fc-autoplay-indicator");

            if (active) {
                if (btn) {
                    btn.classList.add("active");
                    btn.style.background = "linear-gradient(135deg, #10B981, #059669)";
                    btn.style.color = "#fff";
                    btn.textContent = "⏸ オートプレイ停止";
                }
                if (indicator) indicator.style.display = "inline-flex";
                showToast("▶ オートプレイ開始: 表裏の自動読み上げ＆自動めくり", "info");
                runAutoplayCycle();
            } else {
                if (btn) {
                    btn.classList.remove("active");
                    btn.style.background = "";
                    btn.style.color = "";
                    btn.textContent = "▶ オートプレイ";
                }
                if (indicator) indicator.style.display = "none";
                if (fcAutoplayTimer) {
                    clearTimeout(fcAutoplayTimer);
                    fcAutoplayTimer = null;
                }
                stopSpeech();
            }
        }

        async function runAutoplayCycle() {
            if (!fcAutoplayActive || !fcCurrentCard) return;
            if (fcAutoplayTimer) clearTimeout(fcAutoplayTimer);

            // 1. 表面に戻す
            if (fcIsFlipped) {
                flipFcCard(false);
                await new Promise(r => setTimeout(r, 450));
                if (!fcAutoplayActive) return;
            }

            // 2. 表面を読み上げ
            const frontText = fcCurrentCard.frontMain || "";
            await speakText(frontText, detectTextLang(frontText));
            if (!fcAutoplayActive) return;

            // 3. 3秒待機 ➔ 裏面へめくり＆読み上げ
            fcAutoplayTimer = setTimeout(async () => {
                if (!fcAutoplayActive) return;

                flipFcCard(true);
                await new Promise(r => setTimeout(r, 500));
                if (!fcAutoplayActive) return;

                const backText = fcCurrentCard.backAnswer || "";
                const cardKey = getCardMemoKey(fcCurrentCard);
                const memoEntry = rawCardUserMemos[cardKey];
                const memoText = (memoEntry && memoEntry.memo) ? `。メモ、${memoEntry.memo}` : "";
                const fullBack = backText + memoText;

                await speakText(fullBack, detectTextLang(fullBack));
                if (!fcAutoplayActive) return;

                // 4. 読み上げ終了後、3秒待って次のカードへ
                fcAutoplayTimer = setTimeout(() => {
                    if (!fcAutoplayActive) return;
                    rateFcCard(3); // 「普通 (Good)」で自動送り
                }, 3000);
            }, 3000);
        }

        function getLessonCardStats(lessonId) {
            const lesson = rawLessons[lessonId] || {};
            let memCount = 0;
            let unlearnedCount = 0;
            let weakCount = 0;
            let masteredCount = 0;

            if (Array.isArray(lesson.memorizationPoints)) {
                lesson.memorizationPoints.forEach((mp, idx) => {
                    if (!mp || (!mp.content && !mp.question && !mp.answer)) return;
                    memCount++;
                    const mpId = mp.id || `idx${idx}`;
                    const pKey = sanitizeDbKey(`mem_${lessonId}_${mpId}`);
                    const prog = (rawMemorizeProgress && rawMemorizeProgress[pKey]) || {};
                    const boxLevel = typeof prog.boxLevel === 'number' ? prog.boxLevel : 0;
                    const lapses = prog.lapses || 0;
                    if (boxLevel >= 4) {
                        masteredCount++;
                    } else if (boxLevel === 1 || lapses > 0) {
                        weakCount++;
                    } else {
                        unlearnedCount++;
                    }
                });
            }

            const memoCount = Array.isArray(lesson.lessonMemos)
                ? lesson.lessonMemos.filter(m => m && m.text && m.text.trim()).length
                : 0;
            const probCount = Object.values(rawProblems).filter(p => p && p.lessonId === lessonId && p.insight && p.insight.trim()).length;
            const total = memCount + memoCount + probCount;
            return { memCount, memoCount, probCount, total, unlearnedCount, weakCount, masteredCount };
        }

        function updateLessonPickerSummary() {
            if (!lessonPickerSelectedLessonsCount || !lessonPickerSelectedCardsCount) return;

            const statusRadio = document.querySelector('input[name="custom-test-status"]:checked');
            const statusVal = statusRadio ? statusRadio.value : 'unlearned';

            let totalCards = 0;
            selectedLessonFilterIds.forEach(id => {

                if (statusVal === "unlearned") {
                    totalCards += stats.unlearnedCount;
                } else if (statusVal === "weak") {
                    totalCards += stats.weakCount;
                } else if (statusVal === "mastered") {
                    totalCards += stats.masteredCount;
                } else {
                    totalCards += stats.total;
                }
            });
            lessonPickerSelectedCardsCount.textContent = totalCards;

            const tabCountEl = document.getElementById("modal-tab-cards-count");

        function renderModalCardPreview() {
            if (!modalPreviewCardsList) return;

            // 選択中の授業スコープでカードを取得
            let items = getFlashcardPool("lessons");

            const statusRadio = document.querySelector('input[name="custom-test-status"]:checked');
            const statusVal = statusRadio ? statusRadio.value : 'unlearned';

            if (statusVal === "unlearned") {
                items = items.filter(c => (c.srsBoxLevel ?? 0) === 0);
            } else if (statusVal === "weak") {
                items = items.filter(c => (c.srsBoxLevel === 1) || ((c.srsLapses || 0) > 0));
            } else if (statusVal === "mastered") {
                items = items.filter(c => (c.srsBoxLevel || 0) >= 4);
            }

            const query = modalPreviewCardSearch ? modalPreviewCardSearch.value.trim().toLowerCase() : "";
            if (query) {
                items = items.filter(c =>
                    (c.frontMain || "").toLowerCase().includes(query) ||
                    (c.backAnswer || "").toLowerCase().includes(query) ||
                    (c.subject || "").toLowerCase().includes(query) ||
                    (c.lessonTitle || "").toLowerCase().includes(query)
                );
            }

            const tabCountEl = document.getElementById("modal-tab-cards-count");
            if (tabCountEl && !query) tabCountEl.textContent = items.length;

            if (items.length === 0) {
                modalPreviewCardsList.innerHTML = `

                    </div>
                `;
                return;
            }

            modalPreviewCardsList.innerHTML = items.map(c => {
                let stBadge = `<span class="preview-card-status status-unlearned">🌱 未習得</span>`;
                if ((c.srsBoxLevel || 0) >= 4) {
                    stBadge = `<span class="preview-card-status status-mastered">✅ 習得済</span>`;
                } else if ((c.srsBoxLevel === 1) || ((c.srsLapses || 0) > 0)) {
                    stBadge = `<span class="preview-card-status status-weak">🔄 苦手・復習</span>`;
                }

                const cleanQ = (c.frontMain || "").trim().replace(/^(?:Q[.:：]|問題[.:：]?)\s*/i, "");
                const cleanA = (c.backAnswer || "").trim().replace(/^(?:A[.:：]|答え[.:：]?|解答[.:：]?)\s*/i, "");

                return `
                    <div class="custom-test-preview-card">
                        <div class="preview-card-meta">
                            <span class="preview-card-subject">📚 ${escapeHtml(c.subject || "未分類")}</span>

                            ${stBadge}
                        </div>
                        <div class="preview-card-q tex2jax_process">
                            <span style="font-weight:800; color:var(--text-secondary); margin-right:0.25rem;">Q.</span>
                            ${normalizeMathSyntax(cleanQ || c.frontMain || "問題")}
                        </div>
                        <div class="preview-card-a tex2jax_process">
                            <span style="font-weight:800; color:#059669; margin-right:0.25rem;">A.</span>
                            ${normalizeMathSyntax(cleanA || c.backAnswer || "解答")}
                        </div>
                    </div>
                `;
            }).join("");

            scheduleMathTypeset(modalPreviewCardsList);
        }

        if (modalPreviewCardSearch) {
            modalPreviewCardSearch.addEventListener("input", () => {
                renderModalCardPreview();
            });
        }

        // 🃏 「この条件でカード一覧を表示」ボタンの処理
        if (lessonPickerViewCardsBtn) {
            lessonPickerViewCardsBtn.onclick = () => {
                if (selectedLessonFilterIds.size === 0) {
                    showToast("少なくとも1つの授業を選択してください。", "warning");
                    return;
                }

                // 1. 選択した単元をメイン画面のフィルターに同期
                selectedInsightUnitIds.clear();
                selectedLessonFilterIds.forEach(id => selectedInsightUnitIds.add(id));
                saveSelectedInsightUnits();
                saveSelectedLessons();

                // 2. 出題条件（ステータス）をメイン画面の暗記フィルターに同期
                const statusRadio = document.querySelector('input[name="custom-test-status"]:checked');
                const statusVal = statusRadio ? statusRadio.value : 'all';
                memorizeStatusFilter = statusVal;

                const memorizeStatusFiltersEl = document.getElementById("memorize-status-filters");
                if (memorizeStatusFiltersEl) {
                    memorizeStatusFiltersEl.querySelectorAll(".status-chip-btn").forEach(btn => {
                        btn.classList.toggle("active", (btn.dataset.status || "all") === statusVal);
                    });
                }

                // 3. 表示形式を「🃏 カード一覧」に設定
                memorizeViewMode = "grid";
                localStorage.setItem("fc_memorize_view_mode", "grid");
                updateMemorizeViewModeButtons();

                // 4. 暗記事項タブへ切り替え
                switchTab("memorize");

                // 5. モーダルを閉じる
                closeLessonPickerModal();

                // 6. UI更新と再描画
                updateUnitMultiPickerUI();
                resetDisplayLimits();
                renderMemorize();

                showToast(`🃏 選択した ${selectedLessonFilterIds.size} 単元のカード一覧を表示しました`, "success");
            };
        }

        function openLessonPickerModal() {
            if (!lessonPickerModal) return;
            switchCustomTestTab("settings");
            // メイン画面で選択されていた単元を同期
            if (selectedInsightUnitIds && selectedInsightUnitIds.size > 0) {
                selectedInsightUnitIds.forEach(id => selectedLessonFilterIds.add(id));
                saveSelectedLessons();
            }
            const shuffleEl = document.getElementById("custom-test-shuffle");
            if (shuffleEl) {
                shuffleEl.checked = localStorage.getItem("flora_fc_shuffle") !== "false";
            }
            lessonPickerModal.style.display = "flex";
            if (lessonPickerSearch) lessonPickerSearch.value = "";
            if (modalPreviewCardSearch) modalPreviewCardSearch.value = "";
            renderLessonPickerList();
        }

        function closeLessonPickerModal() {
            if (!lessonPickerModal) return;
            lessonPickerModal.style.display = "none";
        }

        if (lessonPickerClose) lessonPickerClose.onclick = closeLessonPickerModal;
        if (lessonPickerCancelBtn) lessonPickerCancelBtn.onclick = closeLessonPickerModal;

        const lessonPickerSelectUnlearned = document.getElementById("lesson-picker-select-unlearned");
        if (lessonPickerSelectUnlearned) {
            lessonPickerSelectUnlearned.onclick = () => {
                selectedLessonFilterIds.clear();
                Object.keys(rawLessons).forEach(id => {
                    const stats = getLessonCardStats(id);
                    if (stats.unlearnedCount > 0 || stats.weakCount > 0) {
                        selectedLessonFilterIds.add(id);
                    }
                });
                renderLessonPickerList();
            };
        }

        if (lessonPickerSelectAll) {
            lessonPickerSelectAll.onclick = () => {
                Object.keys(rawLessons).forEach(id => selectedLessonFilterIds.add(id));
                renderLessonPickerList();
            };
        }

        if (lessonPickerClearAll) {
            lessonPickerClearAll.onclick = () => {
                selectedLessonFilterIds.clear();
                renderLessonPickerList();
            };
        }

        if (lessonPickerSearch) {
            lessonPickerSearch.addEventListener("input", () => {
                renderLessonPickerList();
            });
        }

        document.querySelectorAll('input[name="custom-test-status"]').forEach(r => {
            r.addEventListener('change', updateLessonPickerSummary);
        });

        if (lessonPickerConfirmBtn) {
            lessonPickerConfirmBtn.onclick = () => {
                if (selectedLessonFilterIds.size === 0) {
                    showToast("少なくとも1つの授業を選択してください。", "warning");
                    return;
                }
                saveSelectedLessons();

                const statusRadio = document.querySelector('input[name="custom-test-status"]:checked');
                const statusVal = statusRadio ? statusRadio.value : 'unlearned';

                const modeRadio = document.querySelector('input[name="custom-test-mode"]:checked');
                const modeVal = modeRadio ? modeRadio.value : '3d';

                const limitRadio = document.querySelector('input[name="custom-test-limit"]:checked');
                const limitVal = limitRadio ? limitRadio.value : '20';

                const shuffleEl = document.getElementById("custom-test-shuffle");
                const isShuffle = shuffleEl ? shuffleEl.checked : true;

                // 選択授業スコープでカードを取得
                if (fcScopeSelect) fcScopeSelect.value = "lessons";
                let items = getFlashcardPool("lessons");

                // ステータス絞り込み
                if (statusVal === "unlearned") {
                    items = items.filter(c => (c.srsBoxLevel ?? 0) === 0);
                } else if (statusVal === "weak") {
                    items = items.filter(c => (c.srsBoxLevel === 1) || ((c.srsLapses || 0) > 0));
                } else if (statusVal === "mastered") {
                    items = items.filter(c => (c.srsBoxLevel || 0) >= 4);
                }

                if (items.length === 0) {
                    showToast("選択した条件に合致するカードが0枚です。ステータス絞り込みや単元を変更してください。", "warning");
                    return;
                }

                closeLessonPickerModal();

                fcIsShuffle = isShuffle;
                localStorage.setItem("flora_fc_shuffle", isShuffle ? "true" : "false");
                updateFcShuffleButton();

                if (limitVal !== "all") {
                    const limitNum = parseInt(limitVal, 10);
                    if (Number.isFinite(limitNum) && items.length > limitNum) {
                        items = isShuffle ? shuffleArray(items).slice(0, limitNum) : items.slice(0, limitNum);
                    }
                }

                showToast(`🎯 カスタムテスト開始 (${items.length}問)`, "info", 2000);
                openFlashcardModal(items, 0, modeVal);
            };
        }

        // 授業選択モーダルを開くボタン群のバインド
        if (btnOpenLessonFilterDashboard) {
            btnOpenLessonFilterDashboard.onclick = () => {
                openLessonPickerModal();
            };
        }
        if (btnOpenLessonFilterToolbar) {
            btnOpenLessonFilterToolbar.onclick = () => {
                openLessonPickerModal();
            };
        }
        if (fcBtnOpenLessonPicker) {
            fcBtnOpenLessonPicker.onclick = () => {
                openLessonPickerModal();
            };
        }

        // グローバル関数: カード個別から開始
        window.startFlashcardForCard = function(type, id1, id2, e) {
            if (e) e.stopPropagation();
            const allItems = getFlashcardPool("current");
            if (allItems.length === 0) {
                showToast("カードが見つかりません。", "error");
                return;
            }
            let targetIdx = 0;
            if (type === 'memorize' || type === 'lesson_memo') {
                const found = allItems.findIndex(item => item.lessonId === id1 && item.memoId === id2);
                if (found !== -1) targetIdx = found;
            } else if (type === 'problem' || type === 'mnemonic' || type === 'qna') {
                const found = allItems.findIndex(item => item.id === id1 || item.problemId === id1);
                if (found !== -1) targetIdx = found;
            }
            openFlashcardModal(allItems, targetIdx);
        };

        window.startFlashcardSession = function() {
            if (btnStartFlashcardSession) btnStartFlashcardSession.click();
        };

        // キーボードショートカット（モーダル表示中）
        document.addEventListener("keydown", (e) => {
            if (lessonPickerModal && lessonPickerModal.style.display === "flex") {
                if (e.key === "Escape") {
                    e.preventDefault();
                    closeLessonPickerModal();
                    return;
                }
            }

            if (fcModal.style.display === "flex") {
                if (e.key === "Escape") {
                    e.preventDefault();
                    closeFcModal();
                    return;
                }

                // 完了画面のときはEnterかSpaceで再スタート
                if (fcFinishView.style.display === "block") {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        if (fcBtnFinishRestart) fcBtnFinishRestart.click();
                    }
                    return;
                }

                // 4択テストモード時の数字キー(1〜4)回答
                if (fcCurrentMode === "quiz" && !fcIsFlipped) {
                    if (["1", "2", "3", "4"].includes(e.key)) {
                        e.preventDefault();
                        const idx = parseInt(e.key, 10) - 1;
                        const btns = fcQuizBox.querySelectorAll(".fc-quiz-option");
                        if (btns[idx]) btns[idx].click();
                        return;
                    }
                }

                // 通常フリップ (Space)
                if (e.key === " " || e.key === "Spacebar") {
                    e.preventDefault();
                    flipFcCard();
                    return;
                }

                if (e.key === "Enter") {
                    e.preventDefault();
                    if (!fcIsFlipped) {
                        flipFcCard(true);
                    } else {
                        rateFcCard(3); // Enterで覚えた(Good)
                    }
                    return;
                }

                // 4段階評価ショートカット (裏面時)
                if (fcIsFlipped) {
                    if (e.key === "1" || e.key === "ArrowLeft") {
                        e.preventDefault();
                        rateFcCard(1); // もう一度
                        return;
                    }
                    if (e.key === "2") {
                        e.preventDefault();
                        rateFcCard(2); // 難しい
                        return;
                    }
                    if (e.key === "3" || e.key === "ArrowRight") {
                        e.preventDefault();
                        rateFcCard(3); // 覚えた
                        return;
                    }
                    if (e.key === "4" || e.key === "ArrowUp") {
                        e.preventDefault();
                        rateFcCard(4); // 簡単！
                        return;
                    }
                }
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                location.href = "index.html";
                return;
            }
            currentUser = user;

            let firebaseSyncDebounceTimer = null;
            function handleFirebaseSync() {
                if (firebaseSyncDebounceTimer) clearTimeout(firebaseSyncDebounceTimer);
                firebaseSyncDebounceTimer = setTimeout(() => {
                    updateCounts();
                    populateSubjectFilter();
                    renderActiveView();
                    updateSrsDashboardCounts();
                }, 60);
            }

            onValue(ref(database, 'users/' + user.uid + '/problems'), (snapshot) => {
                rawProblems = snapshot.val() || {};
                handleFirebaseSync();
            });

            onValue(ref(database, 'users/' + user.uid + '/qna_logs'), (snapshot) => {
                rawQnaLogs = snapshot.val() || {};
                handleFirebaseSync();
            });

            onValue(ref(database, 'users/' + user.uid + '/lessons'), (snapshot) => {
                rawLessons = snapshot.val() || {};
                handleFirebaseSync();
            });

            // 🧠 間隔反復(SRS)の進捗データをリアルタイム購読
            onValue(ref(database, 'users/' + user.uid + '/memorizeProgress'), (snapshot) => {
                rawMemorizeProgress = snapshot.val() || {};
                // モーダル演習中はバックグラウンドの不要な再描画を抑制してCPUとUI負荷を低減
                const isFcModalOpen = fcModal && fcModal.style.display !== "none";
                if (!isFcModalOpen) {
                    updateSrsDashboardCounts();
                    if (activeTab === "memorize") {
                        renderMemorize();
                    }
                }
            });

            // 📝 単語・カードのユーザー追加メモをリアルタイム購読
            onValue(ref(database, 'users/' + user.uid + '/card_memos'), (snapshot) => {
                rawCardUserMemos = snapshot.val() || {};
                try {
                    localStorage.setItem("local_card_user_memos", JSON.stringify(rawCardUserMemos));
                } catch(e) {}
                if (typeof updateFcUserMemoDisplay === "function") {
                    updateFcUserMemoDisplay();
                }
            });
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW register error:', err));
            });
        }
    </script>
</body>
</html>
