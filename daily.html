    <style>
        .timer-display {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--brand-primary);
            font-family: var(--font-mono);
            letter-spacing: -0.5px;
        }
        
        .problem-card { 
            display: flex; 
            flex-direction: column; 
            gap: 1.5rem; 
            padding: 2.4rem; 
            background: var(--bg-surface); 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        
        .sprint-title { font-size: 1.3rem; font-weight: 700; line-height: 1.8; color: var(--text-primary); margin-bottom: 0.5rem; }
        .control-panel { display: flex; gap: 1rem; width: 100%; margin-top: 1rem; }
        .btn-wrong { background: var(--error, #ef4444) !important; color: #fff !important; flex: 1; font-weight: 700; }
        .btn-correct { background: var(--brand-primary) !important; color: #fff !important; flex: 1; font-weight: 700; }

        /* 🎛️ モード切り替え & ツールバー */
        .sprint-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto 1rem auto;
            width: 100%;
        }
        .sprint-mode-group {
            display: flex;
            background: var(--bg-subtle);
            padding: 0.25rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            gap: 0.25rem;
        }
        .sprint-mode-btn {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            padding: 0.45rem 0.85rem;
            border-radius: var(--radius-md);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }
        .sprint-mode-btn:hover {
            color: var(--text-primary);
        }
        .sprint-mode-btn.active {
            background: var(--bg-surface);
            color: var(--brand-primary);
            box-shadow: var(--shadow-xs);
            font-weight: 700;
        }
        .sprint-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.45rem 0.9rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .sprint-action-btn:hover {
            background: var(--bg-subtle);
            color: var(--text-primary);
            border-color: var(--brand-border);
        }

        /* 💊 10問スロット進行インジケーター（Pills） */
        .sprint-pills-wrap {
            max-width: 900px;
            margin: 0 auto 1.2rem auto;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 0.45rem;
        }
        @media (max-width: 768px) {
            .sprint-pills-wrap {
                grid-template-columns: repeat(5, 1fr);
            }
        }
        .sprint-pill {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.45rem 0.2rem;
            border-radius: var(--radius-md);
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            text-align: center;
            transition: all 0.2s ease;
            cursor: default;
        }
        .sprint-pill-num {
            font-size: 0.72rem;
            font-weight: 800;
            font-family: var(--font-mono);
            color: var(--text-muted);
            line-height: 1;
        }
        .sprint-pill-field {
            font-size: 0.64rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-top: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .sprint-pill.current {
            border-color: var(--brand-primary);
            background: var(--brand-light);
            box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.2);
            transform: translateY(-1px);
        }
        .sprint-pill.current .sprint-pill-num {
            color: var(--brand-primary);
        }
        .sprint-pill.correct {
            border-color: #86efac;
            background: #f0fdf4;
        }
        .sprint-pill.correct .sprint-pill-num {
            color: #16a34a;
        }
        .sprint-pill.wrong {
            border-color: #fca5a5;
            background: #fef2f2;
        }
        .sprint-pill.wrong .sprint-pill-num {
            color: #dc2626;
        }

        .meta-badges-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .topic-pill {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

            display: none;
            flex-direction: column;
            gap: 1.2rem;
            background: var(--bg-subtle);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            margin-top: 1rem;
            width: 100%;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 3rem 2rem;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        .result-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 600px;
            margin: 1.5rem 0 2rem 0;
        }
        .result-stat-card {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .result-stat-val {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: var(--font-mono);
            color: var(--brand-primary);
        }
        .result-stat-label {
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-top: 0.2rem;
        }
        .result-q-table {
            width: 100%;
            max-width: 760px;
            text-align: left;
            margin-bottom: 2rem;
            border-collapse: collapse;
        }

            padding: 0.6rem 0.8rem;
            font-size: 0.82rem;
            border-bottom: 1px solid var(--border-color);
        }
        .result-q-table th {
            font-weight: 700;
            color: var(--text-secondary);
            background: var(--bg-subtle);
        }
    </style>
</head>

    <div class="app-layout">

                <div id="sprint-play-zone" class="problem-card">

                    <div class="sprint-title" id="problem-title-display">🤖 クラウド同期完了。AIがあなたの誤答データと過去履歴をスキャンし、本日の特訓問題10問（被り厳禁）を生成しています。少々お待ちください（約5秒）...</div>

                    <div class="control-panel" id="action-trigger-zone">
                        <button type="button" class="flora-btn flora-btn-primary btn-lg" id="btn-reveal-ans" style="display:none; width: 100%;">👁 答えを確認する</button>
                    </div>

                    <div class="reveal-zone" id="sprint-reveal-zone">

                        <div class="control-panel">
                            <button type="button" class="flora-btn btn-wrong btn-lg" id="btn-sprint-wrong">❌ ミスった（誤答ノートへ自動保存）</button>
                            <button type="button" class="flora-btn btn-correct btn-lg" id="btn-sprint-correct">🎉 解けた！(次へ)</button>
                        </div>
                    </div>
                </div>

                <div id="sprint-result-zone" class="result-screen">
                    <h2 style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 700; color: var(--brand-primary); margin-bottom: 0.4rem;">🏁 スプリント完了！</h2>
                    <p style="color:var(--text-secondary); margin-bottom: 1.5rem; font-size: var(--fs-sm);">本日の計算デイリースプリント10問をすべてクリアしました。</p>

                    <!-- 統計サマリー -->
                    <div class="result-stats-grid">
                        <div class="result-stat-card">
                            <div class="result-stat-val" id="final-time-display">00:00.00</div>
                            <div class="result-stat-label">TOTAL TIME</div>
                        </div>
                        <div class="result-stat-card">
                            <div class="result-stat-val" id="final-score-display">0 / 10</div>
                            <div class="result-stat-label">CLEAR SCORE</div>
                        </div>
                        <div class="result-stat-card">
                            <div class="result-stat-val" id="final-mistakes-display">0 問</div>
                            <div class="result-stat-label">誤答ノート追加</div>
                        </div>
                    </div>

                    <!-- 10問一覧テーブル -->
                    <table class="result-q-table" id="result-q-table">
                        <thead>

                                <th style="width: 50px;">No.</th>
                                <th style="width: 140px;">分野・単元</th>
                                <th>出題テーマ / 解法</th>
                                <th style="width: 90px; text-align: center;">結果</th>
                            </tr>
                        </thead>
                        <tbody id="result-q-table-body">
                            <!-- JSで結果を挿入 -->
                        </tbody>
                    </table>

                    <div style="display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center;">
                        <button type="button" class="flora-btn flora-btn-secondary btn-lg" id="btn-regenerate-sprint">🔄 新しい10問でもう一周する</button>
                        <button type="button" class="flora-btn flora-btn-primary btn-lg" onclick="location.href='index.html'">ダッシュボードに戻る</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

        // 🎲 日付とシード（再生成回数）から今日の日替わりサブトピックを決定
        function getDailySlotAssignments(todayStr, seed = 0, mode = "allround", weakList = []) {
            let hash = 0;
            const str = `${todayStr}_seed_${seed}_mode_${mode}`;
            for (let i = 0; i < str.length; i++) {
                hash = (hash << 5) - hash + str.charCodeAt(i);
                hash |= 0;
            }
            hash = Math.abs(hash);

            return SPRINT_SLOTS.map((slotDef, idx) => {
                const topicIndex = (hash + idx * 7) % slotDef.topics.length;
                let topic = slotDef.topics[topicIndex];
                let isWeaknessSlot = false;

                // 弱点リベンジモード、または弱点が検出された場合、Slot 4 や Slot 10 等を生徒の苦手分野に最適化
                if ((mode === "weakness" || weakList.length > 0) && (idx === 3 || idx === 9) && weakList.length > 0) {
                    const weakField = weakList[idx === 3 ? 0 : Math.min(1, weakList.length - 1)];
                    if (weakField) {
                        topic = `【生徒の苦手克服】${weakField}の典型的な盲点・ミスしやすい計算`;
                        isWeaknessSlot = true;
                    }
                }

                return {
                    slot: slotDef.slot,
                    subject: slotDef.subject,
                    field: slotDef.field,
                    shortField: slotDef.shortField,
                    topic: topic,
                    isWeaknessSlot: isWeaknessSlot
                };
            });
        }

        function clearSession() {
            try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) { /* noop */ }
        }

        function loadSessionForToday(todayStr) {
            try {
                const raw = localStorage.getItem(SESSION_STORAGE_KEY);
                if (!raw) return null;

                if (!session || session.dateStr !== todayStr) return null;
                return session;
            } catch (e) {

            }

        // 💊 進捗ピルバーの描画・更新
        function renderPills() {
            const container = document.getElementById("sprint-pills-container");
            if (!container) return;

            let html = "";
            for (let i = 0; i < 10; i++) {
                const q = selectedQuestions[i];
                const res = questionResults[i];
                let statusClass = "";
                let label = `Q${i + 1}`;
                let fieldShort = "";

                if (q) {
                    fieldShort = q.shortField || (q.field ? q.field.slice(0, 5) : `第${i + 1}問`);
                }

                if (i === currentQuestionIndex) {
                    statusClass = "current";
                } else if (res && res.result === "correct") {
                    statusClass = "correct";
                } else if (res && res.result === "wrong") {
                    statusClass = "wrong";
                }

                html += `
                    <div class="sprint-pill ${statusClass}" title="${q ? `${q.subject} - ${q.field}` : `問題 ${i + 1}`}">
                        <span class="sprint-pill-num">${res && res.result === "correct" ? "✓" : res && res.result === "wrong" ? "✗" : label}</span>
                        <span class="sprint-pill-field">${fieldShort}</span>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // ✨ クラウドキャッシュ確認＆AI生成パイプライン
        function setupDailySprintAI(uid) {
            const now = new Date();
            const todayStr = `${now.getFullYear()}-${now.getMonth() + 1}-${now.getDate()}`;
            currentTodayStr = todayStr;

            // モードセレクターの初期状態反映
            initModeSelectorUI();

            currentSprintCacheRef = sprintCacheRef;

            onValue(sprintCacheRef, async (snapshot) => {
                const cacheData = snapshot.val();
                if (cacheData && cacheData.questions && cacheData.questions.length >= 10) {
                    selectedQuestions = cacheData.questions;
                    const session = loadSessionForToday(todayStr);

                    if (session && Array.isArray(session.questionResults)) {
                        questionResults = session.questionResults;
                    } else {
                        questionResults = [];
                    }

                    if (session && session.finished) {
                        document.getElementById("sprint-play-zone").style.display = "none";
                        document.getElementById("sprint-result-zone").style.display = "flex";
                        document.getElementById("final-time-display").textContent = session.finalTime || "00:00.00";

                    } else if (session && typeof session.currentQuestionIndex === "number" && session.currentQuestionIndex < selectedQuestions.length) {
                        currentQuestionIndex = session.currentQuestionIndex;
                        startSprintTimer(session.elapsedMs || 0);

                        currentQuestionIndex = 0;
                        startSprintTimer(0);
                    }
                    renderPills();
                } else {
                    // 今日まだ作ってないなら、過去履歴と苦手データをスキャンしてAIに生成させる
                    await generateSprintWithAI(uid, todayStr, sprintCacheRef);

        // 🧠 誤答ノートのスキャン（苦手分野の自動抽出）
        async function fetchUserWeaknesses(uid) {
            try {
                const probSnap = await get(ref(database, `users/${uid}/problems`));
                const probData = probSnap.val() || {};
                const fieldCounts = {};

                Object.values(probData).forEach(p => {
                    if (!p) return;
                    const isMistake = (typeof p.errorCount === "number" && p.errorCount > 0) || p.lastResult === false;
                    if (isMistake && p.field) {
                        fieldCounts[p.field] = (fieldCounts[p.field] || 0) + 1;
                    }
                });

                const sortedFields = Object.entries(fieldCounts)
                    .sort((a, b) => b[1] - a[1])
                    .map(entry => entry[0]);

                return sortedFields.slice(0, 3);
            } catch (e) {
                console.warn("苦手単元スキャンに失敗しました:", e);
                return [];
            }
        }

        // 📜 直近の過去出題履歴（実際の問題文タイトル）の収集
        async function fetchRecentProblemTitles(uid, todayStr) {
            try {
                const historyRootRef = ref(database, 'users/' + uid + '/daily_sprint');
                const historySnapshot = await get(historyRootRef);
                const historyData = historySnapshot.val() || {};

                const titles = [];
                Object.keys(historyData)
                    .filter(dateKey => dateKey !== todayStr)
                    .sort((a, b) => new Date(historyData[b].generatedAt || 0) - new Date(historyData[a].generatedAt || 0))
                    .slice(0, 7) // 直近7回分
                    .forEach(dateKey => {
                        const qs = historyData[dateKey].questions || [];
                        qs.forEach(q => {
                            if (q.title) {
                                titles.push(q.title.replace(/\s+/g, ' ').slice(0, 60));
                            }
                        });
                    });

                return titles.slice(0, 25);
            } catch (e) {
                console.warn("過去出題履歴の取得に失敗しました:", e);
                return [];
            }
        }

        function startSprintTimer(resumeElapsedMs = 0) {
            document.getElementById("btn-reveal-ans").style.display = "block";

        function updateTimer() {
            const diff = Date.now() - startTime;
            const min = String(Math.floor(diff / 60000)).padStart(2, '0');
            const sec = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
            const ms = String(Math.floor((diff % 1000) / 10)).padStart(2, '0');
            document.getElementById("sprint-timer").textContent = `${min}:${sec}.${ms}`;
        }

        let mathTypesetQueue = Promise.resolve();
        function forceTriggerMathJax(targetElement = null) {
            mathTypesetQueue = mathTypesetQueue.then(async () => {
                if (!window.MathJax) return;
                if (!window.MathJax.typesetPromise) {
                    if (window.MathJax.startup && window.MathJax.startup.promise) {
                        await window.MathJax.startup.promise.catch(() => {});
                    }
                }
                if (!window.MathJax || !window.MathJax.typesetPromise) return;

                try {
                    let targets = null;
                    if (Array.isArray(targetElement)) {
                        targets = targetElement.filter(el => el && el.isConnected);
                    } else if (targetElement && targetElement.isConnected) {
                        targets = [targetElement];
                    } else if (targetElement && !targetElement.isConnected) {
                        return;
                    }

                    if (typeof MathJax.typesetClear === "function") {
                        try {
                            if (targets && targets.length > 0) MathJax.typesetClear(targets);
                            else if (!targetElement) MathJax.typesetClear();
                        } catch (_) {}
                    }
                    if (targets && targets.length > 0) {
                        await MathJax.typesetPromise(targets);
                    } else if (!targetElement) {
                        await MathJax.typesetPromise();
                    }
                } catch (err) {
                    console.debug("MathJax notice (handled):", err.message);
                }
            }).catch(err => {
                console.debug("MathJax queue notice:", err);
            });
            return mathTypesetQueue;
        }

        function normalizeMathSyntax(str) {
            if (!str) return "";
            let s = String(str);

            s = s.replace(/\\bbox\s*\[[^\]]*\]\s*\{((?:[^{}]*|\{[^{}]*\})*)\}/g, (_, content) => {
                let c = content.trim();
                while (/^\\text\{([\s\S]*)\}$/.test(c)) {
                    c = c.replace(/^\\text\{([\s\S]*)\}$/, "$1").trim();
                }
                if (!c) c = "\\quad";
                return `\\bbox[2px,border:1px solid]{\\text{${c}}}`;
            });

            s = s.replace(/\\bbox\s*\[[^\]]*\]\s*([0-9A-Za-zぁ-んァ-ヶー一-龠々]+)/g, (_, content) => {
                let c = content.trim();
                while (/^\\text\{([\s\S]*)\}$/.test(c)) {
                    c = c.replace(/^\\text\{([\s\S]*)\}$/, "$1").trim();
                }
                if (!c) c = "\\quad";
                return `\\bbox[2px,border:1px solid]{\\text{${c}}}`;
            });

            s = s.replace(/\\bbox\s*\[[^\]]*\](?!\s*\{)/g, `\\bbox[2px,border:1px solid]{\\text{\\quad}}`);

            s = s.replace(/\\(?:fbox|boxed|framebox)(?:\s*\[[^\]]*\])?\s*\{((?:[^{}]*|\{[^{}]*\})*)\}/g, (_, content) => {
                let c = content.trim();
                while (/^\\text\{([\s\S]*)\}$/.test(c)) {
                    c = c.replace(/^\\text\{([\s\S]*)\}$/, "$1").trim();
                }
                if (!c) c = "\\quad";
                return `\\bbox[2px,border:1px solid]{\\text{${c}}}`;
            });
            s = s.replace(/\\(?:fbox|boxed|framebox)(?:\s*\[[^\]]*\])?\s+([0-9A-Za-zぁ-んァ-ヶー一-龠々]+)/g, (_, content) => {
                let c = content.trim();
                while (/^\\text\{([\s\S]*)\}$/.test(c)) {
                    c = c.replace(/^\\text\{([\s\S]*)\}$/, "$1").trim();
                }
                if (!c) c = "\\quad";
                return `\\bbox[2px,border:1px solid]{\\text{${c}}}`;
            });
            s = s.replace(/\\(?:fbox|boxed|framebox)(?:\s*\[[^\]]*\])?(?!\s*\{)/g, `\\bbox[2px,border:1px solid]{\\text{\\quad}}`);

            const parts = s.split(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g);
            for (let i = 0; i < parts.length; i += 2) {
                let chunk = parts[i];
                if (!chunk) continue;
                chunk = chunk.replace(/(\\bbox\[2px,border:1px solid\]\{\\text\{[^}]*\}\}(?:\^[0-9A-Za-z^\circ]+)?)/g, '$$$1$$');
                chunk = chunk.replace(/(\\(?:triangle|angle|sqrt|frac|vec|alpha|beta|gamma|theta|pi|pm|mp|le|ge|leqq|geqq|neq|approx|sim|equiv|subset|supset|cap|cup|times|div|cdot|int|sum|lim|log|ln|sin|cos|tan)\b[^\s$、。,.)）]*)/g, '$$$1$$');
                chunk = chunk.replace(/\$\s*\$/g, '');
                parts[i] = chunk;
            }
            return parts.join("");
        }

        function renderQuestion() {
            if (currentQuestionIndex >= selectedQuestions.length) {
                finishSprint();
                return;
            }

            document.getElementById("sprint-reveal-zone").style.display = "none";
            document.getElementById("btn-reveal-ans").style.display = "block";
            document.getElementById("sprint-progress").textContent = `Q. ${currentQuestionIndex + 1} / ${selectedQuestions.length}`;

            const q = selectedQuestions[currentQuestionIndex];
            document.getElementById("problem-meta").textContent = `${q.subject} // ${q.field}`;
            
            const topicTag = document.getElementById("problem-topic-tag");
            if (q.topic) {
                topicTag.textContent = `#${q.topic}`;
                topicTag.style.display = "inline-flex";
            } else {
                topicTag.style.display = "none";
            }

            const weakTag = document.getElementById("weakness-tag");
            if (q.isWeaknessSlot) {
                weakTag.style.display = "inline-flex";
            } else {
                weakTag.style.display = "none";
            }

            document.getElementById("problem-title-display").innerHTML = normalizeMathSyntax(q.title);
            
            let stepsRaw = q.steps || "";
            if (!stepsRaw && q.answerFormula) {
                stepsRaw = q.answerFormula;
            } else if (!stepsRaw && q.answer) {
                stepsRaw = q.answer;
            }
            let cleanSteps = normalizeMathSyntax(stepsRaw);
            cleanSteps = cleanSteps.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
            document.getElementById("sprint-steps-display").innerHTML = cleanSteps;

            renderPills();

            requestAnimationFrame(() => {
                const titleEl = document.getElementById("problem-title-display");
                forceTriggerMathJax(titleEl);
            });
        }

        // ❌ ミスった時の処理（誤答ノートへ自動保存）
        async function sendToMainRemindList() {
            if (!loginUid) return;
            const q = selectedQuestions[currentQuestionIndex];

            questionResults[currentQuestionIndex] = {
                id: q.id,
                subject: q.subject,
                field: q.field,
                topic: q.topic || "計算特訓",
                title: q.title,
                result: "wrong"
            };

            const targetRef = ref(database, 'users/' + loginUid + '/problems/' + q.id);
            const nowIso = new Date().toISOString();

            const remindProblem = {
                id: q.id,
                title: q.title,
                short_title: `【DS】${q.field || "計算"}`,
                subject: q.subject || "数学",
                field: q.field || "計算特訓",
                trap_description: `デイリースプリント（${q.topic || "計算"}）でミスした問題。符号ミスや展開手順、解法選択を見直してください。`,
                strategyPattern: q.topic || "",
                errorCount: 1,
                lastAttemptAt: nowIso,
                createdAt: nowIso,
                lastResult: false,
                thumb: null,
                imageCount: 0,
                answerFormula: `${q.answer}\n\n【解説】\n${q.steps}`
            };

            try {
                await set(targetRef, remindProblem);
                showToast("弱点としてロックオン！ダッシュボードの復習リストに自動同期しました！", "success", 2500);
            } catch (e) {
                console.error(e);
            }
            nextQuestion();
        }

        // 🎉 正解した時の処理
        function markCorrectAndNext() {
            const q = selectedQuestions[currentQuestionIndex];
            questionResults[currentQuestionIndex] = {
                id: q.id,
                subject: q.subject,
                field: q.field,
                topic: q.topic || "計算特訓",
                title: q.title,
                result: "correct"
            };
            nextQuestion();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < selectedQuestions.length) {
                saveSession();
                renderQuestion();
            } else {
                finishSprint();
            }
        }

        // 🏁 スプリント完了時の結果集計画面
        function finishSprint() {
            clearInterval(timerInterval);
            const finalTime = document.getElementById("sprint-timer").textContent;
            document.getElementById("sprint-play-zone").style.display = "none";
            document.getElementById("sprint-result-zone").style.display = "flex";
            document.getElementById("final-time-display").textContent = finalTime;
            
            showFinalResultSummary();
            saveFinishedSession(finalTime);
            renderPills();
        }

        function showFinalResultSummary() {
            let correctCount = 0;
            let wrongCount = 0;
            const tableBody = document.getElementById("result-q-table-body");
            if (!tableBody) return;

            let rowsHtml = "";
            selectedQuestions.forEach((q, idx) => {
                const res = questionResults[idx];
                const isCorrect = res && res.result === "correct";
                const isWrong = res && res.result === "wrong";
                if (isCorrect) correctCount++;
                if (isWrong) wrongCount++;

                const resultBadge = isCorrect
                    ? `<span style="color:#16a34a; font-weight:800;">✓ 正解</span>`
                    : isWrong
                    ? `<span style="color:#dc2626; font-weight:800;">✗ ミス（保存済）</span>`
                    : `<span style="color:var(--text-muted);">-</span>`;

                rowsHtml += `
                    <tr>
                        <td style="font-weight:700; color:var(--text-muted);">Q${idx + 1}</td>
                        <td><strong>${q.subject}</strong> <span style="font-size:0.75rem; color:var(--text-secondary);">(${q.field})</span></td>
                        <td style="color:var(--text-secondary);">${q.topic || "標準計算"}</td>
                        <td style="text-align: center;">${resultBadge}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = rowsHtml;
            document.getElementById("final-score-display").textContent = `${correctCount} / ${selectedQuestions.length}`;
            document.getElementById("final-mistakes-display").textContent = `${wrongCount} 問`;
        }

        // ==========================================================================
        // 📋【共通イベントリスナー登録群】
        // ==========================================================================
        document.getElementById("btn-reveal-ans").addEventListener("click", () => {
            document.getElementById("btn-reveal-ans").style.display = "none";
            const revealZone = document.getElementById("sprint-reveal-zone");
            revealZone.style.display = "flex";
            requestAnimationFrame(() => {
                forceTriggerMathJax(revealZone);
            });
        });

        document.getElementById("btn-sprint-correct").addEventListener("click", markCorrectAndNext);
        document.getElementById("btn-sprint-wrong").addEventListener("click", sendToMainRemindList);
        document.getElementById("btn-regenerate-sprint").addEventListener("click", () => regenerateSprint(true));

        // ==========================================================================
        // 🚀【重要】認証状態の監視開始
        // ==========================================================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginUid = user.uid;
                setupDailySprintAI(user.uid);
            } else {
                location.href = "index.html";
            }
        });
    </script>
</body>
</html>
