<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.png">
    <link rel="apple-touch-icon" href="icons/icon.png">
    <title>Flora | 歴史 統合年表（世界史・日本史）</title>
    <link rel="stylesheet" href="style.css?v=3.5">

    <style>
        /* 教科切り替え大型タブ */
        .history-type-switch {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }
        .history-type-btn {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border-radius: var(--radius-xl);
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-xs);
        }
        .history-type-btn:hover {
            border-color: var(--brand-primary);
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        .history-type-btn.active {
            background: var(--brand-primary);
            color: #fff;
            border-color: var(--brand-primary);
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
        }

        /* フィルター領域 */
        .filter-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.2rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: var(--shadow-xs);
            margin-bottom: 1.5rem;
        }
        .filter-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .filter-label { font-size: 0.76rem; font-weight: 700; color: var(--text-secondary); }

        .region-tab-btn {
            background: var(--bg-subtle);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: var(--fs-xs);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .region-tab-btn:hover { border-color: #94A3B8; color: var(--text-primary); }
        .region-tab-btn.active {
            background: var(--brand-primary) !important;
            color: #fff !important;
            border-color: var(--brand-primary) !important;
        }

        .search-input {
            flex-grow: 1; background: var(--bg-subtle);
            border: 1px solid var(--border-color); color: var(--text-primary);
            padding: 0.55rem 0.9rem; border-radius: var(--radius-md); font-size: var(--fs-sm);
        }
        .search-input:focus { outline: none; border-color: var(--brand-primary); }

        /* タイムライン本体 */
        .timeline-stream {
            position: relative;
            margin-top: 1rem;
            padding-left: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* 縦のタイムライン軸 */
        .timeline-stream::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 11px;
            width: 2px;
            background: linear-gradient(180deg, var(--brand-primary) 0%, rgba(5, 150, 105, 0.1) 100%);
        }

        .timeline-node {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* タイムライン上のドット */
        .timeline-node::before {
            content: "";
            position: absolute;
            left: -2rem;
            top: 1.2rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--brand-primary);
            box-shadow: 0 0 0 3px var(--brand-light);
            z-index: 2;
        }

        /* 時代・世紀見出しセパレーター */
        .century-header {
            position: relative;
            font-size: 1rem;
            font-weight: 700;
            color: var(--brand-primary);
            margin: 1.5rem 0 0.5rem -1.2rem;
            padding: 0.35rem 0.85rem;
            background: var(--brand-light);
            border-left: 3px solid var(--brand-primary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            display: inline-block;
            align-self: flex-start;
        }

        /* 出来事カード */
        .event-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.1rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: var(--shadow-xs);
            transition: all 0.2s ease;
        }
        .event-card:hover {
            border-color: var(--brand-primary);
            box-shadow: var(--shadow-sm);
            transform: translateX(4px);
        }

        .event-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-year {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--brand-primary);
            letter-spacing: -0.5px;
        }
        .event-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .event-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.4rem;
        }
        .source-link-btn {
            font-size: var(--fs-xs);
            padding: 0.25rem 0.6rem;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            border: 1px solid transparent;
            transition: all 0.15s ease;
        }
        .link-problem {
            background: #EEF2FF;
            color: #4F46E5;
            border-color: #C7D2FE;
        }
        .link-problem:hover { background: #E0E7FF; }
        .link-lesson {
            background: #ECFDF5;
            color: #059669;
            border-color: #A7F3D0;
        }
        .link-lesson:hover { background: #D1FAE5; }

        .mnemonic-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: #FEF3C7;
            border: 1px solid #FDE68A;
            border-radius: var(--radius-md);
            padding: 0.3rem 0.65rem;
            font-size: 0.82rem;
            color: #92400E;
            margin-top: 0.2rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- 🌿 左側共通サイドバー -->
        <div id="flora-sidebar"></div>

        <!-- 💻 右側メインコンテンツ -->
        <main class="app-main">
            <div class="workspace-content-wrap">

                <!-- ページヘッダー -->
                <div class="page-header">
                    <div class="page-title-group">
                        <h1 class="page-title" id="page-main-title">🏛️ 歴史 統合年表</h1>
                        <p class="page-subtitle">誤答問題や参考書授業から抽出された出来事が、自動で年代順に整理されるビジュアル年表</p>
                    </div>
                    <div class="page-actions" style="font-size: var(--fs-xs); color: var(--text-secondary);" id="event-total-count">
                        読み込み中...
                    </div>
                </div>

                <!-- 🌍 世界史 / ⛩️ 日本史 切替大型タブ -->
                <div class="history-type-switch">
                    <button type="button" class="history-type-btn active" id="type-btn-world" data-type="world">
                        🌍 世界史 年表
                    </button>
                    <button type="button" class="history-type-btn" id="type-btn-japan" data-type="japan">
                        ⛩️ 日本史 年表
                    </button>
                </div>

                <!-- フィルターバー -->
                <div class="filter-card">
                    <div class="filter-row">
                        <span class="filter-label">🔎 検索：</span>
                        <input type="text" class="search-input" id="search-input" placeholder="出来事名・年号・キーワードで検索...">
                    </div>
                    <div class="filter-row" id="filter-category-row">
                        <span class="filter-label" id="filter-category-label">🌍 地域：</span>
                        <div id="region-filter-container" style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                            <!-- JSで動的生成 -->
                        </div>
                    </div>
                </div>

                <!-- タイムライン表示領域 -->
                <main id="timeline-main">
                    <div class="timeline-stream" id="timeline-stream">
                        <!-- JSで動的に出来事ノードを挿入 -->
                    </div>
                    <div id="empty-notice" style="display:none; text-align:center; padding: 4rem 1rem; color: var(--text-secondary); font-size: var(--fs-sm);">
                        まだ出来事データがありません。<br>問題を誤答ノートに登録するか、授業モードで学習すると自動でここに年表が作られます！
                    </div>
                </main>

            </div>
        </main>
    </div>

    <script src="global-timer-sync.js"></script>
    <script src="sidebar.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55MdhpjJizQaLEdRu-XhBVJ4PqrHsAyY",
            authDomain: "buturi-2449e.firebaseapp.com",
            databaseURL: "https://buturi-2449e-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "buturi-2449e",
            storageBucket: "buturi-2449e.appspot.com",
            messagingSenderId: "976306696124",
            appId: "1:976306696124:web:e455c1953544bff5c345b9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // 世界史カテゴリー（地域）
        const WORLD_REGIONS = [
            "ALL",
            "東アジア",
            "東南アジア",
            "南アジア",
            "西アジア・中央アジア",
            "ヨーロッパ",
            "アメリカ大陸",
            "アフリカ",
            "地域をまたぐ／世界全体"
        ];

        // 日本史カテゴリー（時代・分野）
        const JAPAN_ERAS = [
            "ALL",
            "古代（旧石器〜平安）",
            "中世（鎌倉・室町）",
            "近世（安土桃山・江戸）",
            "近代（幕末〜大正）",
            "現代（昭和〜令和）"
        ];

        let activeHistoryType = "world"; // "world" or "japan"
        let currentCategoryFilter = "ALL";
        let currentSearchQuery = "";
        let rawProblems = {};
        let rawLessons = {};

        // カテゴリーフィルターボタンの再構築
        function rebuildCategoryFilters() {
            const container = document.getElementById("region-filter-container");
            const labelEl = document.getElementById("filter-category-label");
            const categories = activeHistoryType === "world" ? WORLD_REGIONS : JAPAN_ERAS;
            
            labelEl.textContent = activeHistoryType === "world" ? "🌍 地域：" : "⛩️ 時代：";

            container.innerHTML = categories.map(c => `
                <button type="button" class="region-tab-btn ${c === currentCategoryFilter ? 'active' : ''}" data-category="${c}">
                    ${c === 'ALL' ? '✨ すべて' : c}
                </button>
            `).join("");

            container.querySelectorAll(".region-tab-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    container.querySelectorAll(".region-tab-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    currentCategoryFilter = btn.getAttribute("data-category");
                    renderTimeline();
                });
            });
        }

        // 世界史 / 日本史 切替
        document.getElementById("type-btn-world").addEventListener("click", () => {
            if (activeHistoryType === "world") return;
            activeHistoryType = "world";
            currentCategoryFilter = "ALL";
            document.getElementById("type-btn-world").classList.add("active");
            document.getElementById("type-btn-japan").classList.remove("active");
            document.getElementById("page-main-title").textContent = "🌍 世界史 統合年表";
            rebuildCategoryFilters();
            renderTimeline();
        });

        document.getElementById("type-btn-japan").addEventListener("click", () => {
            if (activeHistoryType === "japan") return;
            activeHistoryType = "japan";
            currentCategoryFilter = "ALL";
            document.getElementById("type-btn-japan").classList.add("active");
            document.getElementById("type-btn-world").classList.remove("active");
            document.getElementById("page-main-title").textContent = "⛩️ 日本史 統合年表";
            rebuildCategoryFilters();
            renderTimeline();
        });

        rebuildCategoryFilters();

        // 検索入力リスナー
        const searchInput = document.getElementById("search-input");
        searchInput.addEventListener("input", (e) => {
            currentSearchQuery = e.target.value.trim().toLowerCase();
            renderTimeline();
        });

        // 日本史の時代判定ヘルパー
        function getJapanEraCategory(yearSort) {
            if (yearSort <= 1185) return "古代（旧石器〜平安）";
            if (yearSort <= 1573) return "中世（鎌倉・室町）";
            if (yearSort <= 1867) return "近世（安土桃山・江戸）";
            if (yearSort <= 1926) return "近代（幕末〜大正）";
            return "現代（昭和〜令和）";
        }

        // Firebaseデータ収集＆マージ
        function collectAllEvents() {
            const eventsMap = new Map(); // key: "出来事名_年" -> 統合オブジェクト
            const isWorld = activeHistoryType === "world";

            // 1. 誤答問題 (problems) から抽出
            Object.values(rawProblems).forEach(p => {
                if (!p) return;
                const isMatchSubject = isWorld
                    ? (p.subject === "世界史" || (!p.subject && Array.isArray(p.events)))
                    : (p.subject === "日本史");
                if (!isMatchSubject) return;

                const problemEvents = Array.isArray(p.events) ? p.events : [];
                problemEvents.forEach(ev => {
                    if (!ev || !ev.name) return;
                    const yearSort = typeof ev.year_sort === "number" ? ev.year_sort : (parseInt(ev.year) || 9999);
                    const category = isWorld 
                        ? (ev.region || "地域をまたぐ／世界全体")
                        : (ev.era || getJapanEraCategory(yearSort));

                    const key = `${ev.name}_${ev.year || ""}`;
                    if (!eventsMap.has(key)) {
                        eventsMap.set(key, {
                            name: ev.name,
                            year: ev.year || "年代未詳",
                            year_sort: yearSort,
                            category: category,
                            mnemonics: p.mnemonic ? [p.mnemonic] : [],
                            sources: []
                        });
                    }
                    const item = eventsMap.get(key);
                    item.sources.push({
                        type: "problem",
                        id: p.id,
                        title: p.short_title || "誤答問題"
                    });
                });
            });

            // 2. 参考書授業 (lessons) から抽出
            Object.values(rawLessons).forEach(l => {
                if (!l || !Array.isArray(l.historicalEvents)) return;
                const isMatchSubject = isWorld
                    ? (l.subject === "世界史" || (!l.subject && l.historicalEvents.length > 0))
                    : (l.subject === "日本史");
                if (!isMatchSubject) return;

                l.historicalEvents.forEach(ev => {
                    if (!ev || !ev.name) return;
                    const yearSort = typeof ev.year_sort === "number" ? ev.year_sort : (parseInt(ev.year) || 9999);
                    const category = isWorld 
                        ? (ev.region || "地域をまたぐ／世界全体")
                        : (ev.era || getJapanEraCategory(yearSort));

                    const key = `${ev.name}_${ev.year || ""}`;
                    if (!eventsMap.has(key)) {
                        eventsMap.set(key, {
                            name: ev.name,
                            year: ev.year || "年代未詳",
                            year_sort: yearSort,
                            category: category,
                            mnemonics: [],
                            sources: []
                        });
                    }
                    const item = eventsMap.get(key);
                    item.sources.push({
                        type: "lesson",
                        id: l.id,
                        title: l.title || "授業"
                    });
                });
            });

            // 配列化して年代順（year_sort 昇順）にソート
            return Array.from(eventsMap.values()).sort((a, b) => a.year_sort - b.year_sort);
        }

        // 世紀・時代のラベル生成ヘルパー
        function formatCentury(yearSort) {
            if (yearSort === 9999) return "年代未詳・その他";
            if (activeHistoryType === "japan") {
                const era = getJapanEraCategory(yearSort);
                if (yearSort > 0) return `${era} (${yearSort}年頃)`;
                return `${era} (紀元前)`;
            }
            if (yearSort < 0) {
                const c = Math.ceil(Math.abs(yearSort) / 100);
                return `紀元前 ${c} 世紀`;
            } else if (yearSort === 0) {
                return "1 世紀（紀元前後）";
            } else {
                const c = Math.ceil(yearSort / 100);
                return `${c} 世紀`;
            }
        }

        function renderTimeline() {
            const streamEl = document.getElementById("timeline-stream");
            const emptyEl = document.getElementById("empty-notice");
            const totalCountEl = document.getElementById("event-total-count");

            const allEvents = collectAllEvents();

            // 絞り込み
            const filtered = allEvents.filter(ev => {
                if (currentCategoryFilter !== "ALL" && ev.category !== currentCategoryFilter) return false;
                if (currentSearchQuery) {
                    const haystack = `${ev.name} ${ev.year} ${ev.category} ${ev.mnemonics.join(" ")}`.toLowerCase();
                    if (!haystack.includes(currentSearchQuery)) return false;
                }
                return true;
            });

            totalCountEl.textContent = `収録出来事: ${filtered.length} 件`;

            if (filtered.length === 0) {
                streamEl.innerHTML = "";
                emptyEl.style.display = "block";
                emptyEl.innerHTML = `まだ${activeHistoryType === "world" ? "世界史" : "日本史"}の出来事データがありません。<br>${activeHistoryType === "world" ? "世界史" : "日本史"}の問題を誤答ノートに登録するか、授業モードで学習すると自動でここに年表が作られます！`;
                return;
            }

            emptyEl.style.display = "none";

            let currentCenturyLabel = null;
            let html = "";

            filtered.forEach(ev => {
                const centuryLabel = formatCentury(ev.year_sort);
                if (centuryLabel !== currentCenturyLabel) {
                    currentCenturyLabel = centuryLabel;
                    html += `<div class="century-header">⏳ ${centuryLabel}</div>`;
                }

                const sourcesHtml = ev.sources.map(s => {
                    if (s.type === "problem") {
                        return `<a href="problem.html?id=${encodeURIComponent(s.id)}" class="source-link-btn link-problem">📌 問題: ${s.title}</a>`;
                    } else {
                        return `<a href="lesson.html?id=${encodeURIComponent(s.id)}" class="source-link-btn link-lesson">📖 授業: ${s.title}</a>`;
                    }
                }).join("");

                const mnemonicHtml = ev.mnemonics.length > 0
                    ? `<div class="mnemonic-badge">🎴 語呂合わせ: ${ev.mnemonics[0]}</div>`
                    : "";

                html += `
                    <div class="timeline-node">
                        <div class="event-card">
                            <div class="event-top">
                                <span class="event-year">${ev.year}</span>
                                <span class="badge badge-history" style="font-size:0.7rem;">${ev.category}</span>
                            </div>
                            <div class="event-name">${ev.name}</div>
                            ${mnemonicHtml}
                            <div class="event-links">
                                ${sourcesHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            streamEl.innerHTML = html;
        }

        // テスターログイン
        window.floraTestLogin = async function() {
            try {
                await signInWithEmailAndPassword(auth, "tester@flora.local", "flora1234");
            } catch(e) {}
        };

        if (new URLSearchParams(window.location.search).has("autologin") || new URLSearchParams(window.location.search).has("test")) {
            setTimeout(() => {
                if (!auth.currentUser) window.floraTestLogin();
            }, 500);
        }

        // Firebase 認証＆データ監視
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // 未ログイン時の自動テスターログイン待機
                return;
            }

            // 問題データの監視
            onValue(ref(database, 'users/' + user.uid + '/problems'), (snapshot) => {
                rawProblems = snapshot.val() || {};
                renderTimeline();
            });

            // 授業データの監視
            onValue(ref(database, 'users/' + user.uid + '/lessons'), (snapshot) => {
                rawLessons = snapshot.val() || {};
                renderTimeline();
            });
        });
    </script>
</body>
</html>
