<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.png">
    <link rel="apple-touch-icon" href="icons/icon.png">
    <title>Flora | 歴史 統合年表（世界史・日本史）</title>
    <link rel="stylesheet" href="style.css?v=3.5">

    <style>
        /* 教科切り替え大型タブ */
        .history-type-switch {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }
        .history-type-btn {
            flex: 1;
            padding: 0.9rem 1.2rem;
            border-radius: var(--radius-xl);
            border: 2px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-xs);
        }
        .history-type-btn:hover {
            border-color: var(--brand-primary);
            color: var(--text-primary);
            transform: translateY(-1px);
        }
        .history-type-btn.active {
            background: var(--brand-primary);
            color: #fff;
            border-color: var(--brand-primary);
            box-shadow: 0 4px 14px rgba(5, 150, 105, 0.25);
        }

        /* フィルター領域 */
        .filter-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.2rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: var(--shadow-xs);
            margin-bottom: 1.5rem;
        }
        .filter-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .filter-label { font-size: 0.76rem; font-weight: 700; color: var(--text-secondary); }

        .region-tab-btn {
            background: var(--bg-subtle);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: var(--fs-xs);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .region-tab-btn:hover { border-color: #94A3B8; color: var(--text-primary); }
        .region-tab-btn.active {
            background: var(--brand-primary) !important;
            color: #fff !important;
            border-color: var(--brand-primary) !important;
        }

        .search-input {
            flex-grow: 1; background: var(--bg-subtle);
            border: 1px solid var(--border-color); color: var(--text-primary);
            padding: 0.55rem 0.9rem; border-radius: var(--radius-md); font-size: var(--fs-sm);
        }
        .search-input:focus { outline: none; border-color: var(--brand-primary); }

        /* タイムライン本体 */
        .timeline-stream {
            position: relative;
            margin-top: 1rem;
            padding-left: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* 縦のタイムライン軸 */
        .timeline-stream::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 11px;
            width: 2px;
            background: linear-gradient(180deg, var(--brand-primary) 0%, rgba(5, 150, 105, 0.1) 100%);
        }

        .timeline-node {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* タイムライン上のドット */
        .timeline-node::before {
            content: "";
            position: absolute;
            left: -2rem;
            top: 1.2rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--brand-primary);
            box-shadow: 0 0 0 3px var(--brand-light);
            z-index: 2;
        }

        /* 時代・世紀見出しセパレーター */
        .century-header {
            position: relative;
            font-size: 1rem;
            font-weight: 700;
            color: var(--brand-primary);
            margin: 1.5rem 0 0.5rem -1.2rem;
            padding: 0.35rem 0.85rem;
            background: var(--brand-light);
            border-left: 3px solid var(--brand-primary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            align-self: flex-start;
        }
        .century-heat-badge {
            background: #FEE2E2;
            color: #DC2626;
            border: 1px solid #FCA5A5;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 800;
        }

        /* 出来事カード */
        .event-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.1rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: var(--shadow-xs);
            transition: all 0.2s ease;
            position: relative;
        }
        .event-card:hover {
            border-color: var(--brand-primary);
            box-shadow: var(--shadow-sm);
            transform: translateX(4px);
        }

        /* 🔥 誤答ヒートマップ用ハイライトカード */
        .event-card.is-mistake {
            border-color: #F87171;
            border-left: 5px solid #EF4444;
            background: linear-gradient(135deg, rgba(254, 242, 242, 0.6) 0%, var(--bg-surface) 100%);
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.08);
        }
        .heat-alert-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: #FEF2F2;
            color: #DC2626;
            border: 1px solid #FECACA;
            border-radius: var(--radius-md);
            padding: 0.25rem 0.6rem;
            font-size: 0.74rem;
            font-weight: 800;
        }

        .event-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .event-year {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--brand-primary);
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }
        .event-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
        }

        /* 🔴 赤シート・🔵 青シート ブラインドマスキングシステム */
        .blind-masked {
            cursor: pointer;
            user-select: none;
            position: relative;
            display: inline-block;
            transition: all 0.2s ease;
        }
        .blind-masked.mask-red:not(.revealed) {
            background: linear-gradient(135deg, #EF4444, #DC2626) !important;
            color: transparent !important;
            border-radius: var(--radius-sm);
            padding: 0.15rem 0.6rem;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3);
        }
        .blind-masked.mask-red:not(.revealed)::after {
            content: "🔴 ??? 年 [タップで表示]";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            white-space: nowrap;
        }
        .blind-masked.mask-blue:not(.revealed) {
            background: linear-gradient(135deg, #3B82F6, #2563EB) !important;
            color: transparent !important;
            border-radius: var(--radius-sm);
            padding: 0.2rem 0.8rem;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
        }
        .blind-masked.mask-blue:not(.revealed)::after {
            content: "🔵 出来事名 [タップで表示]";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 0.76rem;
            font-weight: 800;
            white-space: nowrap;
        }
        .blind-masked.revealed {
            animation: blindPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(16, 185, 129, 0.1) !important;
            border-radius: var(--radius-sm);
            outline: 1.5px dashed #10B981;
        }
        @keyframes blindPop {
            0% { transform: scale(0.95); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        .event-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.4rem;
        }
        .source-link-btn {
            font-size: var(--fs-xs);
            padding: 0.25rem 0.6rem;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            border: 1px solid transparent;
            transition: all 0.15s ease;
        }
        .link-problem {
            background: #EEF2FF;
            color: #4F46E5;
            border-color: #C7D2FE;
        }
        .link-problem:hover { background: #E0E7FF; }
        .link-problem.is-mistake-link {
            background: #FEF2F2;
            color: #DC2626;
            border-color: #FCA5A5;
            font-weight: 700;
        }
        .link-problem.is-mistake-link:hover { background: #FEE2E2; }
        .link-lesson {
            background: #ECFDF5;
            color: #059669;
            border-color: #A7F3D0;
        }
        .link-lesson:hover { background: #D1FAE5; }

        .mnemonic-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: #FEF3C7;
            border: 1px solid #FDE68A;
            border-radius: var(--radius-md);
            padding: 0.3rem 0.65rem;
            font-size: 0.82rem;
            color: #92400E;
            margin-top: 0.2rem;
            font-weight: 600;
        }

        /* 🎯 共通テスト整序特訓モーダル */
        .reorder-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100060;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            animation: fadeIn 0.2s ease;
        }
        .reorder-modal-dialog {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            width: 100%;
            max-width: 760px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 40px -8px rgba(0, 0, 0, 0.35);
        }
        .reorder-modal-header {
            padding: 1rem 1.4rem;
            background: var(--bg-subtle);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reorder-modal-body {
            padding: 1.4rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
        }
        .reorder-card {
            background: var(--bg-surface);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 0.95rem 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
            box-shadow: var(--shadow-xs);
            cursor: grab;
            transition: all 0.15s ease;
            user-select: none;
        }
        .reorder-card:active { cursor: grabbing; }
        .reorder-card.dragging {
            opacity: 0.4;
            border-color: #6366F1;
            background: rgba(99, 102, 241, 0.05);
        }
        .reorder-card.drag-over {
            border-color: #6366F1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }
        .reorder-index-badge {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }
        .reorder-btn-move {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.15s ease;
        }
        .reorder-btn-move:hover:not(:disabled) {
            background: var(--brand-primary);
            color: #fff;
            border-color: var(--brand-primary);
        }
        .reorder-btn-move:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .reorder-result-card {
            background: var(--bg-subtle);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.85rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .reorder-result-card.is-correct-row {
            border-color: #10B981;
            background: rgba(16, 185, 129, 0.05);
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- 🌿 左側共通サイドバー -->
        <div id="flora-sidebar"></div>

        <!-- 💻 右側メインコンテンツ -->
        <main class="app-main">
            <div class="workspace-content-wrap">

                <!-- ページヘッダー -->
                <div class="page-header" style="flex-wrap:wrap; gap:0.8rem; align-items:center; justify-content:space-between;">
                    <div class="page-title-group">
                        <h1 class="page-title" id="page-main-title">🏛️ 歴史 統合年表</h1>
                        <p class="page-subtitle">誤答問題や参考書授業から抽出された出来事が、自動で年代順に整理されるビジュアル年表</p>
                    </div>
                    <div style="display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;">
                        <button type="button" id="btn-start-reorder-quiz" style="background:linear-gradient(135deg, #4F46E5, #7C3AED); color:#fff; border:none; padding:0.55rem 1.15rem; border-radius:var(--radius-lg); font-size:0.88rem; font-weight:800; cursor:pointer; display:inline-flex; align-items:center; gap:0.45rem; box-shadow:0 3px 10px rgba(99, 102, 241, 0.3); transition:all 0.15s ease;" title="共通テスト頻出の年代並べ替え問題を生成して解きます">
                            🎯 共通テスト整序特訓（並べ替え）
                        </button>
                        <div class="page-actions" style="font-size: var(--fs-xs); color: var(--text-secondary);" id="event-total-count">
                            読み込み中...
                        </div>
                    </div>
                </div>

                <!-- 🌍 世界史 / ⛩️ 日本史 切替大型タブ -->
                <div class="history-type-switch">
                    <button type="button" class="history-type-btn active" id="type-btn-world" data-type="world">
                        🌍 世界史 年表
                    </button>
                    <button type="button" class="history-type-btn" id="type-btn-japan" data-type="japan">
                        ⛩️ 日本史 年表
                    </button>
                </div>

                <!-- フィルターバー & 暗記シートコントロール -->
                <div class="filter-card">
                    <div class="filter-row" style="justify-content:space-between; flex-wrap:wrap; gap:0.8rem;">
                        <div style="display:flex; align-items:center; gap:0.6rem; flex:1; min-width:240px;">
                            <span class="filter-label">🔎 検索：</span>
                            <input type="text" class="search-input" id="search-input" placeholder="出来事名・年号・キーワードで検索...">
                        </div>
                        <!-- 🔴 赤シート・暗記モード切替コントロール -->
                        <div style="display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap;">
                            <span class="filter-label">🎴 暗記シート：</span>
                            <div style="display:inline-flex; background:var(--bg-subtle); padding:0.18rem; border-radius:var(--radius-md); border:1px solid var(--border-color);">
                                <button type="button" class="region-tab-btn active" id="btn-mask-none" style="padding:0.25rem 0.6rem; font-size:0.75rem;">通常</button>
                                <button type="button" class="region-tab-btn" id="btn-mask-year" style="padding:0.25rem 0.6rem; font-size:0.75rem; color:#DC2626;" title="年号を隠してタップでめくる暗記トレーニング">🔴 年号赤シート</button>
                                <button type="button" class="region-tab-btn" id="btn-mask-name" style="padding:0.25rem 0.6rem; font-size:0.75rem; color:#2563EB;" title="出来事名を隠して年号から想起するトレーニング">🔵 出来事青シート</button>
                            </div>
                            <button type="button" id="btn-toggle-all-masks" class="region-tab-btn" style="padding:0.25rem 0.65rem; font-size:0.75rem;" title="シートで隠されたカードを一括でめくったり戻したりします">
                                👀 全てめくる
                            </button>
                        </div>
                    </div>

                    <div class="filter-row" id="filter-category-row">
                        <span class="filter-label" id="filter-category-label">🌍 地域：</span>
                        <div id="region-filter-container" style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                            <!-- JSで動的生成 -->
                        </div>
                    </div>

                    <!-- 🔥 誤答ヒートマップ＆特殊フィルター -->
                    <div class="filter-row" style="border-top:1px dashed var(--border-color); padding-top:0.65rem; justify-content:space-between; align-items:center;">
                        <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                            <span class="filter-label">🔥 弱点あぶり出し：</span>
                            <button type="button" class="region-tab-btn" id="filter-mistakes-only" style="color:#DC2626; border-color:#FECACA; background:#FEF2F2;" title="誤答ノートに登録されている問題の出来事だけを抽出">
                                🔥 誤答・要復習のみ (<span id="count-mistake-events">0</span>)
                            </button>
                            <button type="button" class="region-tab-btn" id="filter-mnemonics-only" style="color:#92400E; border-color:#FDE68A; background:#FEF3C7;" title="語呂合わせが登録されている出来事のみを抽出">
                                💡 語呂合わせあり (<span id="count-mnemonic-events">0</span>)
                            </button>
                        </div>
                        <div id="mistake-heatmap-summary" style="font-size:0.76rem; font-weight:700; color:var(--text-secondary);">
                            <!-- JSで最多誤答時代を要約表示 -->
                        </div>
                    </div>
                </div>

                <!-- タイムライン表示領域 -->
                <main id="timeline-main">
                    <div class="timeline-stream" id="timeline-stream">
                        <!-- JSで動的に出来事ノードを挿入 -->
                    </div>
                    <div id="empty-notice" style="display:none; text-align:center; padding: 4rem 1rem; color: var(--text-secondary); font-size: var(--fs-sm);">
                        まだ出来事データがありません。<br>問題を誤答ノートに登録するか、授業モードで学習すると自動でここに年表が作られます！
                    </div>
                </main>

            </div>
        </main>
    </div>

    <!-- 🎯 共通テスト整序特訓（年代順並べ替え）モーダル -->
    <div id="reorder-quiz-modal" class="reorder-modal-overlay">
        <div class="reorder-modal-dialog">
            <div class="reorder-modal-header">
                <div style="display:flex; align-items:center; gap:0.6rem;">
                    <span style="font-size:1.2rem;">🎯</span>
                    <div>
                        <div style="font-weight:800; font-size:1.02rem; color:var(--text-primary);" id="quiz-modal-title">共通テスト整序特訓（年代順並べ替え）</div>
                        <div style="font-size:0.74rem; color:var(--text-secondary);" id="quiz-modal-subtitle">第 1 / 5 問 ｜ 古い順（過去 ➔ 未来）に並べ替えてください</div>
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:0.8rem;">
                    <div style="font-size:0.85rem; font-weight:800; color:#4F46E5; background:#EEF2FF; padding:0.25rem 0.65rem; border-radius:var(--radius-sm);" id="quiz-score-badge">
                        スコア: 0 pt
                    </div>
                    <button type="button" id="btn-close-reorder-quiz" style="background:none; border:none; font-size:1.4rem; color:var(--text-secondary); cursor:pointer; line-height:1;">✕</button>
                </div>
            </div>

            <div class="reorder-modal-body" id="quiz-modal-body">
                <!-- クイズ画面または結果画面を動的生成 -->
            </div>
        </div>
    </div>

    <script src="sidebar.js"></script>

        // 日本史の時代判定ヘルパー
        function getJapanEraCategory(yearSort) {
            if (yearSort <= 1185) return "古代（旧石器〜平安）";
            if (yearSort <= 1573) return "中世（鎌倉・室町）";
            if (yearSort <= 1867) return "近世（安土桃山・江戸）";
            if (yearSort <= 1926) return "近代（幕末〜大正）";
            return "現代（昭和〜令和）";
        }

        // Firebaseデータ収集＆マージ（プリセットフォールバック付き）
        function collectAllEvents() {
            const eventsMap = new Map(); // key: "出来事名_年" -> 統合オブジェクト
            const isWorld = activeHistoryType === "world";

            // 0. プリセット出来事を初期登録
            const presets = isWorld ? PRESET_WORLD_EVENTS : PRESET_JAPAN_EVENTS;
            presets.forEach(ev => {
                const key = `${ev.name}_${ev.year}`;
                eventsMap.set(key, {
                    name: ev.name,
                    year: ev.year,
                    year_sort: ev.year_sort,
                    category: ev.category,
                    mnemonics: ev.mnemonics ? [...ev.mnemonics] : [],
                    note: ev.note || "",
                    sources: [],
                    isMistake: false,
                    mistakeCount: 0,
                    trapNote: ""
                });
            });

            // 1. 誤答問題 (problems) から抽出（ユーザー実データをマージ）
            Object.values(rawProblems).forEach(p => {
                if (!p) return;
                const isMatchSubject = isWorld
                    ? (p.subject === "世界史" || (!p.subject && Array.isArray(p.events)))
                    : (p.subject === "日本史");
                if (!isMatchSubject) return;

                const problemEvents = Array.isArray(p.events) ? p.events : [];
                const isProblemMistake = (p.is_mistake !== false); // 誤答ノート登録問題
                const mistakeReviews = (p.reviewCount || p.attempts || 1);

                problemEvents.forEach(ev => {
                    if (!ev || !ev.name) return;
                    const yearSort = typeof ev.year_sort === "number" ? ev.year_sort : (parseInt(ev.year) || 9999);
                    const category = isWorld 
                        ? (ev.region || "地域をまたぐ／世界全体")
                        : (ev.era || getJapanEraCategory(yearSort));

                    const key = `${ev.name}_${ev.year || ""}`;
                    if (!eventsMap.has(key)) {
                        eventsMap.set(key, {
                            name: ev.name,
                            year: ev.year || "年代未詳",
                            year_sort: yearSort,
                            category: category,
                            mnemonics: [],
                            sources: [],
                            isMistake: false,
                            mistakeCount: 0,
                            trapNote: ""
                        });
                    }
                    const item = eventsMap.get(key);
                    if (p.mnemonic && !item.mnemonics.includes(p.mnemonic)) {
                        item.mnemonics.push(p.mnemonic);
                    }
                    if (isProblemMistake) {
                        item.isMistake = true;
                        item.mistakeCount += mistakeReviews;
                        if (p.trap_description && !item.trapNote) {
                            item.trapNote = p.trap_description;
                        }
                    }
                    item.sources.push({
                        type: "problem",
                        id: p.id,
                        title: p.short_title || "誤答問題",
                        isMistake: isProblemMistake
                    });
                });
            });

            // 2. 参考書授業 (lessons) から抽出
            Object.values(rawLessons).forEach(l => {
                if (!l || !Array.isArray(l.historicalEvents)) return;
                const isMatchSubject = isWorld
                    ? (l.subject === "世界史" || (!l.subject && l.historicalEvents.length > 0))
                    : (l.subject === "日本史");
                if (!isMatchSubject) return;

                l.historicalEvents.forEach(ev => {
                    if (!ev || !ev.name) return;
                    const yearSort = typeof ev.year_sort === "number" ? ev.year_sort : (parseInt(ev.year) || 9999);
                    const category = isWorld 
                        ? (ev.region || "地域をまたぐ／世界全体")
                        : (ev.era || getJapanEraCategory(yearSort));

                    const key = `${ev.name}_${ev.year || ""}`;
                    if (!eventsMap.has(key)) {
                        eventsMap.set(key, {
                            name: ev.name,
                            year: ev.year || "年代未詳",
                            year_sort: yearSort,
                            category: category,
                            mnemonics: [],
                            sources: [],
                            isMistake: false,
                            mistakeCount: 0,
                            trapNote: ""
                        });
                    }
                    const item = eventsMap.get(key);
                    item.sources.push({
                        type: "lesson",
                        id: l.id,
                        title: l.title || "授業"
                    });
                });
            });

            // 配列化して年代順（year_sort 昇順）にソート
            return Array.from(eventsMap.values()).sort((a, b) => a.year_sort - b.year_sort);
        }

        // 世紀・時代のラベル生成ヘルパー
        function formatCentury(yearSort) {
            if (yearSort === 9999) return "年代未詳・その他";
            if (activeHistoryType === "japan") {
                const era = getJapanEraCategory(yearSort);
                if (yearSort > 0) return `${era} (${yearSort}年頃)`;
                return `${era} (紀元前)`;
            }
            if (yearSort < 0) {
                const c = Math.ceil(Math.abs(yearSort) / 100);
                return `紀元前 ${c} 世紀`;
            } else if (yearSort === 0) {
                return "1 世紀（紀元前後）";
            } else {
                const c = Math.ceil(yearSort / 100);
                return `${c} 世紀`;
            }
        }

            const countMnemonicEl = document.getElementById("count-mnemonic-events");
            const summaryHeatEl = document.getElementById("mistake-heatmap-summary");

            const allEvents = collectAllEvents();

            // 統計カウント
            const mistakeTotal = allEvents.filter(ev => ev.isMistake).length;
            const mnemonicTotal = allEvents.filter(ev => ev.mnemonics.length > 0).length;
            if (countMistakeEl) countMistakeEl.textContent = mistakeTotal;
            if (countMnemonicEl) countMnemonicEl.textContent = mnemonicTotal;

            // 最多誤答の時代・世紀を計算（ヒートマップ要約）
            const centuryMistakeMap = {};
            allEvents.forEach(ev => {
                if (ev.isMistake) {
                    const c = formatCentury(ev.year_sort);
                    centuryMistakeMap[c] = (centuryMistakeMap[c] || 0) + 1;
                }
            });
            const topCentury = Object.entries(centuryMistakeMap).sort((a, b) => b[1] - a[1])[0];
            if (summaryHeatEl) {
                if (topCentury && topCentury[1] > 0) {
                    summaryHeatEl.innerHTML = `<span style="color:#DC2626;">🔥 最多弱点時代:</span> <strong>${escapeHtml(topCentury[0])}</strong> (${topCentury[1]}問誤答)`;
                } else {
                    summaryHeatEl.innerHTML = `<span style="color:#059669;">✨ 弱点集中時代: なし（順調です！）</span>`;
                }
            }

            // 絞り込み
            const filtered = allEvents.filter(ev => {
                if (currentCategoryFilter !== "ALL" && ev.category !== currentCategoryFilter) return false;
                if (filterMistakesOnly && !ev.isMistake) return false;
                if (filterMnemonicsOnly && ev.mnemonics.length === 0) return false;
                if (currentSearchQuery) {
                    const haystack = `${ev.name} ${ev.year} ${ev.category} ${ev.mnemonics.join(" ")} ${ev.note || ""}`.toLowerCase();
                    if (!haystack.includes(currentSearchQuery)) return false;
                }
                return true;
            });

            totalCountEl.textContent = `収録出来事: ${filtered.length} 件`;

            if (filtered.length === 0) {
                streamEl.innerHTML = "";
                emptyEl.style.display = "block";
                emptyEl.innerHTML = `該当する条件の出来事が見つかりませんでした。<br>フィルターを解除するか検索ワードを変更してください。`;
                return;
            }

            emptyEl.style.display = "none";

            let currentCenturyLabel = null;
            let html = "";

            filtered.forEach(ev => {
                const centuryLabel = formatCentury(ev.year_sort);
                if (centuryLabel !== currentCenturyLabel) {
                    currentCenturyLabel = centuryLabel;
                    const cMistakes = centuryMistakeMap[centuryLabel] || 0;
                    const heatBadgeHtml = cMistakes > 0 
                        ? `<span class="century-heat-badge">🔥 弱点誤答: ${cMistakes}件</span>` 
                        : "";
                    html += `
                        <div class="century-header">
                            <span>⏳ ${escapeHtml(centuryLabel)}</span>
                            ${heatBadgeHtml}
                        </div>
                    `;
                }

                const sourcesHtml = ev.sources.map(s => {
                    if (s.type === "problem") {
                        const mistakeCls = s.isMistake ? "is-mistake-link" : "";
                        const icon = s.isMistake ? "🔥" : "📌";
                        return `<a href="problem.html?id=${encodeURIComponent(s.id)}" class="source-link-btn link-problem ${mistakeCls}">${icon} 誤答問題: ${escapeHtml(s.title)}</a>`;
                    } else {
                        return `<a href="lesson.html?id=${encodeURIComponent(s.id)}" class="source-link-btn link-lesson">📖 授業: ${escapeHtml(s.title)}</a>`;
                    }
                }).join("");

                const mnemonicHtml = ev.mnemonics.length > 0
                    ? `<div class="mnemonic-badge">🎴 語呂: ${escapeHtml(ev.mnemonics[0])}</div>`
                    : "";

                const noteHtml = ev.note 
                    ? `<div style="font-size:0.78rem; color:var(--text-secondary); margin-top:0.2rem; line-height:1.45;">💡 ${escapeHtml(ev.note)}</div>` 
                    : "";

                const trapAlertHtml = (ev.isMistake && ev.trapNote)
                    ? `<div style="font-size:0.76rem; color:#B91C1C; background:rgba(239,68,68,0.08); border-left:3px solid #EF4444; padding:0.35rem 0.65rem; border-radius:4px; margin-top:0.3rem;">⚠️ <strong>落とし穴の急所:</strong> ${escapeHtml(ev.trapNote)}</div>`
                    : "";

                const cardMistakeCls = ev.isMistake ? "is-mistake" : "";
                const heatPillHtml = ev.isMistake 
                    ? `<span class="heat-alert-pill">🔥 要復習 (${ev.mistakeCount}回)</span>`
                    : "";

                // 赤シート・青シート用のマスキングクラス判定
                const evKey = `${ev.name}_${ev.year}`;
                const isManuallyRevealed = isAllRevealed || manuallyRevealedKeys.has(evKey);

                let yearClass = "event-year";
                let nameClass = "event-name";

                if (blindMaskMode === "year") {
                    yearClass += ` blind-masked mask-red ${isManuallyRevealed ? 'revealed' : ''}`;
                } else if (blindMaskMode === "name") {
                    nameClass += ` blind-masked mask-blue ${isManuallyRevealed ? 'revealed' : ''}`;
                }

                html += `
                    <div class="timeline-node">
                        <div class="event-card ${cardMistakeCls}" data-event-key="${escapeHtml(evKey)}">
                            <div class="event-top">
                                <span class="${yearClass}" onclick="toggleEventBlindMask(event, '${escapeHtml(evKey)}', 'year')">
                                    ${escapeHtml(ev.year)}
                                </span>
                                <div style="display:flex; align-items:center; gap:0.4rem;">
                                    ${heatPillHtml}
                                    <span class="badge badge-history" style="font-size:0.7rem;">${escapeHtml(ev.category)}</span>
                                </div>
                            </div>
                            <div class="${nameClass}" onclick="toggleEventBlindMask(event, '${escapeHtml(evKey)}', 'name')">
                                ${escapeHtml(ev.name)}
                            </div>
                            ${noteHtml}
                            ${trapAlertHtml}
                            ${mnemonicHtml}
                            <div class="event-links">
                                ${sourcesHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            streamEl.innerHTML = html;
        }

        // 個別カードのマスキングめくりトグル
        window.toggleEventBlindMask = function(e, key, targetType) {
            if (blindMaskMode === "none") return;
            e.stopPropagation();
            if (manuallyRevealedKeys.has(key)) {
                manuallyRevealedKeys.delete(key);
            } else {
                manuallyRevealedKeys.add(key);
            }
            renderTimeline();
        };

        // ==========================================================
        // 🎯 共通テスト整序特訓（年代順並べ替え）ゲームエンジン
        // ==========================================================
        let quizEventsPool = [];
        let currentQuizIndex = 0;
        let quizTotalQuestions = 5;
        let quizCurrentItems = [];
        let quizScore = 0;
        let quizAnswered = false;

        const modalQuiz = document.getElementById("reorder-quiz-modal");
        const btnStartQuiz = document.getElementById("btn-start-reorder-quiz");
        const btnCloseQuiz = document.getElementById("btn-close-reorder-quiz");
        const quizModalBody = document.getElementById("quiz-modal-body");
        const quizScoreBadge = document.getElementById("quiz-score-badge");
        const quizSubTitle = document.getElementById("quiz-modal-subtitle");

        if (btnStartQuiz) {
            btnStartQuiz.onclick = () => startReorderQuiz();
        }
        if (btnCloseQuiz) {
            btnCloseQuiz.onclick = () => {
                modalQuiz.style.display = "none";
            };
        }

        function startReorderQuiz() {
            const all = collectAllEvents();
            // 重複年代や年代未詳を除外
            const valid = all.filter(ev => ev.year_sort !== 9999);
            if (valid.length < 3) {
                alert("並べ替え問題を作成するには出来事が3つ以上必要です。");
                return;
            }

            quizEventsPool = valid;
            currentQuizIndex = 0;
            quizScore = 0;
            quizTotalQuestions = Math.min(5, Math.floor(valid.length / 3) * 2);
            if (quizTotalQuestions < 3) quizTotalQuestions = 3;

            modalQuiz.style.display = "flex";
            renderNextQuizQuestion();
        }

        function renderNextQuizQuestion() {
            quizAnswered = false;
            if (currentQuizIndex >= quizTotalQuestions) {
                renderQuizFinalResult();
                return;
            }

            if (quizScoreBadge) quizScoreBadge.textContent = `スコア: ${quizScore} pt`;
            if (quizSubTitle) {
                quizSubTitle.textContent = `第 ${currentQuizIndex + 1} / ${quizTotalQuestions} 問 ｜ 過去から未来へ年代順に並べ替えてください`;
            }

            // ランダムに3〜4つの年代が異なる出来事を抽出
            const count = 3; // 共通テストの基本は3要素並べ替え (Ⅰ, Ⅱ, Ⅲ)
            const shuffledPool = [...quizEventsPool].sort(() => Math.random() - 0.5);
            const picked = [];
            const usedYears = new Set();

            for (const ev of shuffledPool) {
                if (!usedYears.has(ev.year_sort)) {
                    picked.push(ev);
                    usedYears.add(ev.year_sort);
                    if (picked.length >= count) break;
                }
            }

            // 正解の並び順（year_sort 昇順）
            const correctOrder = [...picked].sort((a, b) => a.year_sort - b.year_sort);

            // ユーザー回答用にシャッフル（絶対に最初から正解順になっていないようにする）
            let userOrder = [...picked].sort(() => Math.random() - 0.5);
            let attempts = 0;
            while (userOrder.every((item, i) => item.year_sort === correctOrder[i].year_sort) && attempts < 10) {
                userOrder.sort(() => Math.random() - 0.5);
                attempts++;
            }

            quizCurrentItems = {
                userOrder: userOrder,
                correctOrder: correctOrder
            };

            renderQuizCardList();
        }

        function renderQuizCardList() {
            const romanLabels = ["Ⅰ", "Ⅱ", "Ⅲ", "Ⅳ"];
            const listHtml = quizCurrentItems.userOrder.map((item, idx) => `
                <div class="reorder-card" draggable="true" data-index="${idx}">
                    <div class="reorder-index-badge">${romanLabels[idx]}</div>
                    <div style="flex:1; min-width:0;">
                        <div style="font-weight:800; font-size:1.02rem; color:var(--text-primary); margin-bottom:0.25rem;">
                            ${escapeHtml(item.name)}
                        </div>
                        <div style="font-size:0.75rem; color:var(--text-secondary); display:flex; gap:0.5rem; flex-wrap:wrap;">
                            <span class="badge" style="background:var(--bg-subtle); border:1px solid var(--border-color); font-size:0.7rem;">📍 ${escapeHtml(item.category)}</span>
                            ${item.note ? `<span>💡 ${escapeHtml(item.note)}</span>` : ''}
                        </div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:0.25rem;">
                        <button type="button" class="reorder-btn-move" onclick="moveQuizCard(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} title="上へ移動">▲</button>
                        <button type="button" class="reorder-btn-move" onclick="moveQuizCard(${idx}, 1)" ${idx === quizCurrentItems.userOrder.length - 1 ? 'disabled' : ''} title="下へ移動">▼</button>
                    </div>
                </div>
            `).join("");

            quizModalBody.innerHTML = `
                <div style="background:rgba(99, 102, 241, 0.08); border:1px solid rgba(99, 102, 241, 0.25); border-radius:var(--radius-md); padding:0.75rem 1rem; font-size:0.84rem; color:var(--text-primary); line-height:1.5;">
                    💡 <strong>共通テスト形式:</strong> 下の3つの出来事カードをドラッグ、または右側の「▲」「▼」ボタンで入れ替えて、<strong>古い年代順（上 ➔ 下）</strong>に並べて「決定・判定する」を押してください。
                </div>

                <div id="quiz-cards-container" style="display:flex; flex-direction:column; gap:0.65rem;">
                    ${listHtml}
                </div>

                <div style="display:flex; justify-content:flex-end; gap:0.8rem; margin-top:0.6rem;">
                    <button type="button" class="flora-btn flora-btn-secondary" onclick="document.getElementById('reorder-quiz-modal').style.display='none'">
                        中断して年表に戻る
                    </button>
                    <button type="button" class="flora-btn flora-btn-primary" id="btn-submit-reorder" onclick="submitReorderAnswer()" style="padding:0.65rem 1.6rem; font-size:0.95rem; font-weight:800; background:linear-gradient(135deg, #10B981, #059669); color:#fff; border:none; border-radius:var(--radius-md); cursor:pointer; box-shadow:0 3px 10px rgba(16,185,129,0.3);">
                        ✅ この順序で決定・判定する
                    </button>
                </div>
            `;

            setupQuizDragAndDrop();
        }

        window.moveQuizCard = function(fromIndex, delta) {
            if (quizAnswered) return;
            const toIndex = fromIndex + delta;
            if (toIndex < 0 || toIndex >= quizCurrentItems.userOrder.length) return;

            const temp = quizCurrentItems.userOrder[fromIndex];
            quizCurrentItems.userOrder[fromIndex] = quizCurrentItems.userOrder[toIndex];
            quizCurrentItems.userOrder[toIndex] = temp;
            renderQuizCardList();
        };

        function setupQuizDragAndDrop() {
            const container = document.getElementById("quiz-cards-container");
            if (!container) return;

            let dragSrcEl = null;

            container.querySelectorAll(".reorder-card").forEach(card => {
                card.addEventListener("dragstart", (e) => {
                    dragSrcEl = card;
                    card.classList.add("dragging");
                    e.dataTransfer.effectAllowed = "move";
                    e.dataTransfer.setData("text/plain", card.getAttribute("data-index"));
                });

                card.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = "move";
                    card.classList.add("drag-over");
                });

                card.addEventListener("dragleave", () => {
                    card.classList.remove("drag-over");
                });

                card.addEventListener("dragend", () => {
                    card.classList.remove("dragging");
                    container.querySelectorAll(".reorder-card").forEach(c => c.classList.remove("drag-over"));
                });

                card.addEventListener("drop", (e) => {
                    e.preventDefault();
                    card.classList.remove("drag-over");
                    if (dragSrcEl && dragSrcEl !== card) {
                        const fromIdx = parseInt(dragSrcEl.getAttribute("data-index"), 10);
                        const toIdx = parseInt(card.getAttribute("data-index"), 10);

                        const moved = quizCurrentItems.userOrder.splice(fromIdx, 1)[0];
                        quizCurrentItems.userOrder.splice(toIdx, 0, moved);
                        renderQuizCardList();
                    }
                });
            });
        }

        window.submitReorderAnswer = function() {
            if (quizAnswered) return;
            quizAnswered = true;

            const isCorrect = quizCurrentItems.userOrder.every((item, i) => item.year_sort === quizCurrentItems.correctOrder[i].year_sort);

            if (isCorrect) {
                quizScore += 100;
            }

            const romanLabels = ["Ⅰ", "Ⅱ", "Ⅲ", "Ⅳ"];

            const resultHtml = `
                <div style="text-align:center; padding:1.2rem; border-radius:var(--radius-lg); background:${isCorrect ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)'}; border:2px solid ${isCorrect ? '#10B981' : '#EF4444'};">
                    <div style="font-size:2.2rem; line-height:1; margin-bottom:0.4rem;">${isCorrect ? '🎉' : '❌'}</div>
                    <div style="font-size:1.25rem; font-weight:800; color:${isCorrect ? '#059669' : '#DC2626'};">
                        ${isCorrect ? '正解！完璧な時系列把握です！ (+100pt)' : '惜しい！正解の時系列はこちら'}
                    </div>
                </div>

                <div style="margin-top:0.4rem;">
                    <div style="font-size:0.85rem; font-weight:800; color:var(--text-secondary); margin-bottom:0.6rem;">
                        ⏳ 正しい年代順タイムラインと因果関係：
                    </div>
                    <div style="display:flex; flex-direction:column; gap:0.6rem;">
                        ${quizCurrentItems.correctOrder.map((ev, i) => `
                            <div class="reorder-result-card is-correct-row">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <div style="display:flex; align-items:center; gap:0.5rem;">
                                        <span style="font-weight:800; font-size:0.95rem; color:#059669;">${romanLabels[i]}</span>
                                        <span style="font-weight:800; font-size:1.02rem; color:var(--text-primary);">${escapeHtml(ev.name)}</span>
                                    </div>
                                    <span style="font-family:var(--font-heading); font-size:1.05rem; font-weight:800; color:#059669;">
                                        ${escapeHtml(ev.year)}
                                    </span>
                                </div>
                                ${ev.mnemonics && ev.mnemonics.length > 0 ? `
                                    <div style="font-size:0.78rem; color:#92400E; background:#FEF3C7; padding:0.2rem 0.5rem; border-radius:4px; align-self:flex-start; margin-top:0.2rem;">
                                        🎴 語呂合わせ: ${escapeHtml(ev.mnemonics[0])}
                                    </div>
                                ` : ''}
                                ${ev.note ? `
                                    <div style="font-size:0.8rem; color:var(--text-secondary); margin-top:0.15rem;">
                                        💡 ${escapeHtml(ev.note)}
                                    </div>
                                ` : ''}
                            </div>
                        `).join("")}
                    </div>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:0.8rem; margin-top:1rem;">
                    <button type="button" class="flora-btn flora-btn-primary" onclick="proceedNextQuizQuestion()" style="padding:0.65rem 1.6rem; font-size:0.95rem; font-weight:800; background:linear-gradient(135deg, #4F46E5, #7C3AED); color:#fff; border:none; border-radius:var(--radius-md); cursor:pointer;">
                        ${currentQuizIndex + 1 < quizTotalQuestions ? '次の問題へ ➔' : '結果発表を見る ➔'}
                    </button>
                </div>
            `;

            quizModalBody.innerHTML = resultHtml;
        };

        window.proceedNextQuizQuestion = function() {
            currentQuizIndex++;
            renderNextQuizQuestion();
        };

        function renderQuizFinalResult() {
            const maxScore = quizTotalQuestions * 100;
            const rate = Math.round((quizScore / maxScore) * 100);
            let rankText = "歴史ビギナー";
            if (rate === 100) rankText = "👑 共通テスト整序マスター！神レベル！";
            else if (rate >= 80) rankText = "🎖️ 上級歴史ストラテジスト！";
            else if (rate >= 60) rankText = "✨ 基礎時系列はバッチリ！";

            quizModalBody.innerHTML = `
                <div style="text-align:center; padding:2rem 1rem;">
                    <div style="font-size:3.5rem; line-height:1; margin-bottom:0.6rem;">🏆</div>
                    <div style="font-size:1.6rem; font-weight:800; color:var(--text-primary); margin-bottom:0.3rem;">
                        整序特訓チャレンジ完了！
                    </div>
                    <div style="font-size:1rem; color:#4F46E5; font-weight:700; margin-bottom:1.2rem;">
                        ${rankText}
                    </div>
                    <div style="font-size:2.2rem; font-family:var(--font-heading); font-weight:800; color:#059669; margin-bottom:1.5rem;">
                        ${quizScore} / ${maxScore} pt <span style="font-size:1.1rem; color:var(--text-secondary);">(正答率 ${rate}%)</span>
                    </div>

                    <div style="display:flex; justify-content:center; gap:0.9rem; flex-wrap:wrap;">
                        <button type="button" class="flora-btn flora-btn-secondary" onclick="document.getElementById('reorder-quiz-modal').style.display='none'">
                            年表へ戻る
                        </button>
                        <button type="button" class="flora-btn flora-btn-primary" onclick="startReorderQuiz()" style="background:linear-gradient(135deg, #4F46E5, #7C3AED); color:#fff; border:none; padding:0.65rem 1.6rem; font-weight:800; border-radius:var(--radius-md); cursor:pointer;">
                            🔄 もう一度特訓する
                        </button>
                    </div>
                </div>
            `;
        }

        rebuildCategoryFilters();

        // テスターログイン
        window.floraTestLogin = async function() {
            try {
                await signInWithEmailAndPassword(auth, "tester@flora.local", "flora1234");
            } catch(e) {}
        };

        if (new URLSearchParams(window.location.search).has("autologin") || new URLSearchParams(window.location.search).has("test")) {
            setTimeout(() => {
                if (!auth.currentUser) window.floraTestLogin();
            }, 500);
        }

        // Firebase 認証＆データ監視
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // 未ログイン時の自動テスターログイン待機
                return;
            }

            // 問題データの監視
            onValue(ref(database, 'users/' + user.uid + '/problems'), (snapshot) => {
                rawProblems = snapshot.val() || {};
                renderTimeline();
            });

            // 授業データの監視
            onValue(ref(database, 'users/' + user.uid + '/lessons'), (snapshot) => {
                rawLessons = snapshot.val() || {};
                renderTimeline();
            });
        });
    </script>
</body>
</html>
