<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.png">
    <link rel="apple-touch-icon" href="icons/icon.png">
    <title>Flora | 世界史 統合年表</title>
    <link rel="stylesheet" href="style.css?v=3.4">

    <style>
        /* フィルター領域 */
        .filter-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.2rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: var(--shadow-xs);
            margin-bottom: 1.5rem;
        }
        .filter-row { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
        .filter-label { font-size: 0.76rem; font-weight: 700; color: var(--text-secondary); }

        .region-tab-btn {
            background: var(--bg-subtle);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: var(--fs-xs);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .region-tab-btn:hover { border-color: #94A3B8; color: var(--text-primary); }
        .region-tab-btn.active {
            background: var(--brand-primary) !important;
            color: #fff !important;
            border-color: var(--brand-primary) !important;
        }

        .search-input {
            flex-grow: 1; background: var(--bg-subtle);
            border: 1px solid var(--border-color); color: var(--text-primary);
            padding: 0.55rem 0.9rem; border-radius: var(--radius-md); font-size: var(--fs-sm);
        }
        .search-input:focus { outline: none; border-color: var(--brand-primary); }

        /* タイムライン本体 */
        .timeline-stream {
            position: relative;
            margin-top: 1rem;
            padding-left: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* 縦のタイムライン軸 */
        .timeline-stream::before {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 11px;
            width: 2px;
            background: linear-gradient(180deg, var(--brand-primary) 0%, rgba(5, 150, 105, 0.1) 100%);
        }

        .timeline-node {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* タイムライン上のドット */
        .timeline-node::before {
            content: "";
            position: absolute;
            left: -2rem;
            top: 1.2rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--brand-primary);
            box-shadow: 0 0 0 3px var(--brand-light);
            z-index: 2;
        }

        /* 時代・世紀見出しセパレーター */
        .century-header {
            position: relative;
            font-size: 1rem;
            font-weight: 700;
            color: var(--brand-primary);
            margin: 1.5rem 0 0.5rem -1.2rem;
            padding: 0.35rem 0.85rem;
            background: var(--brand-light);
            border-left: 3px solid var(--brand-primary);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            display: inline-block;
            align-self: flex-start;
        }

        /* 出来事カード */
        .event-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.1rem 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            box-shadow: var(--shadow-xs);
            transition: all 0.15s ease;
        }
        .event-card:hover {
            border-color: var(--brand-border);
            transform: translateX(4px);
            box-shadow: var(--shadow-sm);
        }

        .event-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .event-year {
            font-family: var(--font-mono);
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--brand-primary);
            letter-spacing: -0.5px;
        }

        .event-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .event-links {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
            padding-top: 0.5rem;
            border-top: 1px dashed var(--border-subtle);
        }

        .source-link-btn {
            font-size: var(--fs-xs);
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: var(--radius-sm);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            transition: all 0.15s ease;
        }
        .link-problem {
            background: var(--brand-light);
            border: 1px solid var(--brand-border);
            color: var(--brand-primary);
        }
        .link-problem:hover { background: #D1FAE5; }
        .link-lesson {
            background: #FDF2F8;
            border: 1px solid #FBCFE8;
            color: #DB2777;
        }
        .link-lesson:hover { background: #FCE7F3; }

        .mnemonic-badge {
            background: #FFFBEB;
            border: 1px dashed #FDE68A;
            border-radius: var(--radius-sm);
            padding: 0.4rem 0.7rem;
            font-size: 0.82rem;
            color: #92400E;
            margin-top: 0.2rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- 🌿 左側共通サイドバー -->
        <div id="flora-sidebar"></div>

        <!-- 💻 右側メインコンテンツ -->
        <main class="app-main">
            <div class="workspace-content-wrap">

                <!-- ページヘッダー -->
                <div class="page-header">
                    <div class="page-title-group">
                        <h1 class="page-title">🌍 世界史 統合年表</h1>
                        <p class="page-subtitle">誤答問題や参考書授業から抽出された出来事が、自動で年代順に整理されるビジュアル年表</p>
                    </div>
                    <div class="page-actions" style="font-size: var(--fs-xs); color: var(--text-secondary);" id="event-total-count">
                        読み込み中...
                    </div>
                </div>

                <!-- フィルターバー -->
                <div class="filter-card">
                    <div class="filter-row">
                        <span class="filter-label">🔎 検索：</span>
                        <input type="text" class="search-input" id="search-input" placeholder="出来事名・年号・キーワードで検索...">
                    </div>
                    <div class="filter-row">
                        <span class="filter-label">🌍 地域：</span>
                        <div id="region-filter-container" style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
                            <!-- JSで動的生成 -->
                        </div>
                    </div>
                </div>

                <!-- タイムライン表示領域 -->
                <main id="timeline-main">
                    <div class="timeline-stream" id="timeline-stream">
                        <!-- JSで動的に出来事ノードを挿入 -->
                    </div>
                    <div id="empty-notice" style="display:none; text-align:center; padding: 4rem 1rem; color: var(--text-secondary); font-size: var(--fs-sm);">
                        まだ世界史の出来事データがありません。<br>世界史の問題を誤答ノートに登録するか、授業モードで学習すると自動でここに年表が作られます！
                    </div>
                </main>

            </div>
        </main>
    </div>

    <script src="global-timer-sync.js"></script>
    <script src="sidebar.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55MdhpjJizQaLEdRu-XhBVJ4PqrHsAyY",
            authDomain: "buturi-2449e.firebaseapp.com",
            databaseURL: "https://buturi-2449e-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "buturi-2449e",
            storageBucket: "buturi-2449e.appspot.com",
            messagingSenderId: "976306696124",
            appId: "1:976306696124:web:e455c1953544bff5c345b9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        const REGIONS = [
            "ALL",
            "東アジア",
            "東南アジア",
            "南アジア",
            "西アジア・中央アジア",
            "ヨーロッパ",
            "アメリカ大陸",
            "アフリカ",
            "地域をまたぐ／世界全体"
        ];

        let currentRegionFilter = "ALL";
        let currentSearchQuery = "";
        let rawProblems = {};
        let rawLessons = {};

        // 地域フィルターボタンの生成
        const regionContainer = document.getElementById("region-filter-container");
        regionContainer.innerHTML = REGIONS.map(r => `
            <button type="button" class="region-tab-btn ${r === 'ALL' ? 'active' : ''}" data-region="${r}">
                ${r === 'ALL' ? '✨ すべて' : r}
            </button>
        `).join("");

        regionContainer.querySelectorAll(".region-tab-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                regionContainer.querySelectorAll(".region-tab-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentRegionFilter = btn.getAttribute("data-region");
                renderTimeline();
            });
        });

        // 検索入力リスナー
        const searchInput = document.getElementById("search-input");
        searchInput.addEventListener("input", (e) => {
            currentSearchQuery = e.target.value.trim().toLowerCase();
            renderTimeline();
        });

        // Firebaseデータ収集＆マージ
        function collectAllEvents() {
            const eventsMap = new Map(); // key: "出来事名_年" -> 統合オブジェクト

            // 1. 誤答問題 (problems) から抽出
            Object.values(rawProblems).forEach(p => {
                if (!p || (!Array.isArray(p.events) && p.subject !== "世界史")) return;
                const problemEvents = Array.isArray(p.events) ? p.events : [];
                problemEvents.forEach(ev => {
                    if (!ev || !ev.name) return;
                    const key = `${ev.name}_${ev.year || ""}`;
                    if (!eventsMap.has(key)) {
                        eventsMap.set(key, {
                            name: ev.name,
                            year: ev.year || "年代未詳",
                            year_sort: typeof ev.year_sort === "number" ? ev.year_sort : 9999,
                            region: ev.region || "地域をまたぐ／世界全体",
                            mnemonics: p.mnemonic ? [p.mnemonic] : [],
                            sources: []
                        });
                    }
                    const item = eventsMap.get(key);
                    item.sources.push({
                        type: "problem",
                        id: p.id,
                        title: p.short_title || "誤答問題"
                    });
                });
            });

            // 2. 参考書授業 (lessons) から抽出
            Object.values(rawLessons).forEach(l => {
                if (!l || !Array.isArray(l.historicalEvents)) return;
                l.historicalEvents.forEach(ev => {
                    if (!ev || !ev.name) return;
                    const key = `${ev.name}_${ev.year || ""}`;
                    if (!eventsMap.has(key)) {
                        eventsMap.set(key, {
                            name: ev.name,
                            year: ev.year || "年代未詳",
                            year_sort: typeof ev.year_sort === "number" ? ev.year_sort : 9999,
                            region: ev.region || "地域をまたぐ／世界全体",
                            mnemonics: [],
                            sources: []
                        });
                    }
                    const item = eventsMap.get(key);
                    item.sources.push({
                        type: "lesson",
                        id: l.id,
                        title: l.title || "授業"
                    });
                });
            });

            // 配列化して年代順（year_sort 昇順）にソート
            return Array.from(eventsMap.values()).sort((a, b) => a.year_sort - b.year_sort);
        }

        // 世紀のラベル生成ヘルパー（例: -221 -> 前3世紀, 1789 -> 18世紀）
        function formatCentury(yearSort) {
            if (yearSort === 9999) return "年代未詳・その他";
            if (yearSort < 0) {
                const c = Math.ceil(Math.abs(yearSort) / 100);
                return `紀元前 ${c} 世紀`;
            } else if (yearSort === 0) {
                return "1 世紀（紀元前後）";
            } else {
                const c = Math.ceil(yearSort / 100);
                return `${c} 世紀`;
            }
        }

        function renderTimeline() {
            const streamEl = document.getElementById("timeline-stream");
            const emptyEl = document.getElementById("empty-notice");
            const totalCountEl = document.getElementById("event-total-count");

            const allEvents = collectAllEvents();

            // 絞り込み
            const filtered = allEvents.filter(ev => {
                if (currentRegionFilter !== "ALL" && ev.region !== currentRegionFilter) return false;
                if (currentSearchQuery) {
                    const haystack = `${ev.name} ${ev.year} ${ev.region} ${ev.mnemonics.join(" ")}`.toLowerCase();
                    if (!haystack.includes(currentSearchQuery)) return false;
                }
                return true;
            });

            totalCountEl.textContent = `収録出来事: ${filtered.length} 件`;

            if (filtered.length === 0) {
                streamEl.innerHTML = "";
                emptyEl.style.display = "block";
                return;
            }

            emptyEl.style.display = "none";

            let currentCenturyLabel = null;
            let html = "";

            filtered.forEach(ev => {
                const centuryLabel = formatCentury(ev.year_sort);
                if (centuryLabel !== currentCenturyLabel) {
                    currentCenturyLabel = centuryLabel;
                    html += `<div class="century-header">⏳ ${centuryLabel}</div>`;
                }

                const sourcesHtml = ev.sources.map(s => {
                    if (s.type === "problem") {
                        return `<a href="problem.html?id=${encodeURIComponent(s.id)}" class="source-link-btn link-problem">📌 問題: ${s.title}</a>`;
                    } else {
                        return `<a href="lesson.html?id=${encodeURIComponent(s.id)}" class="source-link-btn link-lesson">📖 授業: ${s.title}</a>`;
                    }
                }).join("");

                const mnemonicHtml = ev.mnemonics.length > 0
                    ? `<div class="mnemonic-badge">🎴 語呂合わせ: ${ev.mnemonics[0]}</div>`
                    : "";

                html += `
                    <div class="timeline-node">
                        <div class="event-card">
                            <div class="event-top">
                                <span class="event-year">${ev.year}</span>
                                <span class="badge badge-history" style="font-size:0.7rem;">${ev.region}</span>
                            </div>
                            <div class="event-name">${ev.name}</div>
                            ${mnemonicHtml}
                            <div class="event-links">
                                ${sourcesHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            streamEl.innerHTML = html;
        }

        // Firebase 認証＆データ監視
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                location.href = "index.html";
                return;
            }

            // 問題データの監視
            onValue(ref(database, 'users/' + user.uid + '/problems'), (snapshot) => {
                rawProblems = snapshot.val() || {};
                renderTimeline();
            });

            // 授業データの監視
            onValue(ref(database, 'users/' + user.uid + '/lessons'), (snapshot) => {
                rawLessons = snapshot.val() || {};
                renderTimeline();
            });
        });
    </script>
</body>
</html>
