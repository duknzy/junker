<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <title>Flora | 気づき・暗記ノート</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
    <link rel="stylesheet" href="style-m.css">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                macros: { fbox: ["\\bbox[2px,border:1px solid]{#1}", 1] }
            },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
        .m-tab-nav {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.65rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .m-tab-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-full);
            padding: 0.35rem 0.8rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .m-tab-btn.active {
            background: var(--brand-light);
            border-color: var(--brand-border);
            color: var(--brand-primary);
        }

        .insight-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1rem;
            margin-bottom: 0.75rem;
            box-shadow: var(--shadow-xs);
            transition: all 0.15s;
        }

        .insight-text {
            font-size: var(--fs-base);
            line-height: 1.7;
            color: var(--text-primary);
            font-weight: 500;
            margin: 0.5rem 0;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .insight-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.72rem;
            color: var(--text-muted);
            padding-top: 0.5rem;
            border-top: 1px dashed var(--border-color);
            margin-top: 0.5rem;
        }

        .action-btn-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .icon-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.88rem;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            color: var(--text-secondary);
        }
        .icon-action-btn:active {
            background: var(--bg-subtle);
        }

        .inline-edit-box {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            margin-top: 0.4rem;
        }
        .inline-textarea {
            width: 100%;
            box-sizing: border-box;
            font-size: 0.88rem;
            line-height: 1.6;
            padding: 0.5rem;
            border: 1px solid var(--border-focus);
            border-radius: var(--radius-sm);
            background: var(--bg-subtle);
            color: var(--text-primary);
            min-height: 70px;
            resize: vertical;
        }
        .inline-input {
            width: 100%;
            box-sizing: border-box;
            font-size: 0.82rem;
            padding: 0.4rem 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: var(--bg-subtle);
            color: var(--text-primary);
        }

        /* トースト通知 */
        #m-toast-container {
            position: fixed;
            bottom: calc(var(--bottom-nav-height, 60px) + 16px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            width: 90%;
            max-width: 360px;
        }
        .m-toast {
            background: rgba(15, 23, 42, 0.92);
            color: #fff;
            padding: 0.6rem 1.1rem;
            border-radius: 9999px;
            font-size: 0.82rem;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            animation: mFadeInUp 0.25s ease-out;
            text-align: center;
        }
        @keyframes mFadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* モバイル用フラッシュカードモーダル */
        .m-fc-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75);
            z-index: 100050;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            backdrop-filter: blur(6px);
        }
        .m-fc-content {
            background: var(--bg-surface);
            border-radius: 18px;
            width: 100%;
            max-width: 460px;
            padding: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }
        .m-fc-stage {
            perspective: 1000px;
            min-height: 250px;
            margin: 12px 0;
            cursor: pointer;
        }
        .m-fc-inner {
            position: relative;
            width: 100%;
            min-height: 250px;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .m-fc-stage.flipped .m-fc-inner {
            transform: rotateY(180deg);
        }
        .m-fc-face {
            position: absolute;
            inset: 0;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-subtle);
        }
        .m-fc-back {
            background: rgba(16, 185, 129, 0.06);
            border-color: rgba(16, 185, 129, 0.35);
            transform: rotateY(180deg);
        }
        .m-fc-stage .m-fc-front { pointer-events: auto; }
        .m-fc-stage .m-fc-back { pointer-events: none; }
        .m-fc-stage.flipped .m-fc-front { pointer-events: none; }
        .m-fc-stage.flipped .m-fc-back { pointer-events: auto; }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="m-header">
        <button class="m-header-back" onclick="location.href='index.html'">‹</button>
        <span class="m-header-title">💡 気づき・暗記ノート</span>
    </header>

    <main class="m-content">

        <!-- タブ切り替え -->
        <div class="m-tab-nav">
            <button class="m-tab-btn active" id="tab-btn-insights" onclick="switchTab('insights')">💡 気づき・極意</button>
            <button class="m-tab-btn" id="tab-btn-memorize" onclick="switchTab('memorize')">🧠 暗記事項</button>
            <button class="m-tab-btn" id="tab-btn-lessons" onclick="switchTab('lessons')">📖 授業メモ</button>
        </div>

        <!-- 検索バー -->
        <div class="m-search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="insight-search" placeholder="キーワード・公式を検索...">
        </div>

        <!-- 教科フィルター -->
        <div class="m-filter-chips" id="insight-subject-chips"></div>

        <!-- アクションバー -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin:0.6rem 0 0.4rem 0;">
            <span id="m-insight-count" style="font-size:0.75rem; color:var(--text-secondary); font-weight:700;">--</span>
            <button type="button" id="m-start-flashcard-btn" class="tactile-btn" style="background:linear-gradient(135deg, #10B981, #059669); color:#fff; font-size:0.78rem; font-weight:800; padding:0.35rem 0.85rem; border-radius:9999px; border:none; display:flex; align-items:center; gap:0.3rem; box-shadow:0 2px 6px rgba(16,185,129,0.3); cursor:pointer;">
                🎴 フラッシュカード演習
            </button>
        </div>

        <!-- 一覧 -->
        <div id="insight-list" style="margin-top:0.4rem;"></div>

    </main>

    <!-- 🎴 モバイル用フラッシュカード復習モーダル -->
    <div id="m-flashcard-modal" class="m-fc-modal" style="display:none;">
        <div class="m-fc-content">
            <!-- ヘッダー -->
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding-bottom:0.5rem; margin-bottom:0.6rem;">
                <div style="display:flex; align-items:center; gap:0.4rem;">
                    <span style="background:rgba(16,185,129,0.15); color:#059669; font-size:0.72rem; font-weight:800; padding:0.15rem 0.5rem; border-radius:9999px;">🎴 カード</span>
                    <span id="m-fc-meta-subject" style="font-size:0.8rem; font-weight:800; color:var(--text-primary);">公共</span>
                </div>
                <button type="button" id="m-fc-modal-close" style="background:none; border:none; font-size:1.4rem; color:var(--text-muted); cursor:pointer; line-height:1;">×</button>
            </div>

            <!-- 出題エリア -->
            <div id="m-fc-active-area">
                <!-- プログレス -->
                <div style="display:flex; justify-content:space-between; font-size:0.72rem; font-weight:700; color:var(--text-secondary); margin-bottom:0.25rem;">
                    <span id="m-fc-progress-text">1 / 10</span>
                    <div>
                        <span style="color:#059669;">✅ <span id="m-fc-count-mastered">0</span></span>
                        <span style="color:#D97706; margin-left:0.5rem;">🔄 <span id="m-fc-count-retry">0</span></span>
                    </div>
                </div>
                <div style="width:100%; height:4px; background:var(--bg-subtle); border-radius:9999px; overflow:hidden; margin-bottom:0.6rem;">
                    <div id="m-fc-progress-bar" style="width:0%; height:100%; background:#10B981; transition:width 0.2s;"></div>
                </div>

                <!-- カードステージ -->
                <div class="m-fc-stage" id="m-fc-stage">
                    <div class="m-fc-inner" id="m-fc-inner">
                        <!-- 表面 -->
                        <div class="m-fc-face m-fc-front">
                            <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.72rem;">
                                <span style="font-weight:700; color:var(--brand-primary);" id="m-fc-front-cat">重要事項</span>
                                <span style="color:var(--text-muted);" id="m-fc-front-source">単元</span>
                            </div>
                            <div style="margin:auto 0; text-align:center;">
                                <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.4rem;">Q. 定義・要点を思い出そう</div>
                                <div id="m-fc-front-term" style="font-size:1.15rem; font-weight:800; color:var(--text-primary); line-height:1.4;">--</div>
                            </div>
                            <div style="text-align:center;">
                                <button type="button" class="tactile-btn" id="m-fc-btn-flip" style="font-size:0.75rem; padding:0.35rem 1rem; border-radius:9999px; background:var(--brand-primary); color:#fff; border:none; width:100%;">
                                    答えを見る ▶
                                </button>
                            </div>
                        </div>

                        <!-- 裏面 -->
                        <div class="m-fc-face m-fc-back">
                            <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.72rem;">
                                <div style="display:flex; align-items:center; gap:0.4rem;">
                                    <span style="font-weight:800; color:#059669;">💡 解答・ポイント</span>
                                    <button type="button" id="m-fc-btn-flip-back" style="background:var(--bg-subtle); border:1px solid var(--border-color); color:var(--text-secondary); font-size:0.68rem; font-weight:700; padding:0.15rem 0.45rem; border-radius:4px; cursor:pointer;">◀ 問題</button>
                                </div>
                                <span style="color:var(--text-muted);" id="m-fc-back-source">単元</span>
                            </div>
                            <div style="margin:auto 0; text-align:left; overflow-y:auto; max-height:130px; font-size:0.88rem; line-height:1.5; color:var(--text-primary);" id="m-fc-back-answer">
                                --
                            </div>
                            <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
                                <button type="button" id="m-fc-btn-retry" class="tactile-btn" style="flex:1; background:rgba(217,119,6,0.12); color:#D97706; border:1px solid rgba(217,119,6,0.3); font-weight:800; font-size:0.75rem; padding:0.45rem; border-radius:8px;">
                                    🔄 もう一度
                                </button>
                                <button type="button" id="m-fc-btn-mastered" class="tactile-btn" style="flex:1; background:#059669; color:#fff; border:none; font-weight:800; font-size:0.75rem; padding:0.45rem; border-radius:8px;">
                                    ✅ 覚えた！
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 完了画面 -->
            <div id="m-fc-finish-area" style="display:none; text-align:center; padding:1rem 0;">
                <div style="font-size:2.5rem; margin-bottom:0.4rem;">🎉</div>
                <div style="font-weight:800; font-size:1.1rem; color:var(--text-primary); margin-bottom:0.3rem;">演習完了！</div>
                <div style="font-size:0.78rem; color:var(--text-secondary); margin-bottom:1rem;">全カードの復習が完了しました。</div>
                <div style="display:flex; justify-content:center; gap:0.8rem; margin-bottom:1.2rem;">
                    <div style="background:var(--bg-subtle); padding:0.5rem 1rem; border-radius:10px; border:1px solid var(--border-color);">
                        <div style="font-size:0.68rem; color:var(--text-muted);">習得カード</div>
                        <div style="font-size:1.2rem; font-weight:800; color:#059669;" id="m-fc-stat-total">0</div>
                    </div>
                    <div style="background:var(--bg-subtle); padding:0.5rem 1rem; border-radius:10px; border:1px solid var(--border-color);">
                        <div style="font-size:0.68rem; color:var(--text-muted);">復習回数</div>
                        <div style="font-size:1.2rem; font-weight:800; color:#D97706;" id="m-fc-stat-retries">0</div>
                    </div>
                </div>
                <button type="button" id="m-fc-btn-finish-close" class="tactile-btn" style="background:var(--brand-primary); color:#fff; border:none; padding:0.5rem 1.5rem; border-radius:9999px; font-weight:800; font-size:0.8rem;">
                    完了して閉じる
                </button>
            </div>
        </div>
    </div>

    <div id="m-toast-container"></div>

    <!-- ボトムナビ -->
    <script src="bottom-nav.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55MdhpjJizQaLEdRu-XhBVJ4PqrHsAyY",
            authDomain: "buturi-2449e.firebaseapp.com",
            databaseURL: "https://buturi-2449e-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "buturi-2449e",
            storageBucket: "buturi-2449e.appspot.com",
            messagingSenderId: "976306696124",
            appId: "1:976306696124:web:e455c1953544bff5c345b9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        let currentUser = null;
        let allProblems = {};
        let allLessons = {};
        let currentTab = "insights"; // 'insights' | 'memorize' | 'lessons'
        let currentSubject = "ALL";
        let searchQuery = "";

        // 編集ステート
        let editingProblemId = null;
        let editingMemorizeKey = null; // 'lessonId:mpId'
        let editingLessonMemoKey = null; // 'lessonId:memoId'

        window.showMToast = function(msg) {
            const container = document.getElementById("m-toast-container");
            if (!container) return;
            const toast = document.createElement("div");
            toast.className = "m-toast";
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 2500);
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                onValue(ref(database, `users/${user.uid}/problems`), snap => {
                    allProblems = snap.val() || {};
                    renderActiveView();
                });
                onValue(ref(database, `users/${user.uid}/lessons`), snap => {
                    allLessons = snap.val() || {};
                    renderActiveView();
                });
            }
        });

        window.floraTestLogin = async function() {
            try { await signInWithEmailAndPassword(auth, "tester@flora.local", "flora1234"); } catch(e) {}
        };
        if (new URLSearchParams(location.search).has("autologin")) {
            setTimeout(() => { if (!auth.currentUser) window.floraTestLogin(); }, 500);
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll(".m-tab-btn").forEach(btn => btn.classList.remove("active"));
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            if (activeBtn) activeBtn.classList.add("active");
            renderActiveView();
        };

        document.getElementById("insight-search").oninput = (e) => {
            searchQuery = e.target.value.trim().toLowerCase();
            renderActiveView();
        };

        function renderActiveView() {
            renderSubjectChips();
            const countEl = document.getElementById("m-insight-count");
            let items = getActiveItems();
            if (currentSubject !== "ALL") items = items.filter(p => p.subject === currentSubject);
            if (searchQuery) {
                items = items.filter(p => [p.content || p.insight || p.text, p.category, p.note, p.short_title, p.subject].join(" ").toLowerCase().includes(searchQuery));
            }
            if (countEl) countEl.textContent = `${items.length}件`;

            if (currentTab === "insights") {
                renderProblemsInsights();
            } else if (currentTab === "memorize") {
                renderMemorizationList();
            } else if (currentTab === "lessons") {
                renderLessonMemosList();
            }
        }

        function detectSubjectFromLesson(lesson) {
            if (!lesson) return "未分類";
            if (lesson.subject && typeof lesson.subject === "string" && lesson.subject.trim() !== "") {
                const s = lesson.subject.trim();
                if (s !== "未分類") return s;
            }
            
            // タイトル、トピック、暗記事項、パート、授業メモの内容を横断してテキスト判定
            const partsText = Array.isArray(lesson.parts) 
                ? lesson.parts.map(p => (p.title || "") + " " + (p.topic || "")).join(" ") 
                : "";
            const memoPointsText = Array.isArray(lesson.memorizationPoints)
                ? lesson.memorizationPoints.map(m => (m.category || "") + " " + (m.content || "") + " " + (m.note || "")).join(" ")
                : "";
            const memosText = Array.isArray(lesson.lessonMemos)
                ? lesson.lessonMemos.map(m => m.text || "").join(" ")
                : "";

            const text = [
                lesson.title || "",
                lesson.topicKey || "",
                lesson.topic || "",
                partsText,
                memoPointsText,
                memosText
            ].join(" ").toLowerCase();

            if (/公共|公民|政治|経済|憲法|倫理|現代社会|諸課題|中小企業|財政|農業|防災|少子|高齢|福祉|労働|金融|資本|ベンチャー|csr|ステークホルダー/i.test(text)) return "公共";
            if (/数学|微分|積分|ベクトル|数列|三角関数|確率|二次関数|図形/i.test(text)) return "数学";
            if (/物理|力学|電磁気|波動|熱力学|運動方程式|単振動/i.test(text)) return "物理";
            if (/化学|mol|モル|酸化|還元|酸|塩基|有機化学|無機化学|高分子/i.test(text)) return "化学";
            if (/生物|遺伝|細胞|dna|光合成|生態系|神経|免疫|ホルモン/i.test(text)) return "生物";
            if (/情報|プログラミング|python|アルゴリズム|ネットワーク|セキュリティ|データベース/i.test(text)) return "情報";
            if (/地理|気候|ケッペン|地形|貿易|資源|農業地域/i.test(text)) return "地理";
            if (/日本史|幕府|天皇|維新|江戸|平安|戦国|縄文|弥生/i.test(text)) return "日本史";
            if (/世界史|帝国|革命|王朝|大戦|条約|冷戦|ルネサンス/i.test(text)) return "世界史";
            if (/英語|文法|単語|長文|英作文|リスニング/i.test(text)) return "英語";
            if (/現代文|古文|漢文|国語|敬語|助詞|助動詞/i.test(text)) return "国語";
            if (/地学|地層|天体|気象|プレート|地震|火山|恒星|銀河/i.test(text)) return "地学";
            if (/理科/i.test(text)) return "理科";
            return "未分類";
        }

        function getActiveItems() {
            if (currentTab === "insights") {
                return Object.entries(allProblems)
                    .filter(([, p]) => p && p.insight && p.insight.trim() !== "")
                    .map(([id, p]) => ({ id, ...p, type: 'problem' }));
            } else if (currentTab === "memorize") {
                const list = [];
                Object.entries(allLessons).forEach(([lessonId, l]) => {
                    if (l && Array.isArray(l.memorizationPoints)) {
                        const subj = detectSubjectFromLesson(l);
                        l.memorizationPoints.forEach((mp, idx) => {
                            const mpId = mp.id || `mp_${idx}`;
                            list.push({
                                id: `${lessonId}:${mpId}`,
                                lessonId,
                                memoId: mpId,
                                subject: subj,
                                short_title: l.title || "授業",
                                category: mp.category || "重要事項",
                                content: mp.content || "",

        function getMobileFlashcardPool() {
            let items = getActiveItems();
            if (currentSubject !== "ALL") items = items.filter(p => p.subject === currentSubject);
            if (searchQuery) {
                items = items.filter(p => [p.content || p.insight || p.text, p.category, p.note, p.short_title, p.subject].join(" ").toLowerCase().includes(searchQuery));
            }
            return items.map(item => {
                if (item.type === 'memorize') {
                    const content = (item.content || "").trim();
                    const note = (item.note || "").trim();
                    const category = (item.category || "").trim();
                    let term = "";
                    let definition = "";
                    const colonIdx = content.indexOf("：") !== -1 ? content.indexOf("：") : content.indexOf(":");
                    if (colonIdx > 0 && colonIdx < 50) {
                        term = content.slice(0, colonIdx).trim();
                        definition = content.slice(colonIdx + 1).trim();
                        if (note) definition += `\n(💡 ${note})`;
                    } else if (content.includes(" = ") || content.includes(" ＝ ")) {
                        const eqIdx = content.indexOf(" ＝ ") !== -1 ? content.indexOf(" ＝ ") : content.indexOf(" = ");
                        term = content.slice(0, eqIdx).trim();
                        definition = content;
                    } else if (!content.includes("$") && content.match(/^(.+?)\s+[-ー—]\s+(.+)$/)) {
                        const dashMatch = content.match(/^(.+?)\s+[-ー—]\s+(.+)$/);
                        term = dashMatch[1].trim();
                        definition = dashMatch[2].trim();
                        if (note) definition += `\n(💡 ${note})`;
                    } else if (note) {
                        term = content;
                        definition = note;
                    } else {
                        term = content;
                        definition = content;
                    }
                    return {
                        subject: item.subject || "公共",
                        category: category || "重要事項",
                        sourceTitle: item.short_title || "授業暗記",
                        term: term,
                        answer: definition
                    };
                } else if (item.type === 'problem') {
                    return {
                        subject: item.subject || "未分類",
                        category: item.field || "解法の極意",
                        sourceTitle: item.short_title || "演習問題",
                        term: item.short_title || item.field || "問題",
                        answer: item.insight || ""
                    };
                } else if (item.type === 'lessonmemo') {
                    return {
                        subject: item.subject || "未分類",
                        category: "授業メモ",
                        sourceTitle: item.short_title || "授業",
                        term: [item.short_title, item.partTitle].filter(Boolean).join(" / ") || "授業メモ",
                        answer: item.text || ""
                    };
                }
                return null;
            }).filter(Boolean);
        }

        function openMobileFlashcards() {
            const pool = getMobileFlashcardPool();
            if (!pool || pool.length === 0) {

            mFcTotalInitial = pool.length;
            mFcMasteredCount = 0;
            mFcRetryCount = 0;
            mFcQueue = [...pool].sort(() => Math.random() - 0.5);

            mFcActiveArea.style.display = "block";
            mFcFinishArea.style.display = "none";
            mFcModal.style.display = "flex";

            renderNextMobileFc();
        }

        function renderNextMobileFc() {
            if (mFcQueue.length === 0) {
                mFcActiveArea.style.display = "none";
                mFcFinishArea.style.display = "block";
                mFcStatTotal.textContent = mFcMasteredCount;
                mFcStatRetries.textContent = mFcRetryCount;
                mFcProgressBar.style.width = "100%";
                return;
            }

            mFcCurrentCard = mFcQueue[0];
            mFcIsFlipped = false;
            mFcStage.classList.remove("flipped");

            mFcMetaSubject.textContent = mFcCurrentCard.subject;
            mFcFrontCat.textContent = mFcCurrentCard.category;
            mFcFrontSource.textContent = mFcCurrentCard.sourceTitle;
            mFcFrontTerm.innerHTML = escapeHtml(mFcCurrentCard.term);

            mFcBackSource.textContent = mFcCurrentCard.sourceTitle;
            mFcBackAnswer.innerHTML = escapeHtml(mFcCurrentCard.answer).replace(/\n/g, "<br>");

            const remaining = mFcQueue.length;
            const cur = mFcTotalInitial - remaining + 1;
            mFcProgressText.textContent = `${Math.min(cur, mFcTotalInitial)} / ${mFcTotalInitial} (残り${remaining}枚)`;
            mFcCountMastered.textContent = mFcMasteredCount;
            mFcCountRetry.textContent = mFcRetryCount;

            const pct = Math.min(100, Math.round((mFcMasteredCount / mFcTotalInitial) * 100));
            mFcProgressBar.style.width = `${pct}%`;

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([mFcStage]).catch(() => {});
            }
        }

        function flipMobileFc(forceState) {
            if (typeof forceState === "boolean") {
                mFcIsFlipped = forceState;
            } else {
                mFcIsFlipped = !mFcIsFlipped;
            }
            mFcStage.classList.toggle("flipped", mFcIsFlipped);
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([mFcStage]).catch(() => {});
            }
        }

        function markMobileFc(mastered) {
            if (!mFcCurrentCard) return;
            if (mastered) {
                mFcMasteredCount++;
                mFcQueue.shift();
            } else {
                mFcRetryCount++;
                const card = mFcQueue.shift();
                mFcQueue.push(card);
            }
            renderNextMobileFc();
        }

        function closeMobileFc() {
            mFcModal.style.display = "none";
            mFcStage.classList.remove("flipped");
            mFcIsFlipped = false;
        }

        if (mStartFlashcardBtn) mStartFlashcardBtn.onclick = openMobileFlashcards;
        if (mFcModalClose) mFcModalClose.onclick = closeMobileFc;
        if (mFcBtnFinishClose) mFcBtnFinishClose.onclick = closeMobileFc;

        if (mFcStage) {
            mFcStage.onclick = (e) => {
                if (e.target.closest("button")) return;
                flipMobileFc();
            };
        }
        if (mFcBtnFlip) mFcBtnFlip.onclick = (e) => { e.stopPropagation(); flipMobileFc(true); };
        const mFcBtnFlipBack = document.getElementById("m-fc-btn-flip-back");
        if (mFcBtnFlipBack) mFcBtnFlipBack.onclick = (e) => { e.stopPropagation(); flipMobileFc(false); };
        if (mFcBtnRetry) mFcBtnRetry.onclick = (e) => { e.stopPropagation(); markMobileFc(false); };
        if (mFcBtnMastered) mFcBtnMastered.onclick = (e) => { e.stopPropagation(); markMobileFc(true); };
    </script>

</body>
</html>
