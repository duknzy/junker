<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <title>Flora | 参考書 授業モード</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
    <link rel="stylesheet" href="style-m.css">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                macros: { fbox: ["\\bbox[2px,border:1px solid]{#1}", 1] }
            },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
            chtml: { displayAlign: 'left' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

    <style>
        /* 授業カード */
        .m-lesson-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1rem;
            margin-bottom: 0.65rem;
            box-shadow: var(--shadow-xs);
            cursor: pointer;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .m-lesson-card:active {
            transform: scale(0.985);
            box-shadow: var(--shadow-sm);
        }

        .m-lesson-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.35rem;
        }

        .m-lesson-title {
            font-family: var(--font-heading);
            font-size: var(--fs-base);
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.35;
        }

        .m-lesson-meta {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.5rem;
            font-size: 0.72rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .badge-status {
            padding: 0.15rem 0.55rem;
            border-radius: var(--radius-full);
            font-size: 0.68rem;
            font-weight: 700;
        }
        .status-teaching { background: var(--brand-light); color: var(--brand-primary); border: 1px solid var(--brand-border); }
        .status-completed { background: var(--warning-bg); color: var(--warning); border: 1px solid #FDE68A; }

        /* 受講画面 */
        #lesson-active-view {
            display: none;
            flex-direction: column;
            gap: 0.75rem;
        }

        .lesson-progress-header {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 0.75rem 1rem;
            position: sticky;
            top: var(--header-height);
            z-index: 10;
        }

        .chat-flow {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0.5rem 0;
            min-height: 200px;
        }

        .lesson-bubble {
            padding: 0.85rem 1.1rem;
            font-size: var(--fs-base);
            line-height: 1.75;
            max-width: 88%;
            width: fit-content;
            word-break: break-word;
            overflow-wrap: anywhere;
            box-sizing: border-box;
            transition: all 0.15s ease;
        }
        .lesson-bubble.teacher {
            align-self: flex-start;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--brand-primary);
            color: var(--text-primary);
            border-radius: 4px 16px 16px 16px;
            box-shadow: var(--shadow-xs);
        }
        .lesson-bubble.student {
            align-self: flex-end;
            background: var(--brand-primary);
            color: #fff;
            border-radius: 16px 4px 16px 16px;
            max-width: 82%;
            box-shadow: 0 1px 4px rgba(16, 185, 129, 0.15);
        }
        .m-bubble-divider {
            align-self: center;
            font-size: 0.72rem;
            color: var(--brand-primary);
            font-weight: 700;
            margin: 0.5rem 0;
            background: var(--brand-light);
            border: 1px solid var(--brand-border);
            padding: 0.25rem 0.85rem;
            border-radius: var(--radius-full);
            width: fit-content;
            max-width: 95%;
            box-sizing: border-box;
        }

        /* 💬 吹き出しアクション（再作成・コピー） */
        .m-bubble-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.4rem;
            margin-top: 0.45rem;
            padding-top: 0.4rem;
            border-top: 1px dashed var(--border-subtle);
        }
        .m-bubble-action-btn {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.22rem 0.55rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            line-height: 1.2;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .m-bubble-action-btn:active {
            background: var(--brand-light);
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            transform: scale(0.96);
        }
        .m-bubble-regen-btn {
            color: var(--brand-primary);
            border-color: var(--brand-border);
            background: var(--brand-light);
        }

        /* 再作成中のローディング表示 */
        .m-bubble-regenerating {
            opacity: 0.75;
            position: relative;
        }
        .m-bubble-loading-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.72rem;
            color: var(--brand-primary);
            font-weight: 700;
            background: var(--brand-light);
            border: 1px solid var(--brand-border);
            padding: 0.25rem 0.65rem;
            border-radius: var(--radius-full);
            margin-top: 0.45rem;
            animation: mPulse 1.4s infinite;
        }
        @keyframes mPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.98); }
        }

        /* 各回リスト（モーダル内カード） */
        .part-select-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.75rem 0.9rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            transition: all 0.15s ease;
        }
        .part-select-card.active {
            border-color: var(--brand-primary);
            background: rgba(5, 150, 105, 0.04);
        }

        .lecture-note-box {
            background: var(--bg-subtle);
            border-left: 4px solid var(--brand-primary);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            padding: 0.9rem 1rem;
            font-size: var(--fs-sm);
            line-height: 1.75;
            margin: 0.5rem 0;
        }

        /* 画面下部のアクションバー */
        .lesson-input-bar {
            position: sticky;
            bottom: calc(var(--bottom-nav-height) + var(--safe-area-bottom));
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            padding: 0.5rem 0;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: 0.5rem;
            z-index: 20;
        }

        /* モバイル授業作成モーダル（ボトムシート） */
        .create-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99990;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .create-modal-sheet {
            background: var(--bg-surface);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.25rem;
            box-shadow: var(--shadow-modal);
            animation: slideUp 0.25s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .mode-toggle-group {
            display: flex;
            gap: 0.4rem;
            margin-bottom: 0.8rem;
        }
        .mode-toggle-btn {
            flex: 1;
            padding: 0.55rem;
            border: 1px solid var(--border-color);
            background: var(--bg-subtle);
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }
        .mode-toggle-btn.active {
            background: var(--brand-primary);
            color: #fff;
            border-color: var(--brand-primary);
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="m-header">
        <button class="m-header-back" id="header-back-btn" onclick="location.href='index.html'">‹</button>
        <span class="m-header-title" id="header-title">📖 参考書 授業モード</span>
        <button class="m-btn m-btn-primary" id="open-create-modal-btn" style="padding:0.35rem 0.75rem; font-size:0.75rem; min-height:34px; border-radius:var(--radius-full);">
            ＋ 新規作成
        </button>
    </header>

    <!-- ログイン案内 -->
    <div id="login-required-notice" class="m-content" style="display:none;">
        <div class="m-empty-state" style="margin-top:3rem;">
            <div class="m-empty-state-icon">🔒</div>
            <div class="m-empty-state-title">ログインが必要です</div>
            <button id="main-login-btn" class="m-btn m-btn-primary" style="margin-top:1rem;">Googleでログイン</button>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <main id="main-content" class="m-content" style="display:none;">

        <!-- 授業一覧ビュー -->
        <div id="lessons-list-view">
            <div class="m-search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="lesson-search-input" placeholder="授業を検索...">
            </div>

            <!-- 教科フィルター -->
            <div class="m-filter-chips" id="lesson-subject-chips"></div>

            <!-- 授業一覧リスト -->
            <div id="lesson-list-container" style="margin-top:0.6rem;"></div>
        </div>

        <!-- 授業受講画面ビュー -->
        <div id="lesson-active-view">
            <!-- 進捗バー & 回アクション -->
            <div class="lesson-progress-header">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.45rem; flex-wrap:wrap; gap:0.4rem;">
                    <button class="m-btn" id="leave-lesson-btn" style="padding:0.25rem 0.6rem; font-size:0.7rem; min-height:28px;">
                        ← 授業一覧へ
                    </button>
                    <div style="display:flex; align-items:center; gap:0.35rem;">
                        <span style="font-size:0.75rem; font-weight:700; color:var(--text-secondary);" id="lesson-part-indicator">
                            Part 1 / 1
                        </span>
                        <button type="button" class="m-bubble-action-btn m-bubble-regen-btn" id="m-btn-regen-current-part" title="現在の回を作り直す">
                            🔄 この回を再作成
                        </button>
                        <button type="button" class="m-bubble-action-btn" id="m-btn-open-parts-modal" title="各回一覧・目次">
                            📑 各回一覧
                        </button>
                    </div>
                </div>
                <div class="m-progress">
                    <div class="m-progress-bar" id="lesson-progress-bar" style="width:100%;"></div>
                </div>
            </div>

            <!-- 講義チャットストリーム -->
            <div class="chat-flow" id="lesson-chat-flow"></div>

            <!-- アクション入力バー -->
            <div class="lesson-input-bar">
                <input type="text" class="m-input" id="lesson-student-input" placeholder="先生に質問、または「次へ」..." style="font-size:var(--fs-sm);">
                <button class="m-btn m-btn-primary" id="lesson-send-btn" style="flex-shrink:0;">送信</button>
            </div>
        </div>

    </main>

    <!-- 🎓 授業新規作成モーダル（ボトムシート） -->
    <div class="create-modal-overlay" id="create-modal">
        <div class="create-modal-sheet">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
                <h3 style="font-family:var(--font-heading); font-size:1.05rem; font-weight:800;">✨ 新しい授業を作成</h3>
                <button type="button" id="close-create-modal-btn" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);">✕</button>
            </div>

            <!-- モード切替 -->
            <div class="mode-toggle-group">
                <button type="button" class="mode-toggle-btn active" id="mode-topic-btn">✏️ テーマ名から</button>
                <button type="button" class="mode-toggle-btn" id="mode-photo-btn">📸 写真から</button>
            </div>

            <!-- 教科選択 -->
            <div style="margin-bottom:0.75rem;">
                <label style="font-size:0.75rem; font-weight:700; color:var(--text-secondary); display:block; margin-bottom:0.3rem;">教科</label>
                <select id="create-subject-select" class="m-input" style="padding:0.4rem 0.6rem;">
                    <option value="数学">📐 数学</option>
                    <option value="物理">⚡ 物理</option>
                    <option value="化学">🧪 化学</option>
                    <option value="生物">🧬 生物</option>
                    <option value="情報">💻 情報</option>
                    <option value="地理">🗺️ 地理</option>
                    <option value="日本史">⛩️ 日本史</option>
                    <option value="世界史">🏛️ 世界史</option>
                    <option value="英語">🔤 英語</option>
                    <option value="国語">📜 国語</option>
                    <option value="公共">⚖️ 公共</option>
                    <option value="公民">🏛️ 公民</option>
                </select>
            </div>

            <!-- レベル選択（数学・理科・英語等で表示。社会・国語等の1回完結教科は自動網羅のため非表示） -->
            <div id="create-level-wrap" style="margin-bottom:0.75rem;">
                <label style="font-size:0.75rem; font-weight:700; color:var(--text-secondary); display:block; margin-bottom:0.3rem;">目標レベル</label>
                <select id="create-level-select" class="m-input" style="padding:0.4rem 0.6rem;">
                    <option value="基礎・概念理解">🌱 基礎・概念理解（教科書基礎・原理）</option>
                    <option value="入試典型パターン" selected>🎯 入試典型パターン（頻出解法の定石）</option>
                    <option value="難関・融合応用">🔥 難関・融合応用（複合問題・上位大対策）</option>
                </select>
            </div>

            <!-- 🏛️ 1回完結型（社会・国語）専用のスマート案内（レベル選択不要） -->
            <div id="create-social-note" style="display:none; margin-bottom:0.75rem; background:rgba(5, 150, 105, 0.08); border:1px solid var(--brand-border); border-radius:var(--radius-md); padding:0.5rem 0.75rem; font-size:0.73rem; color:var(--brand-primary); font-weight:600; line-height:1.45;">
                🏛️ <b>1回完結マスター対象教科</b>：用語・因果関係・歴史の流れ・入試頻出ポイントを1回の授業で一挙に網羅します（段階作成は不要です）
            </div>

            <!-- テーマ名入力欄（テーマモード時） -->
            <div id="field-topic-wrap" style="margin-bottom:0.75rem;">
                <label style="font-size:0.75rem; font-weight:700; color:var(--text-secondary); display:block; margin-bottom:0.3rem;">学びたい単元・テーマ</label>
                <input type="text" id="create-topic-input" class="m-input" placeholder="例：3次関数の微分と極値、酸化還元反応 など">
            </div>

            <!-- 写真選択欄（写真モード時） -->
            <div id="field-photo-wrap" style="display:none; margin-bottom:0.75rem;">
                <label style="font-size:0.75rem; font-weight:700; color:var(--text-secondary); display:block; margin-bottom:0.3rem;">教科書・参考書の写真</label>
                <input type="file" accept="image/*" multiple id="create-photo-input" class="m-input" style="padding:0.4rem;">
                <div id="mobile-photo-order-guide" style="display:none; margin-top:0.4rem; font-size:0.7rem; color:var(--brand-primary); background:rgba(5,150,105,0.08); padding:0.4rem 0.55rem; border-radius:var(--radius-sm); line-height:1.4;">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:0.4rem;">
                        <span style="flex:1;">💡 <b>読む順番</b>：左から右へ「①→②…」の順。写真下の「<b>先頭</b>」で一発移動できます。</span>
                        <button type="button" id="mobile-photo-reverse-btn" style="flex-shrink:0; font-size:0.68rem; font-weight:750; color:var(--brand-primary); background:var(--bg-surface); border:1px solid var(--brand-border); border-radius:4px; padding:3px 7px; cursor:pointer;">⇄ 逆順にする</button>
                    </div>
                </div>
                <div id="create-thumb-preview" style="display:flex; gap:0.5rem; overflow-x:auto; margin-top:0.5rem; padding-bottom:0.3rem;"></div>
            </div>

            <!-- メモ・要望 -->
            <div style="margin-bottom:1rem;">
                <label style="font-size:0.75rem; font-weight:700; color:var(--text-secondary); display:block; margin-bottom:0.3rem;">先生への要望（任意）</label>
                <input type="text" id="create-note-input" class="m-input" placeholder="例：公式の導出を丁寧に、記述対策重視 など">
            </div>

            <button type="button" class="m-btn m-btn-primary m-btn-full" id="run-create-lesson-btn" style="min-height:48px; font-size:0.95rem;">
                🚀 AI授業を生成（AI3並列）
            </button>
        </div>
    </div>

    <!-- 📑 各回一覧・再作成モーダル（ボトムシート） -->
    <div class="create-modal-overlay" id="parts-modal">
        <div class="create-modal-sheet">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
                <h3 style="font-family:var(--font-heading); font-size:1.05rem; font-weight:800; color:var(--text-primary);">📑 各回の一覧・再作成</h3>
                <button type="button" id="close-parts-modal-btn" style="background:none; border:none; font-size:1.25rem; cursor:pointer; color:var(--text-muted); padding:0.2rem;">✕</button>
            </div>
            <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.8rem; line-height:1.4;">
                受講する回を切り替えたり、各回の解説を最初から作り直すことができます。
            </p>
            <div id="parts-modal-list" style="display:flex; flex-direction:column; gap:0.55rem; max-height:60vh; overflow-y:auto; padding-bottom:0.5rem;"></div>
        </div>
    </div>

    <!-- ボトムナビ -->
    <script src="bottom-nav.js"></script>

    <script type="module">
        import { initApiKeyManager, showToast, callGeminiJSON, callGeminiChat } from "../api-key-manager.js?v=3.5";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithEmailAndPassword, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55MdhpjJizQaLEdRu-XhBVJ4PqrHsAyY",
            authDomain: "buturi-2449e.firebaseapp.com",
            databaseURL: "https://buturi-2449e-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "buturi-2449e",
            storageBucket: "buturi-2449e.appspot.com",
            messagingSenderId: "976306696124",
            appId: "1:976306696124:web:e455c1953544bff5c345b9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const provider = new GoogleAuthProvider();

        initApiKeyManager({ needGemini: true, needDeepseek: false });

        let currentUser = null;
        let lessonsCache = {};
        let activeLessonId = null;
        let currentSubjectFilter = "ALL";
        let currentSearchQuery = "";
        let createMode = "topic"; // "topic" or "photo"
        let createSelectedImages = [];

        // 🎯 URLパラメータから特定の授業IDを取得（暗記事項・タイムライン等からの直行用）
        const urlParams = new URLSearchParams(window.location.search);
        const requestedLessonId = urlParams.get('id') || urlParams.get('lessonId');
        let initialLessonOpened = false;

        // ==================== 認証 ====================
        onAuthStateChanged(auth, (user) => {
            const loginNotice = document.getElementById("login-required-notice");
            const mainContent = document.getElementById("main-content");
            if (user) {
                currentUser = user;
                loginNotice.style.display = "none";
                mainContent.style.display = "block";
                listenToLessons(user.uid);
            } else {
                currentUser = null;
                loginNotice.style.display = "block";
                mainContent.style.display = "none";
            }
        });

        document.getElementById("main-login-btn")?.addEventListener("click", () => signInWithPopup(auth, provider));

        window.floraTestLogin = async function() {
            try { await signInWithEmailAndPassword(auth, "tester@flora.local", "flora1234"); } catch(e) {}
        };
        if (new URLSearchParams(location.search).has("autologin")) {
            setTimeout(() => { if (!auth.currentUser) window.floraTestLogin(); }, 500);
        }

        // ==================== Firebase監視 ====================
        function listenToLessons(uid) {
            onValue(ref(database, `users/${uid}/lessons`), (snap) => {
                lessonsCache = snap.val() || {};
                renderLessonList();

                // 🎯 暗記事項・ノート等から「授業を開く」で渡された特定授業へ直行
                if (requestedLessonId && !initialLessonOpened) {
                    if (lessonsCache[requestedLessonId]) {
                        initialLessonOpened = true;
                        openLesson(requestedLessonId);
                    } else {
                        // キャッシュにまだ反映されていない場合のフェイルセーフ単体取得
                        get(ref(database, `users/${uid}/lessons/${requestedLessonId}`)).then((s) => {
                            if (s.exists() && !initialLessonOpened) {
                                initialLessonOpened = true;
                                lessonsCache[requestedLessonId] = s.val();
                                openLesson(requestedLessonId);
                            } else if (!initialLessonOpened) {
                                initialLessonOpened = true;
                                if (window.mToast) mToast("⚠️ 指定された授業が見つかりませんでした");
                            }
                        }).catch(() => {});
                    }
                }
            });
        }

        // ==================== 検索 & フィルター ====================
        document.getElementById("lesson-search-input")?.addEventListener("input", (e) => {
            currentSearchQuery = e.target.value.trim().toLowerCase();
            renderLessonList();
        });

        function renderLessonList() {
            const container = document.getElementById("lesson-list-container");
            const chipsEl = document.getElementById("lesson-subject-chips");

            function getLessonSubject(l) {
                if (l.subject) return l.subject;
                const text = ((l.title || "") + " " + (l.topic || "")).toLowerCase();
                if (/公共/i.test(text)) return "公共";
                if (/情報|プログラミング|python/i.test(text)) return "情報";
                if (/地理|気候/i.test(text)) return "地理";
                if (/日本史/i.test(text)) return "日本史";
                if (/世界史|歴史/i.test(text)) return "世界史";
                if (/生物|遺伝|細胞/i.test(text)) return "生物";
                if (/数学|微分|積分|ベクトル|数列|確率/i.test(text)) return "数学";
                if (/物理|力学|電磁気|波動/i.test(text)) return "物理";
                if (/化学|mol|酸化|還元/i.test(text)) return "化学";
                if (/英語|文法/i.test(text)) return "英語";
                if (/現代文|古文|漢文|国語/i.test(text)) return "国語";
                if (/公民|政治|経済|憲法|倫理/i.test(text)) return "公民";
                return "未分類";
            }

            const subjects = new Set();
            Object.values(lessonsCache).forEach(l => {
                if (l) {
                    const s = getLessonSubject(l);
                    if (s && s !== "未分類") subjects.add(s);
                }
            });

            let chipsHtml = `<button class="m-chip ${currentSubjectFilter === 'ALL' ? 'active' : ''}" data-subj="ALL">✨ すべて</button>`;
            subjects.forEach(s => {
                chipsHtml += `<button class="m-chip ${currentSubjectFilter === s ? 'active' : ''}" data-subj="${s}">${s}</button>`;
            });
            chipsEl.innerHTML = chipsHtml;
            chipsEl.querySelectorAll(".m-chip").forEach(btn => {
                btn.addEventListener("click", () => {
                    currentSubjectFilter = btn.dataset.subj;
                    renderLessonList();
                });
            });

            const entries = Object.entries(lessonsCache).sort((a, b) => new Date(b[1].createdAt || 0) - new Date(a[1].createdAt || 0));
            const filtered = entries.filter(([, l]) => {
                if (!l) return false;
                const subj = getLessonSubject(l);
                if (currentSubjectFilter !== "ALL" && subj !== currentSubjectFilter) return false;
                if (currentSearchQuery) {
                    const hay = [l.title, l.topic, subj, l.level].filter(Boolean).join(" ").toLowerCase();
                    if (!hay.includes(currentSearchQuery)) return false;
                }
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="m-empty-state"><div class="m-empty-state-icon">📖</div><div class="m-empty-state-title">授業がありません</div><div class="m-empty-state-text">上の「＋ 新規作成」ボタンから<br>新しいAI授業を作ってみましょう！</div></div>`;
                return;
            }

            container.innerHTML = filtered.map(([id, l]) => {
                const isCompleted = l.status === "completed";
                const statusClass = isCompleted ? "status-completed" : "status-teaching";
                const statusText = isCompleted ? "✅ 完了" : "📖 進行中";
                const cardSubj = getLessonSubject(l);

                return `
                    <div class="m-lesson-card" data-lesson-id="${id}">
                        <div class="m-lesson-top">
                            <span class="m-subject-badge subj-${cardSubj}">${escapeHtml(cardSubj)}</span>
                            <div style="display:flex; align-items:center; gap:0.4rem;">
                                <span class="badge-status ${statusClass}">${statusText}</span>
                                <button type="button" class="m-card-delete-btn" data-delete-m-lesson="${id}" title="削除" style="background:transparent; border:1px solid #FECACA; color:var(--error); border-radius:var(--radius-sm); padding:0.1rem 0.4rem; font-size:0.7rem; cursor:pointer;">🗑️</button>
                            </div>
                        </div>
                        <div class="m-lesson-title">${escapeHtml(l.title || l.topic || '無題の授業')}</div>
                        <div class="m-lesson-meta">
                            <span>🪜 ${escapeHtml(l.level || '高校基礎')}</span>
                            <span>⏱️ ${l.createdAt ? new Date(l.createdAt).toLocaleDateString('ja-JP') : ''}</span>
                        </div>
                    </div>
                `;
            }).join("");

            container.querySelectorAll(".m-lesson-card").forEach(card => {
                card.addEventListener("click", () => openLesson(card.dataset.lessonId));
            });

            container.querySelectorAll("[data-delete-m-lesson]").forEach(btn => {
                btn.addEventListener("click", async (e) => {
                    e.stopPropagation();
                    const lessonId = btn.getAttribute("data-delete-m-lesson");
                    const l = lessonsCache[lessonId];
                    const title = l ? (l.title || l.topic || "この授業") : "この授業";
                    if (!confirm(`「${title}」を削除します。よろしいですか？`)) return;
                    try {
                        await set(ref(database, `users/${currentUser.uid}/lessons/${lessonId}`), null);
                    } catch (err) {
                        alert("削除に失敗しました: " + err.message);
                    }
                });
            });
        }

        // ==================== 授業受講画面 ====================
        let regeneratingMsgIndex = null;
        let isRegeneratingLectureNote = false;
        let isRegeneratingPart = false;

        function openLesson(lessonId) {
            const lesson = lessonsCache[lessonId];
            if (!lesson) return;

            activeLessonId = lessonId;
            document.getElementById("lessons-list-view").style.display = "none";
            document.getElementById("open-create-modal-btn").style.display = "none";
            document.getElementById("lesson-active-view").style.display = "flex";
            document.getElementById("header-title").textContent = lesson.title || "授業受講";

            // URLパラメータを同期（リロード時にも該当授業が開くようにする）
            try {
                const url = new URL(window.location.href);
                url.searchParams.set('id', lessonId);
                window.history.replaceState(null, '', url.pathname + (url.search ? url.search : ''));
            } catch(e) {}

            renderActiveLessonUI(true);
        }

        function renderActiveLessonUI(shouldScrollToBottom = false) {
            if (!activeLessonId) return;
            const lesson = lessonsCache[activeLessonId];
            if (!lesson) return;

            const chatFlow = document.getElementById("lesson-chat-flow");
            chatFlow.innerHTML = "";

            // パート情報の取得
            const parts = Array.isArray(lesson.parts) && lesson.parts.length > 0 ? lesson.parts : [{ title: lesson.title, summary: lesson.topic || "" }];
            const currentPartIdx = Math.min(Math.max(0, lesson.currentPartIndex || 0), parts.length - 1);

            // 進捗バーとインジケータ更新
            const partIndicator = document.getElementById("lesson-part-indicator");
            const progressBar = document.getElementById("lesson-progress-bar");
            if (partIndicator) {
                partIndicator.textContent = `Part ${currentPartIdx + 1} / ${parts.length}`;
            }
            if (progressBar) {
                const pct = Math.min(100, Math.round(((currentPartIdx + 1) / parts.length) * 100));
                progressBar.style.width = `${pct}%`;
            }

            // 1. プロ講師の講義ノート（単一ノート型または基礎ノート）
            if (lesson.lectureNote) {
                const isRegenNote = isRegeneratingLectureNote;
                chatFlow.innerHTML += `
                    <div class="lesson-bubble teacher ${isRegenNote ? 'm-bubble-regenerating' : ''}" id="lecture-note-bubble">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <strong>👨‍🏫 プロ講師の講義ノート</strong>
                            <span style="font-size:0.68rem; color:var(--text-muted);">基礎解説</span>
                        </div>
                        ${isRegenNote ? `<div class="m-bubble-loading-badge">⚙️ 講義ノートを再作成中...</div>` : `<div class="lecture-note-box tex2jax_process">${formatText(lesson.lectureNote)}</div>`}
                        <div style="font-size:0.75rem; color:var(--text-secondary); margin-top:0.35rem;">
                            疑問点があれば下の入力欄から自由に質問できます。
                        </div>
                        <div class="m-bubble-actions">
                            <button type="button" class="m-bubble-action-btn m-bubble-regen-btn" id="btn-regen-lecture-note" title="講義ノートを最初から再作成">
                                🔄 講義ノートを再作成
                            </button>
                            <button type="button" class="m-bubble-action-btn" id="btn-copy-lecture-note" title="講義ノートをコピー">
                                📋 コピー
                            </button>
                        </div>
                    </div>
                `;
            } else if (lesson.plan) {
                chatFlow.innerHTML += `
                    <div class="lesson-bubble teacher">
                        <strong>👨‍🏫 今日の講義テーマ: ${escapeHtml(lesson.title || '')}</strong>
                        <div class="lecture-note-box tex2jax_process">${formatText(lesson.plan)}</div>
                    </div>
                `;
            }

            // 2. チャット履歴（講義メッセージ・生徒質問・ディバイダー）
            if (Array.isArray(lesson.chatHistory)) {
                // dividerの出現回数からパート番号を特定
                let currentDividerPartIdx = -1;

                lesson.chatHistory.forEach((msg, idx) => {
                    if (msg.role === "divider") {
                        currentDividerPartIdx++;
                        const partIdx = currentDividerPartIdx;
                        chatFlow.innerHTML += `
                            <div class="m-bubble-divider" style="display:flex; align-items:center; justify-content:space-between; gap:0.5rem;">
                                <span style="font-weight:700;">${escapeHtml(msg.content || `第${partIdx + 1}回`)}</span>
                                <button type="button" class="m-bubble-action-btn m-bubble-regen-btn" data-regen-part-idx="${partIdx}" style="padding:0.12rem 0.45rem; font-size:0.65rem; background:#fff; flex-shrink:0;">
                                    🔄 この回を再作成
                                </button>
                            </div>
                        `;
                        return;
                    }

                    if (msg.role === "user") {
                        chatFlow.innerHTML += `
                            <div class="lesson-bubble student tex2jax_process">
                                ${formatText(msg.text || msg.content || "")}
                            </div>
                        `;
                        return;
                    }

                    // アシスタント（講師AI）の吹き出し
                    const isMsgRegenerating = (regeneratingMsgIndex === idx);
                    let diagramHtml = "";
                    if (msg.diagramSvg) {
                        diagramHtml = `
                            <div class="ai-diagram-box theme-dark" style="margin-top:0.5rem;">
                                <div class="ai-diagram-box-header">
                                    <span>📊 AI図解・概念マップ</span>
                                </div>
                                <div class="ai-diagram-svg-wrap">
                                    ${msg.diagramSvg}
                                </div>
                            </div>
                        `;
                    }

                    let bodyHtml = "";
                    if (isMsgRegenerating) {
                        bodyHtml = `<div class="m-bubble-loading-badge">⚙️ この返答を再作成中...</div>`;
                    } else {
                        bodyHtml = `
                            <div>${formatText(msg.text || msg.content || "")}</div>
                            ${diagramHtml}
                            <div class="m-bubble-actions">
                                <button type="button" class="m-bubble-action-btn m-bubble-regen-btn" data-regen-msg="${idx}" title="この返答だけを再作成">
                                    🔄 返答を再作成
                                </button>
                                <button type="button" class="m-bubble-action-btn" data-copy-msg="${idx}" title="テキストをコピー">
                                    📋 コピー
                                </button>
                            </div>
                        `;
                    }

                    chatFlow.innerHTML += `
                        <div class="lesson-bubble teacher tex2jax_process ${isMsgRegenerating ? 'm-bubble-regenerating' : ''}" data-bubble-idx="${idx}">
                            ${bodyHtml}
                        </div>
                    `;
                });
            }

            // MathJax レンダリング
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([chatFlow]).catch(() => {});
            }

            if (shouldScrollToBottom) {
                setTimeout(() => {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 100);
            }
        }

        // ==================== 一部の返答の再作成 ====================
        async function regenerateMobileMessage(msgIndex) {
            if (!activeLessonId || !currentUser || regeneratingMsgIndex !== null) return;
            const lesson = lessonsCache[activeLessonId];
            if (!lesson) return;
            const history = lesson.chatHistory || [];
            const targetMsg = history[msgIndex];
            if (!targetMsg || targetMsg.role === "user" || targetMsg.role === "divider") return;

            // 属するパートを特定
            let partIndex = 0;
            let currentPartDividerIdx = -1;
            let dividerCount = -1;
            for (let i = 0; i <= msgIndex; i++) {
                if (history[i].role === "divider") {
                    dividerCount++;
                    currentPartDividerIdx = i;
                }
            }
            partIndex = Math.max(0, dividerCount >= 0 ? dividerCount : (lesson.currentPartIndex || 0));
            const parts = Array.isArray(lesson.parts) && lesson.parts.length > 0 ? lesson.parts : [{ title: lesson.title, summary: lesson.topic || "" }];
            const part = parts[partIndex] || { title: lesson.title, summary: "" };

            // 直前の生徒の質問を探す
            let prevUserMsg = null;
            for (let i = msgIndex - 1; i >= 0; i--) {
                if (history[i].role === "divider") break;
                if (history[i].role === "user") {
                    prevUserMsg = history[i].text || history[i].content || "";
                    break;
                }
            }

            regeneratingMsgIndex = msgIndex;
            renderActiveLessonUI(false);

            try {
                let contextHistory = [];
                const systemInstruction = `あなたは高校・大学受験指導の専任プロ講師AIです。
論理と公式・解法の厳密性を最優先に教えてください。
数式は必ず $ $ または $$ $$ で囲んでください。
前置きや挨拶は省き、本題から直接わかりやすく解説してください。`;

                if (prevUserMsg) {
                    contextHistory = [{
                        role: "user",
                        parts: [{
                            text: `【授業テーマ】${lesson.title}\n【第${partIndex + 1}回】${part.title}\n【生徒の質問】${prevUserMsg}\n\n【指示】生徒の質問に対して、前回の回答とは別の切り口や具体的でわかりやすい例え、解法ステップを用いて丁寧に再回答してください。論理と厳密性を大切にしてください。`
                        }]
                    }];
                } else {
                    contextHistory = [{
                        role: "user",
                        parts: [{
                            text: `【授業テーマ】${lesson.title}\n【第${partIndex + 1}回】${part.title}（${part.summary || ''}）\n\n【指示】第${partIndex + 1}回の導入講義を、初回1通目として最初からわかりやすく解説してください。前回の説明とは別の例えや切り口を用いてください。前置きは省いて本題から始めてください。`
                        }]
                    }];
                }

                const reply = await callGeminiChat(contextHistory, systemInstruction, { featureId: "lesson_teach" });
                const replyText = typeof reply === "string" ? reply : (reply?.message || reply?.reply || JSON.stringify(reply));

                lesson.chatHistory[msgIndex].content = replyText;
                lesson.chatHistory[msgIndex].text = replyText;

                await update(ref(database, `users/${currentUser.uid}/lessons/${activeLessonId}`), {
                    chatHistory: lesson.chatHistory
                });

                if (window.mToast) mToast("✅ 返答を再作成しました");
            } catch (err) {
                console.error("返答再作成エラー:", err);
                if (window.mToast) mToast("⚠️ 再作成に失敗しました: " + err.message);
            } finally {
                regeneratingMsgIndex = null;
                renderActiveLessonUI(false);
            }
        }

        // ==================== 返答のコピー ====================
        async function copyMobileMessage(msgIndex) {
            const lesson = lessonsCache[activeLessonId];
            if (!lesson || !Array.isArray(lesson.chatHistory)) return;
            const msg = lesson.chatHistory[msgIndex];
            if (!msg) return;
            const text = msg.text || msg.content || "";
            try {
                await navigator.clipboard.writeText(text);
                if (window.mToast) mToast("📋 テキストをコピーしました");
            } catch (e) {
                if (window.mToast) mToast("⚠️ コピーに失敗しました");
            }
        }

        // ==================== 講義ノートの再作成 ====================
        async function regenerateMobileLectureNote() {
            if (!activeLessonId || !currentUser || isRegeneratingLectureNote) return;
            const lesson = lessonsCache[activeLessonId];
            if (!lesson) return;

            const ok = confirm(`「${lesson.title}」の講義ノートを最初から作り直します。\nよろしいですか？`);
            if (!ok) return;

            isRegeneratingLectureNote = true;
            renderActiveLessonUI(false);

            try {
                const prompt = `【教科：${lesson.subject || "高校学習"}】
【授業テーマ】${lesson.title}
【目標レベル】${lesson.level || "高校標準"}
【単元・要望】${lesson.topic || lesson.title}

【指示】
この単元についての超詳細な講義ノート全文を最初からわかりやすく執筆してください。
前回の説明とは別の例えや直感的なアプローチを取り入れ、論理と公式の導出を厳密に行ってください。
数式は必ず $ $ または $$ $$ で囲んでください。`;

                const reply = await callGeminiChat(
                    [{ role: "user", parts: [{ text: prompt }] }],
                    "あなたは予備校の専任プロ講師です。論理的で厳密、初学者にもわかりやすく深い講義ノート全文を執筆してください。",
                    { featureId: "lesson_plan" }
                );
                const replyText = typeof reply === "string" ? reply : (reply?.message || reply?.reply || JSON.stringify(reply));

                lesson.lectureNote = replyText;
                await update(ref(database, `users/${currentUser.uid}/lessons/${activeLessonId}`), {
                    lectureNote: replyText
                });

                if (window.mToast) mToast("✅ 講義ノートを再作成しました");
            } catch (err) {
                console.error("講義ノート再作成エラー:", err);
                if (window.mToast) mToast("⚠️ 再作成に失敗しました: " + err.message);
            } finally {
                isRegeneratingLectureNote = false;
                renderActiveLessonUI(false);
            }
        }

        async function copyMobileLectureNote() {
            const lesson = lessonsCache[activeLessonId];
            if (!lesson || !lesson.lectureNote) return;
            try {
                await navigator.clipboard.writeText(lesson.lectureNote);
                if (window.mToast) mToast("📋 講義ノートをコピーしました");
            } catch (e) {
                if (window.mToast) mToast("⚠️ コピーに失敗しました");
            }
        }

        // ==================== 授業内の各回の再作成 ====================
        async function regenerateMobilePart(partIndex) {
            if (!activeLessonId || !currentUser || isRegeneratingPart) return;
            const lesson = lessonsCache[activeLessonId];
            if (!lesson) return;

            const parts = Array.isArray(lesson.parts) && lesson.parts.length > 0 ? lesson.parts : [{ title: lesson.title, summary: lesson.topic || "" }];
            const part = parts[partIndex] || { title: lesson.title, summary: "" };

            const ok = confirm(`第${partIndex + 1}回「${part.title}」の授業を作り直します。\nこの回の説明・質問履歴は新しい講義内容に置き換わります。よろしいですか？`);
            if (!ok) return;

            // モーダルを閉じる
            const partsModal = document.getElementById("parts-modal");
            if (partsModal) partsModal.style.display = "none";

            isRegeneratingPart = true;
            const indicator = document.getElementById("lesson-part-indicator");
            if (indicator) indicator.textContent = `⚙️ 第${partIndex + 1}回を作成中...`;

            try {
                const prompt = `【教科：${lesson.subject || "高校学習"}】
【授業テーマ】${lesson.title}
【単元目標】${lesson.topic || lesson.title}
【第${partIndex + 1}回タイトル】${part.title}
【第${partIndex + 1}回要点】${part.summary || ""}
【全体の講義ノート】${lesson.lectureNote || ""}

【指示】
第${partIndex + 1}回「${part.title}」の講義を、初回1通目として最初からわかりやすく、論理的かつ厳密に解説してください。
前回の説明とは別の例えや直感的なアプローチを交え、初学者がつまずきやすい急所を明確に示してください。
数式は必ず $ $ または $$ $$ で囲むこと。前置きやお礼は省き、第${partIndex + 1}回の本題から始めてください。`;

                const reply = await callGeminiChat(
                    [{ role: "user", parts: [{ text: prompt }] }],
                    "あなたは高校・難関大受験指導のプロ講師AIです。わかりやすく明快、論理的で厳密な講義を行ってください。",
                    { featureId: "lesson_teach" }
                );
                const replyText = typeof reply === "string" ? reply : (reply?.message || reply?.reply || JSON.stringify(reply));

                const newAssistantMsg = {
                    role: "assistant",
                    content: replyText,
                    text: replyText
                };

                if (!Array.isArray(lesson.chatHistory)) lesson.chatHistory = [];
                const history = lesson.chatHistory;

                // dividerの位置を特定
                const dividerIndices = [];
                history.forEach((m, idx) => {
                    if (m.role === "divider") dividerIndices.push(idx);
                });

                if (dividerIndices.length > 0 && dividerIndices[partIndex] !== undefined) {
                    const startIdx = dividerIndices[partIndex];
                    const endIdx = (dividerIndices[partIndex + 1] !== undefined) ? dividerIndices[partIndex + 1] : history.length;
                    history.splice(startIdx + 1, endIdx - (startIdx + 1), newAssistantMsg);
                } else if (dividerIndices.length === 0) {
                    history.length = 0;
                    history.push({ role: "divider", content: `第${partIndex + 1}回: ${part.title}` });
                    history.push(newAssistantMsg);
                } else {
                    history.push({ role: "divider", content: `第${partIndex + 1}回: ${part.title}` });
                    history.push(newAssistantMsg);
                }

                lesson.currentPartIndex = partIndex;

        // ==================== 授業チャット送信 ====================
        async function sendLessonMessage() {
            const input = document.getElementById("lesson-student-input");
            const text = input.value.trim();
            if (!text || !activeLessonId || !currentUser) return;
            input.value = "";

            const chatFlow = document.getElementById("lesson-chat-flow");
            chatFlow.insertAdjacentHTML("beforeend", `<div class="lesson-bubble student tex2jax_process">${escapeHtml(text)}</div>`);

            const thinkingEl = document.createElement("div");
            thinkingEl.className = "lesson-bubble teacher";
            thinkingEl.innerHTML = `<div class="m-bubble-loading-badge">先生が返答を作成中...</div>`;
            chatFlow.appendChild(thinkingEl);
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

            try {
                const lesson = lessonsCache[activeLessonId];
                const parts = Array.isArray(lesson.parts) && lesson.parts.length > 0 ? lesson.parts : [{ title: lesson.title, summary: "" }];
                const currentPartIdx = Math.min(Math.max(0, lesson.currentPartIndex || 0), parts.length - 1);
                const currentPart = parts[currentPartIdx] || { title: lesson.title };

                // 「次へ」や「次の回」の場合の自動パート進捗判定
                if (/^(次へ|次|進む|次の回|次のパート|next)$/i.test(text.replace(/\s+/g, '')) && currentPartIdx < parts.length - 1) {
                    const nextPartIdx = currentPartIdx + 1;
                    const nextPart = parts[nextPartIdx];
                    lesson.currentPartIndex = nextPartIdx;

                    const nextPrompt = `【授業テーマ】${lesson.title}\n【第${nextPartIdx + 1}回】${nextPart.title}（${nextPart.summary || ''}）\n\n【指示】第${nextPartIdx + 1}回の講義を始めてください。論理と公式の厳密性を最優先に、初学者にもわかりやすく解説してください。`;
                    const reply = await callGeminiChat(
                        [{ role: "user", parts: [{ text: nextPrompt }] }],
                        "あなたは予備校の専任プロ講師AIです。論理的で厳密、かつ明快な講義を行ってください。数式は$ $で囲んでください。",
                        { featureId: "lesson_teach" }
                    );
                    const replyText = typeof reply === "string" ? reply : (reply?.message || reply?.reply || JSON.stringify(reply));

                    if (!Array.isArray(lesson.chatHistory)) lesson.chatHistory = [];
                    lesson.chatHistory.push({ role: "divider", content: `第${nextPartIdx + 1}回: ${nextPart.title}` });
                    lesson.chatHistory.push({ role: "assistant", content: replyText, text: replyText });

                    await update(ref(database, `users/${currentUser.uid}/lessons/${activeLessonId}`), {
                        chatHistory: lesson.chatHistory,
                        currentPartIndex: nextPartIdx
                    });

                    renderActiveLessonUI(true);
                    if (window.mToast) mToast(`🎉 第${nextPartIdx + 1}回へ進みました！`);
                    return;
                }

                const history = [{
                    role: "user",
                    parts: [{ text: `あなたは高校・難関大学受験指導の専任プロ講師AIです。以下の授業について生徒と対話してください。\n丁寧かつ簡潔・明瞭に、論理と公式・解法の厳密性を最優先に教えてください。数式は必ず$ $で囲んでください。無駄な前置きや過度な装飾は省いてください。\nテーマ: ${lesson.title}\n受講中パート: 第${currentPartIdx + 1}回「${currentPart.title}」\n講義ノート: ${lesson.lectureNote || lesson.plan || ""}` }]
                }, {
                    role: "model",
                    parts: [{ text: "承知いたしました。どのような疑問点でもご質問ください。" }]
                }, {
                    role: "user",
                    parts: [{ text }]
                }];

                const reply = await callGeminiChat(history, "高校の学習指導エキスパートAIとして、授業内容に関する生徒の質問に分かりやすく丁寧に答えてください。数式は必ず$ $で囲んでください。", { featureId: "lesson_teach" });
                const replyText = typeof reply === "string" ? reply : (reply?.message || reply?.reply || JSON.stringify(reply));

                // チャット履歴に保存
                if (!Array.isArray(lesson.chatHistory)) lesson.chatHistory = [];
                lesson.chatHistory.push({ role: "user", content: text, text });
                lesson.chatHistory.push({ role: "assistant", content: replyText || "", text: replyText || "" });

                await update(ref(database, `users/${currentUser.uid}/lessons/${activeLessonId}`), {
                    chatHistory: lesson.chatHistory
                });

                renderActiveLessonUI(true);
            } catch(e) {
                thinkingEl.textContent = "⚠️ エラー: " + e.message;
            }
        }

        // ==================== 🎓 新規授業作成モーダル & AI3並列生成 ====================
        function getSubjectLearningTrack(subject) {
            if (!subject) return "single";
            const s = String(subject).trim();
            const singleTargets = ["地理", "日本史", "世界史", "歴史", "公共", "公民", "倫政", "倫理", "政治・経済", "現代社会", "社会", "地歴公民", "国語", "現代文", "古文", "漢文"];

            const twoStepTargets = ["英語", "生物", "地学", "情報"];
            if (twoStepTargets.some(t => s.includes(t))) return "two-step";
            return "three-step";

        const TRACK_LEVELS = {

            }
            const topic = document.getElementById("create-topic-input").value.trim();
            const note = document.getElementById("create-note-input").value.trim();

            if (createMode === "topic" && !topic) {
                if (window.mToast) mToast("⚠️ 単元名・テーマを入力してください");
                return;
            }
            if (createMode === "photo" && createSelectedImages.length === 0) {
                if (window.mToast) mToast("⚠️ 写真を選択してください");
                return;
            }

            const btn = document.getElementById("run-create-lesson-btn");
            btn.disabled = true;
            btn.textContent = "⚡ AI3並列で授業を爆速生成中...";

            try {
                let lessonTitle = "";
                let lectureNote = "";
                let parts = [];
                let keyTerms = [];
                let events = [];

                if (createMode === "topic") {
                    let basePrompt = `【教科：${subject}】\n【単元名】${topic}\n【レベル】${level}`;
                    if (track === "single") {
                        basePrompt += `\n【1回完結型の特別指示】歴史・地理・公民・国語の因果関係、背景、重要専門用語、共通テスト・入試頻出ポイントを初学者にも極めて分かりやすく論理的・体系的に網羅してください。数学や理科のような難易度分断ではなく、基礎〜頻出要点を一貫してマスターできる講義にしてください。`;
                    } else if (track === "two-step") {
                        basePrompt += `\n【2段階スマート型の特別指示】現在の目標レベル（${level}）に焦点を当て、要点の理解と実践的な解法を濃縮して解説してください。`;
                    } else {
                        basePrompt += `\n【段階ステップ型の特別指示】現在の目標レベル（${level}）に最適化し、ステップ・バイ・ステップで厳密かつ明快に解説してください。`;
                    }
                    if (note) basePrompt += `\n【生徒からの要望】${note}`;

                    // Engine 1: カリキュラム構成
                    const STRUCTURE_SCHEMA = {
                        type: "OBJECT",
                        properties: {
                            lesson_title: { type: "STRING" },
                            parts: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: { title: { type: "STRING" }, summary: { type: "STRING" } },
                                    required: ["title", "summary"]
                                }
                            }
                        },
                        required: ["lesson_title", "parts"]
                    };

                    let curriculumInstruction = "あなたは予備校のカリキュラム設計AIです。";
                    if (track === "single") {
                        curriculumInstruction += "単元全体（原因・展開・入試頻出要点）を因果関係に沿って網羅する1〜3パートの1回完結カリキュラムを設計してください。難易度分断は行わないでください。";
                    } else if (track === "two-step") {
                        curriculumInstruction += `目標レベル「${level}」に焦点を当て、2〜3パートで要点を濃縮マスターできるカリキュラムを設計してください。`;
                    } else {
                        curriculumInstruction += `目標レベル「${level}」に沿って、生徒が着実に理解できる2〜4パートの論理的カリキュラムを設計してください。`;
                    }

                    // Engine 2: 講義ノート
                    const LECTURE_SCHEMA = {
                        type: "OBJECT",
                        properties: { extracted_text: { type: "STRING" } },
                        required: ["extracted_text"]
                    };

                    // Engine 3: 暗記事項・重要用語
                    const MEMORIZE_SCHEMA = {
                        type: "OBJECT",
                        properties: {
                            key_terms: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: { name: { type: "STRING" }, definition: { type: "STRING" } },
                                    required: ["name", "definition"]
                                }
                            }
                        },
                        required: ["key_terms"]
                    };

                    // 🚀 3並列同時ディスパッチ
                    const [resStructure, resLecture, resMemorize] = await Promise.all([
                        callGeminiJSON([{ text: basePrompt + "\n\nカリキュラム構成をJSONで出力してください。" }], curriculumInstruction, { responseSchema: STRUCTURE_SCHEMA, featureId: "lesson_plan", keyOffset: 0 }),
                        callGeminiJSON([{ text: basePrompt + "\n\n超詳細な講義ノート全文をJSONで出力してください。数式は必ず$ $で囲むこと。" }], "あなたは難関大受験指導のプロ講師です。論理的で厳密、初学者にもわかりやすく深い講義ノート全文を執筆してください。無駄な前置きや過度な装飾は省いてください。", { responseSchema: LECTURE_SCHEMA, featureId: "lesson_plan", keyOffset: 1 }),
                        callGeminiJSON([{ text: basePrompt + "\n\n重要公式・用語リストをJSONで出力してください。" }], "暗記すべき重要公式・用語を抽出してください。", { responseSchema: MEMORIZE_SCHEMA, featureId: "lesson_plan", keyOffset: 2 })
                    ]);

                    lessonTitle = resStructure.lesson_title || `【${subject}】${topic}`;
                    lectureNote = resLecture.extracted_text || "";
                    parts = resStructure.parts || [];
                    keyTerms = resMemorize.key_terms || [];

                } else {
                    // 写真モード
                    const photoPromptParts = [{
                        text: `【教科：${subject}】
【🚨 添付写真のページ順序と連続性の厳守ルール】
・添付された画像は、生徒が教科書のページ順・文章順に指定した【1枚目】から順に並んでいます（全${createSelectedImages.length}枚）。
・写真1の末尾の文章は、写真2の冒頭へと続いています。写真の境界で段落や文が途切れていても、1つの連続した文章・ストーリーとして結合して正確にテキストを抽出し、講義ノート全文と構成をJSONで作成してください。`
                    }];
                    createSelectedImages.forEach(img => {
                        photoPromptParts.push({ inlineData: { mimeType: img.mimeType, data: img.data } });
                    });

                    const PHOTO_SCHEMA = {
                        type: "OBJECT",
                        properties: {
                            lesson_title: { type: "STRING" },
                            extracted_text: { type: "STRING" },
                            parts: {
                                type: "ARRAY",
                                items: {
                                    type: "OBJECT",
                                    properties: { title: { type: "STRING" }, summary: { type: "STRING" } },
                                    required: ["title", "summary"]
                                }
                            }
                        },
                        required: ["lesson_title", "extracted_text", "parts"]
                    };

                    const res = await callGeminiJSON(photoPromptParts, "参考書写真から講義ノート全文を作成してください。", { responseSchema: PHOTO_SCHEMA, featureId: "lesson_plan" });
                    lessonTitle = res.lesson_title || `【${subject}】写真から作成した授業`;
                    lectureNote = res.extracted_text || "";
                    parts = res.parts || [];
                }

                // Firebaseへ保存
                const newLessonId = "LESSON_" + Date.now();
                const newLessonData = {
                    id: newLessonId,
                    title: lessonTitle,
                    topic: topic || lessonTitle,
                    subject,
                    level,
                    lectureNote,
                    parts,
                    keyTerms,
                    events,
                    status: "teaching",
                    createdAt: new Date().toISOString(),
                    chatHistory: []
                };

                await set(ref(database, `users/${currentUser.uid}/lessons/${newLessonId}`), newLessonData);

                createModal.style.display = "none";
                if (window.mToast) mToast("🎉 新しい授業が完成しました！受講を開始します");
                openLesson(newLessonId);

            } catch(e) {
                console.error(e);
                if (window.mToast) mToast("⚠️ 作成エラー: " + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "🚀 AI授業を生成（AI3並列）";
            }
        });

        function formatText(s) {
            if (!s) return "";
            return String(s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/\\n/g, "<br>").replace(/\n/g, "<br>");
        }
        function escapeHtml(s) {
            return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>

</body>
</html>
