<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <title>Flora | AI設定</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
    <link rel="stylesheet" href="style-m.css">

    <style>
        .setting-section {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.1rem;
            margin-bottom: 0.9rem;
            box-shadow: var(--shadow-xs);
        }
        .setting-section-title {
            font-family: var(--font-heading);
            font-size: var(--fs-base);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .setting-section-sub {
            font-size: var(--fs-xs);
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 0.75rem;
        }

        /* キーカード */
        .key-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.6rem;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: 0.45rem;
            font-size: 0.78rem;
            flex-wrap: wrap;
        }
        .key-order-badge {
            font-size: 0.65rem;
            font-weight: 700;
            color: #fff;
            background: var(--brand-primary);
            border-radius: var(--radius-sm);
            padding: 0.1rem 0.4rem;
            flex-shrink: 0;
        }
        .key-label-input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed var(--border-color);
            color: var(--text-primary);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.1rem 0.2rem;
            width: 110px;
            flex-shrink: 0;
        }
        .key-label-input:focus {
            outline: none;
            border-bottom-color: var(--brand-primary);
        }
        .key-text-masked {
            flex-grow: 1;
            font-family: monospace;
            font-size: 0.72rem;
            color: var(--text-secondary);
            min-width: 80px;
        }
        .key-remove-btn {
            background: transparent;
            border: 1px solid #FECACA;
            color: var(--error);
            border-radius: var(--radius-sm);
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key-remove-btn:hover { background: #FEE2E2; }
        .key-empty { font-size: var(--fs-xs); color: var(--text-muted); padding: 0.4rem 0; }

        /* 機能編集カード */
        .feature-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1rem;
            margin-bottom: 0.75rem;
            box-shadow: var(--shadow-xs);
        }
        .feature-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 0.6rem;
        }
        .feature-card-name {
            font-weight: 700;
            font-size: var(--fs-sm);
            color: var(--text-primary);
        }
        .feature-card-page {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }
        .feature-reset-btn {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            padding: 0.2rem 0.5rem;
            font-size: 0.68rem;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
        }

        .chip-group-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            font-weight: 700;
            margin: 0.6rem 0 0.35rem;
        }
        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .chip-toggle {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            padding: 0.3rem 0.6rem;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 120ms;
        }
        .chip-toggle.active {
            background: var(--brand-primary);
            color: #fff;
            border-color: var(--brand-primary);
        }

        /* 優先順位リスト */
        .model-priority-box {
            margin-top: 0.5rem;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.6rem 0.75rem;
        }
        .model-priority-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--brand-primary);
            margin-bottom: 0.4rem;
        }
        .model-priority-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .model-priority-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.35rem 0.55rem;
            font-size: 0.72rem;
        }
        .priority-rank-badge {
            font-weight: 800;
            font-size: 0.68rem;
            padding: 0.1rem 0.4rem;
            border-radius: var(--radius-full);
            background: var(--brand-light);
            color: var(--brand-primary);
            border: 1px solid var(--brand-border);
            margin-right: 0.35rem;
        }
        .priority-model-name {
            font-family: monospace;
            font-weight: 700;
            color: var(--text-primary);
            flex-grow: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .priority-actions {
            display: flex;
            gap: 0.25rem;
            flex-shrink: 0;
        }
        .priority-btn {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            padding: 0.15rem 0.35rem;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
        }
        .priority-btn:hover {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
        }

        /* インポート/エクスポート */
        .io-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .io-btn {
            flex: 1;
            min-width: 130px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            padding: 0.6rem 0.8rem;
            font-weight: 700;
            font-size: var(--fs-xs);
            cursor: pointer;
            text-align: center;
        }
        .io-btn:hover { border-color: var(--brand-primary); color: var(--brand-primary); }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="m-header">
        <button class="m-header-back" onclick="location.href='index.html'">‹</button>
        <span class="m-header-title">⚙️ AI設定</span>
    </header>

    <main class="m-content">

        <!-- 🔑 Gemini APIキー管理 -->
        <div class="setting-section">
            <div class="setting-section-title">✨ Gemini APIキー</div>
            <div class="setting-section-sub">
                キーごとにニックネームを設定できます。端末（localStorage）に安全に保存されます。
            </div>
            <div data-key-list="gemini"></div>
            <div style="display:flex; gap:0.4rem; margin-top:0.6rem;">
                <input type="password" class="m-input" data-key-input="gemini" placeholder="Gemini APIキーを貼り付け..." style="font-size:var(--fs-xs); font-family:monospace;">
                <button class="m-btn m-btn-primary" data-key-add="gemini" style="flex-shrink:0; padding:0.4rem 0.75rem; font-size:var(--fs-xs);">＋ 追加</button>
            </div>
        </div>

        <!-- 🐋 DeepSeek APIキー管理 -->
        <div class="setting-section">
            <div class="setting-section-title">🐋 DeepSeek APIキー</div>
            <div class="setting-section-sub">
                DeepSeek R1 / V3 モデルを使用する場合に登録します。
            </div>
            <div data-key-list="deepseek"></div>
            <div style="display:flex; gap:0.4rem; margin-top:0.6rem;">
                <input type="password" class="m-input" data-key-input="deepseek" placeholder="DeepSeek APIキーを貼り付け..." style="font-size:var(--fs-xs); font-family:monospace;">
                <button class="m-btn m-btn-primary" data-key-add="deepseek" style="flex-shrink:0; padding:0.4rem 0.75rem; font-size:var(--fs-xs);">＋ 追加</button>
            </div>
        </div>

        <!-- 🎯 機能ごとのモデル & 優先順位割り当て -->
        <div class="setting-section">
            <div class="setting-section-title">🎯 機能ごとのモデル割り当て & 優先順位</div>
            <div class="setting-section-sub">
                使用するモデルのON/OFFや、「↑」「↓」でフォールバック順（第1候補 → 第2候補...）を自由にカスタマイズできます。
            </div>
            <div data-feature-card-grid></div>
        </div>

        <!-- 📦 設定のインポート/エクスポート -->
        <div class="setting-section">
            <div class="setting-section-title">📦 設定のバックアップ & 復元</div>
            <div class="setting-section-sub">
                APIキーと機能割り当て設定をJSONファイルで保存・復元できます。
            </div>
            <div class="io-row">
                <button type="button" class="io-btn" id="io-export-btn">📤 設定をエクスポート</button>
                <button type="button" class="io-btn" id="io-import-btn">📥 設定をインポート</button>
                <input type="file" id="io-import-file" accept="application/json,.json" style="display:none;">
            </div>
        </div>

        <!-- PC版切り替え -->
        <div class="setting-section text-center">
            <a href="../index.html" class="m-btn m-btn-full" style="text-decoration:none;">
                💻 PC版ダッシュボードを開く
            </a>
        </div>

    </main>

    <!-- ボトムナビ -->
    <script src="bottom-nav.js"></script>

    <script type="module">
        import {
            getGeminiKeys, getDeepseekKeys, addKey, removeKey, getKeyLabel, setKeyLabel,
            GEMINI_FEATURES, GEMINI_MODEL_FALLBACK_LIST,
            getFeatureAssignment, setFeatureAssignment, resetFeatureAssignment,
            initApiKeyManager, exportAISettings, importAISettings
        } from "../api-key-manager.js";

        initApiKeyManager({ needGemini: true, needDeepseek: false });

        const ENGINE_LABEL = { gemini: "✨ Gemini", deepseek: "🐋 DeepSeek" };

        function maskKey(key) {
            if (!key) return "";
            if (key.length <= 8) return key[0] + "•••" + key.slice(-2);
            return key.slice(0, 4) + "••••••••" + key.slice(-4);
        }

        function keysFor(engine) {
            return engine === "gemini" ? getGeminiKeys() : getDeepseekKeys();
        }

        function keyDisplayLabel(key) {
            const label = getKeyLabel("gemini", key);
            return label ? `${label}（${maskKey(key)}）` : maskKey(key);
        }

        // ==================== 🔑 キー一覧描画 ====================
        function renderKeyList(engine) {
            const listEl = document.querySelector(`[data-key-list="${engine}"]`);
            if (!listEl) return;
            const keys = keysFor(engine);
            if (keys.length === 0) {
                listEl.innerHTML = `<div class="key-empty">まだ${ENGINE_LABEL[engine]}のキーが登録されていません。</div>`;
                return;
            }
            listEl.innerHTML = keys.map((k, i) => `
                <div class="key-row">
                    <span class="key-order-badge">${i === 0 ? "優先 #1" : `#${i + 1}`}</span>
                    <input type="text" class="key-label-input" data-key-label="${engine}:${i}" placeholder="ニックネーム" value="${(getKeyLabel(engine, k) || "").replace(/"/g, "&quot;")}">
                    <span class="key-text-masked">${maskKey(k)}</span>
                    <button type="button" class="key-remove-btn" data-key-remove="${engine}:${i}" title="削除">×</button>
                </div>
            `).join("");
        }

        function renderAllKeyLists() {
            renderKeyList("gemini");
            renderKeyList("deepseek");
        }

        document.addEventListener("click", (e) => {
            const removeBtn = e.target.closest("[data-key-remove]");
            if (removeBtn) {
                const [engine, idxStr] = removeBtn.getAttribute("data-key-remove").split(":");
                const idx = parseInt(idxStr, 10);
                const keys = keysFor(engine);
                const targetKey = keys[idx];
                if (targetKey && !confirm(`${ENGINE_LABEL[engine]}のキー「${maskKey(targetKey)}」を削除しますか？`)) return;
                removeKey(engine, idx);
                renderAllKeyLists();
                renderFeatureCards();
                if (window.mToast) mToast("キーを削除しました");
                return;
            }

            const addBtn = e.target.closest("[data-key-add]");
            if (addBtn) {
                const engine = addBtn.getAttribute("data-key-add");
                const input = document.querySelector(`[data-key-input="${engine}"]`);
                if (input && input.value.trim()) {
                    addKey(engine, input.value.trim());
                    input.value = "";
                    renderAllKeyLists();
                    renderFeatureCards();
                    if (window.mToast) mToast(`✅ ${ENGINE_LABEL[engine]}のキーを追加しました`);
                }
                return;
            }

            // モデルチップのトグル
            const modelChip = e.target.closest("[data-model-chip]");
            if (modelChip) {
                const featureId = modelChip.getAttribute("data-model-chip");
                const model = modelChip.getAttribute("data-model");
                const entry = getFeatureAssignment(featureId);
                let models = (entry.models && entry.models.length > 0)
                    ? [...entry.models]
                    : [...GEMINI_MODEL_FALLBACK_LIST];

                if (models.includes(model)) {
                    models = models.filter(m => m !== model);
                } else {
                    models.push(model);
                }

                setFeatureAssignment(featureId, { models });
                renderFeatureCards();
                return;
            }

            // モデル優先順位の移動・削除
            const moveBtn = e.target.closest("[data-model-move]");
            if (moveBtn) {
                const [featureId, idxStr, dir] = moveBtn.getAttribute("data-model-move").split(":");
                const idx = parseInt(idxStr, 10);
                const entry = getFeatureAssignment(featureId);
                let models = (entry.models && entry.models.length > 0)
                    ? [...entry.models]
                    : [...GEMINI_MODEL_FALLBACK_LIST];

                if (dir === "up" && idx > 0) {
                    const temp = models[idx - 1];
                    models[idx - 1] = models[idx];
                    models[idx] = temp;
                } else if (dir === "down" && idx < models.length - 1) {
                    const temp = models[idx + 1];
                    models[idx + 1] = models[idx];
                    models[idx] = temp;
                } else if (dir === "remove") {
                    models.splice(idx, 1);
                }

                setFeatureAssignment(featureId, { models });
                renderFeatureCards();
                return;
            }

            // キー割り当てチップのトグル
            const keyChip = e.target.closest("[data-key-chip]");
            if (keyChip) {
                const featureId = keyChip.getAttribute("data-key-chip");
                const key = keyChip.getAttribute("data-key");
                const entry = getFeatureAssignment(featureId);
                let keys = [...(entry.keys || [])];

                if (keys.includes(key)) {
                    keys = keys.filter(k => k !== key);
                } else {
                    keys.push(key);
                }

                setFeatureAssignment(featureId, { keys });
                renderFeatureCards();
                return;
            }

            // デフォルトリセットボタン
            const resetBtn = e.target.closest("[data-feature-reset]");
            if (resetBtn) {
                const featureId = resetBtn.getAttribute("data-feature-reset");
                resetFeatureAssignment(featureId);
                renderFeatureCards();
                if (window.mToast) mToast("デフォルト設定に戻しました");
                return;
            }
        });

        document.addEventListener("change", (e) => {
            if (e.target.matches("[data-key-label]")) {
                const [engine, idxStr] = e.target.getAttribute("data-key-label").split(":");
                const keys = keysFor(engine);
                const key = keys[parseInt(idxStr, 10)];
                if (key) {
                    setKeyLabel(engine, key, e.target.value);
                    renderFeatureCards();
                }
            }
        });

        // ==================== 🎯 機能編集カード描画 ====================
        function renderFeatureCards() {
            const grid = document.querySelector("[data-feature-card-grid]");
            if (!grid) return;
            const allGeminiKeys = getGeminiKeys();

            grid.innerHTML = GEMINI_FEATURES.map(f => {
                const entry = getFeatureAssignment(f.id);
                const isCustomModels = entry.models && entry.models.length > 0;
                const isCustomKeys = entry.keys && entry.keys.length > 0;
                const isCustom = isCustomModels || isCustomKeys;

                const activeModels = isCustomModels ? entry.models : GEMINI_MODEL_FALLBACK_LIST;
                const activeKeys = entry.keys || [];

                // モデルトグルチップ
                const modelChipsHtml = GEMINI_MODEL_FALLBACK_LIST.map(m => {
                    const active = activeModels.includes(m);
                    return `<button type="button" class="chip-toggle ${active ? 'active' : ''}" data-model-chip="${f.id}" data-model="${m}">${m}</button>`;
                }).join("");

                // 優先順位リスト（↑ / ↓ / ×）
                let priorityListHtml = "";
                if (activeModels.length === 0) {
                    priorityListHtml = `<div style="font-size:0.72rem; color:var(--error); padding:0.2rem 0;">⚠️ モデルが選択されていません</div>`;
                } else {
                    priorityListHtml = activeModels.map((m, idx) => `
                        <div class="model-priority-item">
                            <span class="priority-rank-badge">#${idx + 1}</span>
                            <span class="priority-model-name">${m}</span>
                            <div class="priority-actions">
                                <button type="button" class="priority-btn" data-model-move="${f.id}:${idx}:up" ${idx === 0 ? 'disabled style="opacity:0.3;"' : ''} title="優先度を上げる">↑</button>
                                <button type="button" class="priority-btn" data-model-move="${f.id}:${idx}:down" ${idx === activeModels.length - 1 ? 'disabled style="opacity:0.3;"' : ''} title="優先度を下げる">↓</button>
                                <button type="button" class="priority-btn" data-model-move="${f.id}:${idx}:remove" title="除外" style="color:var(--error);">×</button>
                            </div>
                        </div>
                    `).join("");
                }

                // キー選択チップ
                let keyChipsHtml = "";
                if (allGeminiKeys.length === 0) {
                    keyChipsHtml = `<div style="font-size:0.72rem; color:var(--text-muted); padding:0.2rem 0;">まだキーが登録されていません</div>`;
                } else {
                    keyChipsHtml = allGeminiKeys.map(k => {
                        const active = activeKeys.includes(k);
                        return `<button type="button" class="chip-toggle ${active ? 'active' : ''}" data-key-chip="${f.id}" data-key="${k}">${keyDisplayLabel(k)}</button>`;
                    }).join("");
                }

                return `
                    <div class="feature-card" id="feature-${f.id}">
                        <div class="feature-card-header">
                            <div>
                                <div class="feature-card-name">${f.label}</div>
                                <div class="feature-card-page">画面: ${f.page}</div>
                            </div>
                            ${isCustom ? `<button type="button" class="feature-reset-btn" data-feature-reset="${f.id}">デフォルトに戻す</button>` : ''}
                        </div>

                        <div class="chip-group-label">🤖 使用モデル（選択で追加/削除）:</div>
                        <div class="chip-row">${modelChipsHtml}</div>

                        <div class="model-priority-box">
                            <div class="model-priority-title">⚡ 実行優先順（フォールバック順）:</div>
                            <div class="model-priority-list">${priorityListHtml}</div>
                        </div>

                        <div class="chip-group-label" style="margin-top:0.6rem;">🔑 使用キー（未選択＝全キー対象）:</div>
                        <div class="chip-row">${keyChipsHtml}</div>
                    </div>
                `;
            }).join("");
        }

        // ==================== 📦 インポート/エクスポート ====================
        const exportBtn = document.getElementById("io-export-btn");
        const importBtn = document.getElementById("io-import-btn");
        const importFileInput = document.getElementById("io-import-file");

        if (exportBtn) {
            exportBtn.addEventListener("click", () => {
                const jsonStr = exportAISettings();
                const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                const yyyymmdd = new Date().toISOString().slice(0, 10).replace(/-/g, "");
                a.href = url;
                a.download = `flora-ai-settings-${yyyymmdd}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                if (window.mToast) mToast("📤 設定を書き出しました");
            });
        }

        if (importBtn && importFileInput) {
            importBtn.addEventListener("click", () => importFileInput.click());
            importFileInput.addEventListener("change", (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const count = importAISettings(evt.target.result);
                        renderAllKeyLists();
                        renderFeatureCards();
                        if (window.mToast) mToast(`📥 設定を復元しました（キー${count}件）`);
                    } catch (err) {
                        alert("設定ファイルの読み込みに失敗しました: " + err.message);
                    }
                };
                reader.readAsText(file);
                importFileInput.value = "";
            });
        }

        renderAllKeyLists();
        renderFeatureCards();
    </script>
</body>
</html>
