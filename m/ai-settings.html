<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <title>Flora | AI設定</title>
    <link rel="stylesheet" href="style-m.css">

    <style>
        .setting-section {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.2rem;
            margin-bottom: 0.8rem;
            box-shadow: var(--shadow-xs);
        }
        .setting-section-title {
            font-family: var(--font-heading);
            font-size: var(--fs-base);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .key-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.6rem;
            background: var(--bg-subtle);
            border-radius: var(--radius-sm);
            margin-bottom: 0.4rem;
            font-size: 0.8rem;
        }
        .key-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; }

        .feature-setting-card {
            padding: 0.8rem;
            background: var(--bg-subtle);
            border-radius: var(--radius-md);
            margin-bottom: 0.5rem;
        }
        .feature-name {
            font-weight: 700;
            font-size: var(--fs-sm);
            margin-bottom: 0.35rem;
        }
        .priority-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.5rem;
            background: var(--bg-surface);
            border-radius: var(--radius-sm);
            margin-bottom: 0.25rem;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="m-header">
        <button class="m-header-back" onclick="location.href='index.html'">‹</button>
        <span class="m-header-title">⚙️ AI設定</span>
    </header>

    <main class="m-content">

        <!-- APIキー管理 -->
        <div class="setting-section">
            <div class="setting-section-title">🔑 Gemini APIキー</div>
            <p style="font-size:var(--fs-xs); color:var(--text-muted); margin-bottom:0.6rem;">
                キーはこの端末のブラウザ（localStorage）に安全に保存されます。
            </p>
            <div id="key-list-gemini"></div>
            <div style="display:flex; gap:0.4rem; margin-top:0.5rem;">
                <input type="password" class="m-input" id="new-key-input" placeholder="新しいAPIキーを貼り付け..." style="font-size:var(--fs-xs);">
                <button class="m-btn m-btn-primary" id="add-key-btn" style="flex-shrink:0; padding:0.4rem 0.8rem; font-size:var(--fs-xs);">＋ 追加</button>
            </div>
        </div>

        <!-- 機能別モデル設定 -->
        <div class="setting-section">
            <div class="setting-section-title">🎯 機能ごとのモデル設定</div>
            <p style="font-size:var(--fs-xs); color:var(--text-muted); margin-bottom:0.6rem;">
                フォールバック順（第1候補 → 第2候補...）に従って自動実行されます。
            </p>
            <div id="features-container"></div>
        </div>

        <!-- PC版切り替え -->
        <div class="setting-section text-center">
            <a href="../index.html" class="m-btn m-btn-full" style="text-decoration:none;">
                💻 PC版ダッシュボードを開く
            </a>
        </div>

    </main>

    <!-- ボトムナビ -->
    <script src="bottom-nav.js"></script>

    <script type="module">
        import {
            getGeminiKeys, addKey, removeKey,
            GEMINI_FEATURES, getEffectiveModelList,
            getFeatureAssignment, setFeatureAssignment, resetFeatureAssignment,
            initApiKeyManager
        } from "../api-key-manager.js";

        initApiKeyManager({ needGemini: true, needDeepseek: false });

        function maskKey(k) {
            if (!k) return "";
            if (k.length <= 8) return k.slice(0, 2) + "•••" + k.slice(-2);
            return k.slice(0, 4) + "••••••••" + k.slice(-4);
        }

        // キー一覧描画
        function renderKeys() {
            const listEl = document.getElementById("key-list-gemini");
            const keys = getGeminiKeys();
            if (keys.length === 0) {
                listEl.innerHTML = `<div class="text-muted" style="font-size:0.75rem;">キーがまだ登録されていません。</div>`;
                return;
            }
            listEl.innerHTML = keys.map((k, i) => `
                <div class="key-row">
                    <span class="m-subject-badge subj-数学" style="font-size:0.65rem;">#${i + 1}</span>
                    <span>${maskKey(k)}</span>
                    <button class="m-btn m-btn-danger" data-remove-key="${i}" style="padding:0.15rem 0.4rem; font-size:0.65rem; min-height:24px;">✕</button>
                </div>
            `).join("");

            listEl.querySelectorAll("[data-remove-key]").forEach(btn => {
                btn.onclick = () => {
                    removeKey("gemini", parseInt(btn.dataset.removeKey, 10));
                    renderKeys();
                    if (window.mToast) mToast("キーを削除しました");
                };
            });
        }

        document.getElementById("add-key-btn")?.addEventListener("click", () => {
            const input = document.getElementById("new-key-input");
            const val = input.value.trim();
            if (!val) return;
            addKey("gemini", val);
            input.value = "";
            renderKeys();
            if (window.mToast) mToast("✅ キーを追加しました");
        });

        // 機能一覧描画
        function renderFeatures() {
            const container = document.getElementById("features-container");
            container.innerHTML = GEMINI_FEATURES.map(f => {
                const list = getEffectiveModelList(f.id);
                return `
                    <div class="feature-setting-card">
                        <div class="feature-name">${f.label}</div>
                        <div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:0.35rem;">
                            優先順: ${list.slice(0, 2).join(" → ")}${list.length > 2 ? ' ...' : ''}
                        </div>
                    </div>
                `;
            }).join("");
        }

        renderKeys();
        renderFeatures();
    </script>

</body>
</html>
