<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <title>Flora | 問題演習</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
    <link rel="stylesheet" href="style-m.css">

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                macros: { fbox: ["\\bbox[2px,border:1px solid]{#1}", 1] }
            },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
            chtml: { displayAlign: 'left' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>

    <style>
        /* 問題画面固有 */
        .problem-section {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .problem-section-label {
            font-size: var(--fs-xs);
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.4rem;
        }

        .problem-text {
            font-size: var(--fs-base);
            line-height: 1.75;
            color: var(--text-primary);
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .problem-images {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.5rem 0;
            -webkit-overflow-scrolling: touch;
        }
        .problem-images img {
            height: 180px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        /* 自己採点ボタン */
        .judge-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
        .judge-btn {
            flex: 1;
            padding: 0.9rem;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: var(--bg-surface);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            min-height: 52px;
            text-align: center;
        }
        .judge-btn:active { transform: scale(0.96); }
        .judge-btn.correct { border-color: var(--success); color: var(--success); }
        .judge-btn.correct.selected { background: var(--success); color: #fff; }
        .judge-btn.wrong { border-color: var(--error); color: var(--error); }
        .judge-btn.wrong.selected { background: var(--error); color: #fff; }

        /* 模範解答・アコーディオン */
        .reveal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            width: 100%;
            padding: 0.7rem;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-subtle);
            color: var(--text-secondary);
            font-size: var(--fs-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            min-height: 44px;
        }
        .reveal-btn:active { background: var(--brand-light); }

        .model-answer-box {
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            font-size: var(--fs-sm);
            line-height: 1.8;
            margin-top: 0.5rem;
        }

        /* AIチャットセクション */
        .chat-messages {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding: 0.5rem 0;
        }
        .chat-bubble {
            padding: 0.65rem 0.95rem;
            border-radius: 18px;
            font-size: 0.92rem;
            line-height: 1.6;
            width: fit-content;
            max-width: 85%;
            word-break: break-word;
            overflow-wrap: break-word;
            line-break: strict;
            white-space: pre-line;
            box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }
        .chat-bubble.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #10B981, #059669);
            color: #ffffff;
            border-bottom-right-radius: 4px;
            margin-left: auto;
        }
        .chat-bubble.ai {
            align-self: flex-start;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            margin-right: auto;
        }
        .chat-input-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .chat-input-row input {
            flex: 1;
        }

        /* 気づきメモ */
        .insight-textarea {
            width: 100%;
            min-height: 80px;
            padding: 0.65rem 0.9rem;
            font-size: var(--fs-sm);
            font-family: var(--font-base);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-surface);
            color: var(--text-primary);
            outline: none;
            resize: vertical;
        }
        .insight-textarea:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12);
        }

        /* ステータスバッジ */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.2rem 0.6rem;
            font-size: 0.68rem;
            font-weight: 700;
            border-radius: var(--radius-full);
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="m-header">
        <button class="m-header-back" onclick="location.href='index.html'">‹</button>
        <span class="m-header-title tex2jax_process" id="header-title" style="max-width:72vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">問題演習</span>
    </header>

    <!-- ログイン案内 -->
    <div id="login-notice" class="m-content" style="display:none;">
        <div class="m-empty-state" style="margin-top:3rem;">
            <div class="m-empty-state-icon">🔒</div>
            <div class="m-empty-state-title">ログインが必要です</div>
            <button id="main-login-btn" class="m-btn m-btn-primary" style="margin-top:1rem;">Googleでログイン</button>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <main id="main-content" class="m-content" style="display:none;">

        <!-- 問題文 -->
        <div class="problem-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; flex-wrap:wrap; gap:0.4rem;">
                <div class="problem-section-label" style="margin-bottom:0;">📝 問題文</div>
                <div style="display:flex; gap:0.4rem;">
                    <button type="button" id="m-reread-ocr-btn" class="m-btn" style="padding:0.25rem 0.6rem; font-size:0.75rem; min-height:30px; background:var(--bg-subtle);">
                        🔄 再読取
                    </button>
                    <button type="button" id="m-edit-text-btn" class="m-btn" style="padding:0.25rem 0.6rem; font-size:0.75rem; min-height:30px; background:var(--bg-subtle);">
                        ✏️ 編集
                    </button>
                </div>
            </div>
            <div class="problem-text" id="problem-text">読み込み中...</div>
            <div class="problem-images" id="problem-images"></div>
        </div>

        <!-- 罠 & 定石パターン（折りたたみ） -->
        <div class="problem-section">
            <button class="reveal-btn" id="trap-reveal-btn" onclick="toggleSection('trap-body')">
                ⚠️ 罠＆定石パターンを見る
            </button>
            <div id="trap-body" style="display:none;margin-top:0.5rem;">
                <div class="problem-section-label" style="margin-top:0.5rem;">⚠️ 罠ポイント</div>
                <div class="problem-text" id="trap-text"></div>
                <div class="problem-section-label" style="margin-top:0.75rem;">🧭 定石パターン</div>
                <div class="problem-text" id="strategy-text"></div>
            </div>
        </div>

        <!-- 模範解答（折りたたみ） -->
        <div class="problem-section">
            <button class="reveal-btn" id="answer-reveal-btn" onclick="toggleSection('answer-body')">
                📖 模範解答を見る
            </button>
            <div id="answer-body" style="display:none;margin-top:0.5rem;">
                <div class="model-answer-box" id="model-answer-text"></div>
                <div id="answer-action-box" style="margin-top:0.75rem; text-align:center;">
                    <button class="m-btn m-btn-primary" id="btn-generate-answer" style="width:100%;">
                        🔄 AIに解説・定石を再生成してもらう
                    </button>
                </div>
            </div>
        </div>

        <!-- 自己採点 -->
        <div class="problem-section">
            <div class="problem-section-label">✅ 自己採点</div>
            <div class="judge-row">
                <button class="judge-btn wrong" id="btn-wrong" onclick="judgeResult(false)">❌ 間違えた</button>
                <button class="judge-btn correct" id="btn-correct" onclick="judgeResult(true)">🎉 合ってた</button>
            </div>
            <div id="judge-feedback" style="margin-top:0.5rem;font-size:var(--fs-sm);color:var(--text-secondary);text-align:center;"></div>
        </div>

        <!-- 気づきメモ -->
        <div class="problem-section">
            <div class="problem-section-label">🧠 気づき・極意メモ</div>
            <textarea class="insight-textarea" id="insight-input" placeholder="この問題の核心を自分の言葉でメモ..."></textarea>
            <button class="m-btn m-btn-primary" style="margin-top:0.5rem;width:100%;" onclick="saveInsight()">💾 メモ保存</button>
        </div>

        <!-- AIチャット -->
        <div class="problem-section">
            <div class="problem-section-label">🤖 AIに質問</div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" class="m-input" id="chat-input" placeholder="この問題について質問..." style="font-size:var(--fs-sm);">
                <button class="m-btn m-btn-primary" onclick="sendChatMessage()">送信</button>
            </div>
        </div>

        <!-- 問題削除エリア -->
        <div class="problem-section" style="border-color:#FCA5A5; background:#FEF2F2; text-align:center; margin-top:1.5rem;">
            <button class="m-btn m-btn-danger" id="btn-delete-problem" style="width:100%; font-weight:700;">
                🗑️ この問題を完全に削除する
            </button>
            <p style="font-size:0.72rem; color:#DC2626; margin-top:0.4rem; margin-bottom:0;">
                ※削除すると問題データ、写真、質問履歴が完全に抹消されます。
            </p>
        </div>

        <!-- 問題文編集・再読み取りモーダル -->
        <div id="m-edit-modal" style="display:none; position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,0.6); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); align-items:flex-end; justify-content:center;">
            <div style="width:100%; max-width:600px; max-height:92vh; background:var(--bg-surface); border-top-left-radius:var(--radius-xl, 20px); border-top-right-radius:var(--radius-xl, 20px); display:flex; flex-direction:column; overflow:hidden; box-shadow:0 -10px 25px rgba(0,0,0,0.2);">
                <div style="padding:0.9rem 1.1rem; border-bottom:1px solid var(--border-color); display:flex; justify-content:space-between; align-items:center; background:var(--bg-subtle);">
                    <div style="font-weight:700; font-size:0.95rem; color:var(--text-primary); display:flex; align-items:center; gap:0.4rem;">
                        <span>✏️ 問題文の編集・再読み取り</span>
                    </div>
                    <button type="button" id="m-edit-modal-close" style="background:none; border:none; font-size:1.4rem; color:var(--text-muted); cursor:pointer; line-height:1;">×</button>
                </div>
                
                <div style="padding:1rem; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:0.85rem;">
                    <!-- 再読み取りボタン -->
                    <div style="background:var(--bg-subtle); padding:0.75rem; border-radius:var(--radius-md); border:1px solid var(--border-color);">
                        <button type="button" id="m-modal-run-ocr" class="m-btn m-btn-primary" style="width:100%; min-height:40px; font-size:0.85rem; font-weight:700;">
                            🔄 写真からAIで再読み取り（OCR）
                        </button>
                        <div id="m-ocr-status" style="display:none; font-size:0.75rem; color:var(--brand-primary); margin-top:0.4rem; text-align:center; font-weight:600;"></div>
                    </div>

                    <!-- 問題名入力 -->
                    <div>
                        <label style="font-size:0.75rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:0.25rem;">問題名（短縮タイトル）</label>
                        <input type="text" id="m-edit-short-title" class="m-input" style="width:100%; font-size:0.85rem; padding:0.5rem;" placeholder="例: 円の方程式と接線">
                    </div>

                    <!-- 問題文入力 -->
                    <div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.25rem;">
                            <label style="font-size:0.75rem; font-weight:700; color:var(--text-muted);">問題文本文（数式は $ ... $ で囲む）</label>
                        </div>

                        <!-- クイック記号挿入バー -->
                        <div id="m-quick-insert-bar" style="display:flex; gap:0.3rem; overflow-x:auto; padding-bottom:0.35rem; margin-bottom:0.35rem;">
                            <button type="button" class="m-btn" style="padding:0.2rem 0.5rem; font-size:0.75rem; min-height:28px;" data-m-insert="$|$">$...$</button>
                            <button type="button" class="m-btn" style="padding:0.2rem 0.5rem; font-size:0.75rem; min-height:28px;" data-m-insert="$$|$$">$$...$$</button>
                            <button type="button" class="m-btn" style="padding:0.2rem 0.5rem; font-size:0.75rem; min-height:28px;" data-m-insert="\frac{|{}}{}">\frac</button>
                            <button type="button" class="m-btn" style="padding:0.2rem 0.5rem; font-size:0.75rem; min-height:28px;" data-m-insert="\sqrt{|}">\sqrt</button>
                            <button type="button" class="m-btn" style="padding:0.2rem 0.5rem; font-size:0.75rem; min-height:28px;" data-m-insert="^{|}">x^2</button>
                            <button type="button" class="m-btn" style="padding:0.2rem 0.5rem; font-size:0.75rem; min-height:28px;" data-m-insert="_{|}">x_n</button>
                            <button type="button" class="m-btn" style="padding:0.2rem 0.5rem; font-size:0.75rem; min-height:28px;" data-m-insert="\pi">\pi</button>
                            <button type="button" class="m-btn" style="padding:0.2rem 0.5rem; font-size:0.75rem; min-height:28px;" data-m-insert="\theta">\theta</button>
                            <button type="button" class="m-btn" style="padding:0.2rem 0.5rem; font-size:0.75rem; min-height:28px;" data-m-insert="\leqq">\leqq</button>
                            <button type="button" class="m-btn" style="padding:0.2rem 0.5rem; font-size:0.75rem; min-height:28px;" data-m-insert="\geqq">\geqq</button>
                        </div>

                        <textarea id="m-edit-text-input" class="insight-textarea" style="min-height:140px; font-size:0.9rem; line-height:1.6;" placeholder="問題文を入力..."></textarea>
                    </div>

                    <!-- リアルタイム数式プレビュー -->
                    <div>
                        <label style="font-size:0.75rem; font-weight:700; color:var(--text-muted); display:block; margin-bottom:0.25rem;">数式プレビュー</label>
                        <div id="m-edit-preview" class="problem-text tex2jax_process" style="background:var(--bg-subtle); padding:0.75rem; border-radius:var(--radius-md); border:1px solid var(--border-color); min-height:60px; max-height:160px; overflow-y:auto; font-size:0.85rem;"></div>
                    </div>
                </div>

                <div style="padding:0.85rem 1rem; border-top:1px solid var(--border-color); display:flex; gap:0.5rem; background:var(--bg-subtle);">
                    <button type="button" id="m-edit-cancel" class="m-btn" style="flex:1;">キャンセル</button>
                    <button type="button" id="m-edit-save" class="m-btn m-btn-primary" style="flex:2; font-weight:700;">💾 保存して反映</button>
                </div>
            </div>
        </div>

    </main>

    <!-- ボトムナビ -->
    <script src="bottom-nav.js"></script>

    <script>
        // セクション開閉
        function toggleSection(id) {
            const el = document.getElementById(id);
            if (!el) return;
            const isHidden = el.style.display === 'none';
            el.style.display = isHidden ? 'block' : 'none';
            // MathJax再レンダリング
            if (isHidden && window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([el]).catch(() => {});
            }
        }
    </script>

    <script type="module">
        import { initApiKeyManager, showToast, callGeminiChat, callGeminiJSON, getGeminiKeys } from "../api-key-manager.js?v=3.5";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithEmailAndPassword, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, get, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55MdhpjJizQaLEdRu-XhBVJ4PqrHsAyY",
            authDomain: "buturi-2449e.firebaseapp.com",
            databaseURL: "https://buturi-2449e-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "buturi-2449e",
            storageBucket: "buturi-2449e.appspot.com",
            messagingSenderId: "976306696124",
            appId: "1:976306696124:web:e455c1953544bff5c345b9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const provider = new GoogleAuthProvider();
        initApiKeyManager({ needGemini: true, needDeepseek: false });

        const PROBLEM_ID = new URLSearchParams(location.search).get('id');
        // PC版リンクにIDを引き継ぐ
        const pcLink = document.getElementById('pc-link');
        if (pcLink && PROBLEM_ID) pcLink.href = `../problem.html?id=${PROBLEM_ID}`;

        let currentUser = null;
        let currentProblem = null;
        let chatHistory = [];

        // ==================== 認証 ====================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById("login-notice").style.display = "none";
                document.getElementById("main-content").style.display = "block";
                if (PROBLEM_ID) loadProblem(user.uid, PROBLEM_ID);
                else {
                    document.getElementById("problem-text").textContent = "問題IDが指定されていません。ダッシュボードから問題を選んでください。";
                }
            } else {
                document.getElementById("login-notice").style.display = "block";
                document.getElementById("main-content").style.display = "none";
            }
        });

        document.getElementById("main-login-btn").addEventListener("click", () => {
            signInWithPopup(auth, provider).catch(e => console.error(e));
        });

        // テスターログイン
        window.floraTestLogin = async function() {
            try { await signInWithEmailAndPassword(auth, "tester@flora.local", "flora1234"); } catch(e) {}
        };
        if (new URLSearchParams(location.search).has("autologin")) {
            setTimeout(() => { if (!auth.currentUser) window.floraTestLogin(); }, 500);
        }

        // ==================== 問題読み込み ====================
        async function loadProblem(uid, pid) {
            try {
                const snap = await get(ref(database, `users/${uid}/problems/${pid}`));
                const p = snap.val();
                if (!p) {
                    document.getElementById("problem-text").textContent = "問題データが見つかりませんでした。";
                    return;
                }
                currentProblem = { ...p, id: pid };

                // ヘッダータイトル更新（数式対応）
                const headerTitleEl = document.getElementById("header-title");
                headerTitleEl.innerHTML = formatMathTitle(p.short_title || p.title || "問題演習");

                // 問題文
                const problemTextEl = document.getElementById("problem-text");
                problemTextEl.innerHTML = formatText(p.title || p.extracted_text || "問題文なし");

                // 画像
                const imagesEl = document.getElementById("problem-images");
                imagesEl.innerHTML = "";
                // まず新形式（problemImages）を試行、なければ旧形式
                let images = [];
                if (p.thumb) {
                    try {
                        const imgSnap = await get(ref(database, `users/${uid}/problemImages/${pid}`));
                        const imgData = imgSnap.val();
                        if (imgData && imgData.images) images = imgData.images;
                    } catch(e) {}
                    if (images.length === 0) images = [p.thumb]; // フル画像取得失敗時はサムネイルでも表示
                } else if (Array.isArray(p.images) && p.images.length > 0) {
                    images = p.images;
                } else if (p.imageData) {
                    images = [p.imageData];
                }
                currentProblem.loadedImages = images;
                images.forEach(src => {
                    const img = document.createElement("img");
                    img.src = src;
                    img.loading = "lazy";
                    imagesEl.appendChild(img);
                });

                // 罠 & 定石（多様なキー名に対応）
                const trapContent = p.trap_description || p.trapDescription || p.trap || "";
                const stratContent = p.strategy_pattern || p.strategyPattern || p.strategy || "";
                document.getElementById("trap-text").innerHTML = trapContent ? formatText(trapContent) : '<span style="color:var(--text-muted); font-size:var(--fs-sm);">まだ罠データがありません</span>';
                document.getElementById("strategy-text").innerHTML = stratContent ? formatText(stratContent) : '<span style="color:var(--text-muted); font-size:var(--fs-sm);">まだ定石データがありません</span>';

                // 模範解答（PC版 answerFormula や model_answer、explanation、answer など全対応）
                const answerContent = p.model_answer || p.answerFormula || p.explanation || p.answer || p.solution || "";
                const generateBtn = document.getElementById("btn-generate-answer");

                if (answerContent && answerContent.trim() !== "") {
                    document.getElementById("model-answer-text").innerHTML = formatText(answerContent);
                    if (generateBtn) {
                        generateBtn.textContent = "🔄 AIに解説・定石を再生成してもらう";
                        generateBtn.onclick = () => {
                            if (confirm("現在の模範解答・定石・罠をAIで再生成して上書きしますか？")) {
                                generateModelAnswer(uid, pid, p);
                            }
                        };
                    }
                } else {
                    document.getElementById("model-answer-text").innerHTML = '<span style="color:var(--text-muted); font-size:var(--fs-sm);">模範解答データがまだ登録されていません。</span>';
                    if (generateBtn) {
                        generateBtn.textContent = "✨ AIに模範解答・定石を生成してもらう";
                        generateBtn.onclick = () => generateModelAnswer(uid, pid, p);
                    }
                }

                // 気づきメモ
                const insightInput = document.getElementById("insight-input");
                if (p.insight) insightInput.value = p.insight;

                // MathJax レンダリング（ヘッダーとコンテンツ全体）
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([headerTitleEl, document.getElementById("main-content")]).catch(() => {});
                }

                // AIチャット用コンテキスト初期化
                chatHistory = [{
                    role: "user",
                    parts: [{ text: `以下の問題について、生徒から質問があったら丁寧に答えてください。\n\n問題: ${p.title || p.extracted_text || ""}\n\n模範解答: ${answerContent || ""}` }]
                }, {
                    role: "model",
                    parts: [{ text: "この問題について理解しました。何でも質問してください！" }]
                }];

            } catch (e) {
                console.error("問題読み込み失敗:", e);
                document.getElementById("problem-text").textContent = "読み込みエラー: " + e.message;
            }
        }

        // ==================== 問題削除 ====================
        document.getElementById("btn-delete-problem")?.addEventListener("click", async () => {
            if (!currentUser || !PROBLEM_ID) return;

            const confirmDelete = confirm(
                "⚠️ 本当にこの問題を削除しますか？\n\n登録された問題文、写真、解説、質問履歴がクラウドから完全に抹消され、復元できなくなります。"
            );
            if (!confirmDelete) return;

            const deleteBtn = document.getElementById("btn-delete-problem");
            deleteBtn.disabled = true;
            deleteBtn.textContent = "🗑️ 削除処理中...";

            try {
                const uid = currentUser.uid;
                // 1. 問題本体を削除
                await remove(ref(database, `users/${uid}/problems/${PROBLEM_ID}`));
                // 2. 高画質画像データを削除
                await remove(ref(database, `users/${uid}/problemImages/${PROBLEM_ID}`)).catch(() => {});
                // 3. 紐づく質問ログ（qna_logs）を削除
                try {
                    const qnaSnap = await get(ref(database, `users/${uid}/qna_logs`));
                    const qnaData = qnaSnap.val() || {};
                    const deletePromises = Object.keys(qnaData)
                        .filter(logId => qnaData[logId] && qnaData[logId].problemId === PROBLEM_ID)
                        .map(logId => remove(ref(database, `users/${uid}/qna_logs/${logId}`)));
                    await Promise.all(deletePromises);
                } catch(e) {}

                if (window.mToast) mToast("🗑️ 問題を完全に削除しました");
                setTimeout(() => { location.href = "index.html"; }, 900);

            } catch (err) {
                console.error("削除エラー:", err);
                if (window.mToast) mToast("⚠️ 削除に失敗しました: " + err.message);
                deleteBtn.disabled = false;
                deleteBtn.textContent = "🗑️ この問題を完全に削除する";
            }
        });

        // ==================== 自己採点 ====================
        window.judgeResult = async function(isCorrect) {
            if (!currentUser || !currentProblem) return;

            const btnCorrect = document.getElementById("btn-correct");
            const btnWrong = document.getElementById("btn-wrong");
            const feedback = document.getElementById("judge-feedback");

            btnCorrect.classList.toggle("selected", isCorrect);
            btnWrong.classList.toggle("selected", !isCorrect);

            const updates = {
                lastResult: isCorrect,
                lastAttemptAt: new Date().toISOString(),
            };
            if (!isCorrect) {
                updates.errorCount = (currentProblem.errorCount || 0) + 1;
                currentProblem.errorCount = updates.errorCount;
            }

            try {
                await update(ref(database, `users/${currentUser.uid}/problems/${currentProblem.id}`), updates);
                feedback.textContent = isCorrect ? "🎉 正解！克服に近づきました" : "❌ 記録しました。次は解けるようにしましょう";
                feedback.style.color = isCorrect ? "var(--success)" : "var(--error)";
            } catch (e) {
                feedback.textContent = "⚠️ 保存に失敗しました";
                feedback.style.color = "var(--error)";
            }
        };

        // ==================== 気づきメモ保存 ====================
        window.saveInsight = async function() {
            if (!currentUser || !currentProblem) return;
            const text = document.getElementById("insight-input").value.trim();
            try {
                await update(ref(database, `users/${currentUser.uid}/problems/${currentProblem.id}`), {
                    insight: text,
                    insightUpdatedAt: new Date().toISOString()
                });
                if (window.mToast) mToast("💾 メモを保存しました");
            } catch (e) {
                if (window.mToast) mToast("⚠️ 保存に失敗しました");
            }
        };

        // ==================== 模範解答・定石のAI自動生成 ====================
        async function generateModelAnswer(uid, pid, p) {
            const btn = document.getElementById("btn-generate-answer");
            if (!btn) return;
            btn.disabled = true;
            btn.textContent = "✨ AIが解説を生成中...";

            try {
                const parts = [{
                    text: `以下の問題について、論理的で厳密かつ分かりやすい完全な模範解答、罠ポイント、定石パターンをJSON形式で生成してください。\n無駄な前置きや絵文字は省き、最短・最高精度で出力してください。\n\n教科: ${p.subject || "数学"}\n問題: ${p.title || p.extracted_text || p.short_title || ""}`
                }];

                const schema = {
                    type: "OBJECT",
                    properties: {
                        model_answer: { type: "STRING" },
                        trap_description: { type: "STRING" },
                        strategy_pattern: { type: "STRING" }
                    },
                    required: ["model_answer", "trap_description", "strategy_pattern"]
                };

                const res = await callGeminiJSON(
                    parts,
                    "あなたは高校・難関大学受験指導のエキスパートプロ講師AIです。無駄な挨拶や装飾を排除し、厳密な論理とLaTeX数式（$...$ または $$...$$）でステップごとに分かりやすく解説してください。",
                    { responseSchema: schema, featureId: "subject_analysis" }
                );

                const updates = {
                    model_answer: res.model_answer || "",
                    answerFormula: res.model_answer || "",
                    trap_description: res.trap_description || "",
                    strategyPattern: res.strategy_pattern || ""
                };

                await update(ref(database, `users/${uid}/problems/${pid}`), updates);

                if (window.mToast) mToast("🎉 模範解答と解説を生成しました！");
                // 画面を再読み込みして反映
                loadProblem(uid, pid);

            } catch (err) {
                console.error("解説生成エラー:", err);
                if (window.mToast) mToast("⚠️ 解説生成に失敗しました: " + err.message);
                btn.disabled = false;
                btn.textContent = "✨ AIに模範解答・定石を生成してもらう";
            }
        }

        // ==================== AIチャット ====================
        window.sendChatMessage = async function() {
            const input = document.getElementById("chat-input");
            const msg = input.value.trim();
            if (!msg) return;
            input.value = "";

            const messagesEl = document.getElementById("chat-messages");
            messagesEl.insertAdjacentHTML("beforeend", `<div class="chat-bubble user">${escHtml(msg)}</div>`);

            chatHistory.push({ role: "user", parts: [{ text: msg }] });

            // AI応答
            const thinkingEl = document.createElement("div");
            thinkingEl.className = "chat-bubble ai";
            thinkingEl.textContent = "考え中...";
            messagesEl.appendChild(thinkingEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            try {
                const result = await callGeminiChat(chatHistory, "高校の学習指導エキスパートAIとして、生徒の質問に分かりやすく丁寧に答えてください。", { featureId: "chat" });
                const aiText = typeof result === "string" ? result : (result?.message || result?.reply || JSON.stringify(result));
                thinkingEl.innerHTML = formatText(aiText);
                chatHistory.push({ role: "model", parts: [{ text: aiText }] });
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([thinkingEl]).catch(() => {});
                }
            } catch (e) {
                thinkingEl.textContent = "⚠️ エラー: " + e.message;
            }
            messagesEl.scrollTop = messagesEl.scrollHeight;
        };

        // Enter で送信
        document.getElementById("chat-input").addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                window.sendChatMessage();
            }
        });

        // ==================== 問題文の編集・写真からの再読み取り ====================
        const OCR_SYSTEM_PROMPT = `あなたは超高精度な教材・参考書・試験問題の文字起こし（OCR）専任AIです。
画像に写っている問題文の全文を、以下の厳格なルールに従って一字一句漏らさず正確に文字起こししてください。

【厳格ルール】
1. 【要約・省略は絶対禁止】問題文の前提条件、リード文、小問番号（(1), (2), (3)...）、選択肢、空欄記号、図表注記まで一字一句省略せず全文を書き出すこと。
2. 【数式表記】すべての数式・記号・物理量は、必ず $ ... $（インライン）または $$ ... $$（別行立て）で挟んでLaTeX形式で記述すること。
3. 【短縮タイトル】問題の内容が一目でわかる短縮名を short_title に出力すること。`;

        const OCR_SCHEMA = {
            type: "OBJECT",
            properties: {
                extracted_text: { type: "STRING" },
                short_title: { type: "STRING" }
            },
            required: ["extracted_text"]
        };

        const mEditModal = document.getElementById("m-edit-modal");
        const mEditModalClose = document.getElementById("m-edit-modal-close");
        const mEditCancel = document.getElementById("m-edit-cancel");
        const mEditSave = document.getElementById("m-edit-save");
        const mModalRunOcr = document.getElementById("m-modal-run-ocr");
        const mOcrStatus = document.getElementById("m-ocr-status");
        const mEditTextInput = document.getElementById("m-edit-text-input");
        const mEditShortTitle = document.getElementById("m-edit-short-title");
        const mEditPreview = document.getElementById("m-edit-preview");
        const mRereadOcrBtn = document.getElementById("m-reread-ocr-btn");
        const mEditTextBtn = document.getElementById("m-edit-text-btn");

        let mPreviewDebounceTimer = null;
        function updateMEditPreview() {
            clearTimeout(mPreviewDebounceTimer);
            mPreviewDebounceTimer = setTimeout(() => {
                if (!mEditTextInput || !mEditPreview) return;
                const val = mEditTextInput.value.trim();
                if (!val) {
                    mEditPreview.innerHTML = '<span style="color:var(--text-muted);">（問題文を入力するとプレビューされます）</span>';
                    return;
                }
                mEditPreview.innerHTML = formatText(val);
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([mEditPreview]).catch(() => {});
                }
            }, 100);
        }

        function openMEditModal(customText) {
            if (!mEditModal || !currentProblem) return;
            if (mOcrStatus) mOcrStatus.style.display = "none";
            if (mEditShortTitle) mEditShortTitle.value = currentProblem.short_title || "";
            if (mEditTextInput) {
                mEditTextInput.value = customText !== undefined ? customText : (currentProblem.title || currentProblem.extracted_text || "");
            }
            updateMEditPreview();
            mEditModal.style.display = "flex";
            if (mEditTextInput) mEditTextInput.focus();
        }

        function closeMEditModal() {
            if (mEditModal) mEditModal.style.display = "none";
        }

        async function runMOcrExtraction() {
            if (!currentProblem) return;
            const images = currentProblem.loadedImages || [];
            if (images.length === 0) {
                showToast("この問題には写真データがありません。手動で問題文を直接編集してください。", "info");
                openMEditModal();
                return;
            }

            if (mModalRunOcr) {
                mModalRunOcr.disabled = true;
                mModalRunOcr.textContent = "⚙️ AIが文字起こし中...";
            }
            if (mRereadOcrBtn) {
                mRereadOcrBtn.disabled = true;
                mRereadOcrBtn.textContent = "🔄 読取中...";
            }
            if (mOcrStatus) {
                mOcrStatus.style.display = "block";
                mOcrStatus.textContent = "⏳ 写真から文字起こし中...（数式・小問番号を抽出中）";
            }

            try {
                let parts = [{ text: "添付された教材画像から、問題文の全文を一字一句漏らさず正確に文字起こししてください。" }];
                images.forEach(imageData => {
                    let base64Raw = imageData.split(",")[1];
                    let mimeType = imageData.split(",")[0].split(":")[1].split(";")[0];
                    parts.push({ inlineData: { mimeType: mimeType, data: base64Raw } });
                });
                if (images.length > 1) {
                    parts[0].text += `\n\n【重要】画像は${images.length}枚あります。すべての画像を統合して完全な問題文として書き起こしてください。`;
                }

                const aiResult = await callGeminiJSON(parts, OCR_SYSTEM_PROMPT, {
                    temperature: 0.1,
                    responseSchema: OCR_SCHEMA,
                    featureId: "ocr"
                });

                const extractedText = (aiResult && aiResult.extracted_text) || "";
                if (!extractedText.trim()) throw new Error("問題文の抽出結果を取得できませんでした。");

                openMEditModal(extractedText);
                if (mEditShortTitle && aiResult.short_title && (!mEditShortTitle.value || mEditShortTitle.value === "未設定")) {
                    mEditShortTitle.value = aiResult.short_title;
                }
                if (mOcrStatus) {
                    mOcrStatus.style.display = "block";
                    mOcrStatus.textContent = "✨ 写真から再読み取り完了！保存を押して反映してください。";
                }
                showToast("📸 写真から問題文を再読み取りしました！", "success", 3500);

            } catch (err) {
                console.error("モバイルOCR再読み取りエラー:", err);
                showToast("再読み取りに失敗しました: " + (err.message || "エラー"), "error");
                if (mOcrStatus) {
                    mOcrStatus.style.display = "block";
                    mOcrStatus.textContent = "⚠️ 読み取り失敗: " + (err.message || "エラー");
                }
            } finally {
                if (mModalRunOcr) {
                    mModalRunOcr.disabled = false;
                    mModalRunOcr.textContent = "🔄 写真からAIで再読み取り（OCR）";
                }
                if (mRereadOcrBtn) {
                    mRereadOcrBtn.disabled = false;
                    mRereadOcrBtn.textContent = "🔄 再読取";
                }
            }
        }

        async function saveMEdit() {
            if (!auth.currentUser || !currentProblem) return;
            const newText = mEditTextInput ? mEditTextInput.value.trim() : "";
            if (!newText) {
                showToast("問題文を空にすることはできません。", "error");
                return;
            }

            const newShortTitle = mEditShortTitle ? mEditShortTitle.value.trim() : "";

            if (mEditSave) {
                mEditSave.disabled = true;
                mEditSave.textContent = "保存中...";
            }

            try {
                const uid = auth.currentUser.uid;
                const pid = currentProblem.id;

                const updates = {
                    title: newText,
                    isManuallyEdited: true,
                    problemTextUpdatedAt: new Date().toISOString()
                };
                if (newShortTitle) updates.short_title = newShortTitle;

                await update(ref(database, `users/${uid}/problems/${pid}`), updates);

                currentProblem.title = newText;
                if (newShortTitle) currentProblem.short_title = newShortTitle;
                currentProblem.isManuallyEdited = true;

                // 画面を更新
                const problemTextEl = document.getElementById("problem-text");
                if (problemTextEl) problemTextEl.innerHTML = formatText(newText);
                const headerTitleEl = document.getElementById("header-title");
                if (headerTitleEl) headerTitleEl.innerHTML = formatMathTitle(newShortTitle || newText);

                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([headerTitleEl, problemTextEl]).catch(() => {});
                }

                closeMEditModal();
                showToast("✅ 問題文を保存しました！", "success");
            } catch (err) {
                console.error("保存エラー:", err);
                showToast("保存に失敗しました: " + err.message, "error");
            } finally {
                if (mEditSave) {
                    mEditSave.disabled = false;
                    mEditSave.textContent = "💾 保存して反映";
                }
            }
        }

        if (mEditTextBtn) mEditTextBtn.addEventListener("click", () => openMEditModal());
        if (mRereadOcrBtn) mRereadOcrBtn.addEventListener("click", () => runMOcrExtraction());
        if (mModalRunOcr) mModalRunOcr.addEventListener("click", () => runMOcrExtraction());
        if (mEditModalClose) mEditModalClose.addEventListener("click", closeMEditModal);
        if (mEditCancel) mEditCancel.addEventListener("click", closeMEditModal);
        if (mEditSave) mEditSave.addEventListener("click", saveMEdit);
        if (mEditModal) {
            mEditModal.addEventListener("click", (e) => {
                if (e.target === mEditModal) closeMEditModal();
            });
        }
        if (mEditTextInput) mEditTextInput.addEventListener("input", updateMEditPreview);

        // クイック記号挿入
        document.querySelectorAll("#m-quick-insert-bar [data-m-insert]").forEach(btn => {
            btn.addEventListener("click", () => {
                const text = btn.getAttribute("data-m-insert");
                if (!mEditTextInput || !text) return;
                const start = mEditTextInput.selectionStart;
                const end = mEditTextInput.selectionEnd;
                const before = mEditTextInput.value.substring(0, start);
                const after = mEditTextInput.value.substring(end);
                const pipeIdx = text.indexOf("|");
                if (pipeIdx >= 0) {
                    const realInsert = text.replace("|", "");
                    mEditTextInput.value = before + realInsert + after;
                    mEditTextInput.selectionStart = mEditTextInput.selectionEnd = start + pipeIdx;
                } else {
                    mEditTextInput.value = before + text + after;
                    mEditTextInput.selectionStart = mEditTextInput.selectionEnd = start + text.length;
                }
                mEditTextInput.focus();
                updateMEditPreview();
            });
        });

        // ==================== ユーティリティ ====================
        function formatText(text) {
            if (!text) return "";

            // 数式ブロック（$ ... $ または $$ ... $$）を一時退避
            const mathBlocks = [];
            let placeholderText = String(text).replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g, (match) => {
                mathBlocks.push(match);
                return `%%%MATH_${mathBlocks.length - 1}%%%`;
            });

            // HTMLエスケープ
            let formatted = placeholderText
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            // マークダウン簡易変換 & 改行
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\\n/g, "<br>").replace(/\n/g, "<br>");

            // 数式ブロックを復元
            formatted = formatted.replace(/%%%MATH_(\d+)%%%/g, (_, idx) => mathBlocks[idx]);
            return formatted;
        }

        function formatMathTitle(text) {
            if (!text) return "問題演習";
            const mathBlocks = [];
            let placeholderText = String(text).replace(/(\$\$[\s\S]*?\$\$|\$[^\$\n]+?\$)/g, (match) => {
                mathBlocks.push(match);
                return `%%%MATH_${mathBlocks.length - 1}%%%`;
            });
            let formatted = placeholderText
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
            formatted = formatted.replace(/%%%MATH_(\d+)%%%/g, (_, idx) => mathBlocks[idx]);
            return formatted;
        }

        function escHtml(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>

</body>
</html>
