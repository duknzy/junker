<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Flora | 誤答ノート</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="style-m.css">

    <style>
        /* 統計サマリー */
        .stat-row {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding: 0 0 0.5rem;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            margin-bottom: 0.75rem;
        }
        .stat-row::-webkit-scrollbar { display: none; }

        .stat-card {
            flex: 0 0 auto;
            min-width: 120px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 0.75rem 0.9rem;
            box-shadow: var(--shadow-xs);
        }
        .stat-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.15rem;
        }
        .stat-value {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 800;
            line-height: 1.15;
            color: var(--text-primary);
        }
        .stat-sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 0.15rem;
        }

        .retention-bar-wrap {
            height: 5px;
            background: var(--bg-subtle);
            border-radius: var(--radius-full);
            overflow: hidden;
            margin-top: 0.35rem;
        }
        .retention-bar-fill {
            height: 100%;
            background: var(--brand-primary);
            border-radius: var(--radius-full);
            transition: width 0.5s ease;
        }

        /* 問題行カード */
        .p-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0.9rem;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: 0.6rem;
            cursor: pointer;
            transition: box-shadow 0.15s, transform 0.1s;
            border-left: 4px solid var(--brand-primary);
        }
        .p-row:active {
            transform: scale(0.985);
            box-shadow: var(--shadow-sm);
        }

        .p-thumb {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-md);
            flex-shrink: 0;
            overflow: hidden;
            background: var(--bg-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
        }
        .p-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .p-main {
            flex: 1;
            min-width: 0;
        }
        .p-title {
            font-weight: 600;
            font-size: var(--fs-sm);
            color: var(--text-primary);
            line-height: 1.35;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .p-badges {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            margin-top: 0.2rem;
        }

        .p-err {
            font-family: var(--font-heading);
            font-size: 1.15rem;
            font-weight: 800;
            text-align: center;
            min-width: 36px;
            flex-shrink: 0;
            line-height: 1;
        }
        .p-err-label {
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.15rem;
            margin-top: 0.5rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .section-header-left {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: var(--fs-xs);
            font-weight: 700;
            color: var(--text-secondary);
        }
        .section-chevron {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 0.65rem;
        }
        .section-header.collapsed .section-chevron {
            transform: rotate(-90deg);
        }
        .section-count {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--bg-subtle);
            padding: 0.15rem 0.5rem;
            border-radius: var(--radius-full);
        }
        .section-rows.collapsed { display: none; }

        .login-notice {
            text-align: center;
            padding: 4rem 1.5rem;
        }
        .login-notice h2 {
            font-family: var(--font-heading);
            font-size: var(--fs-lg);
            margin-bottom: 0.5rem;
        }

        /* 問題登録モーダル */
        .add-prob-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99990;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }
        .add-prob-modal-sheet {
            background: var(--bg-surface);
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.25rem;
            box-shadow: var(--shadow-modal);
            animation: slideUp 0.25s ease-out;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="m-header">
        <div style="display:flex;align-items:center;gap:0.5rem;flex:1;min-width:0;">
            <span style="font-size:1.35rem;">🌱</span>
            <span class="m-header-title">Flora 誤答ノート</span>
        </div>
    </header>

    <!-- ログイン案内（未ログイン時のみ） -->
    <div id="login-notice" class="login-notice" style="display:none;">
        <h2>🌱 Flora へようこそ</h2>
        <p style="color:var(--text-secondary); margin-bottom:1.5rem; font-size:var(--fs-sm);">ログインして誤答ノートを同期しましょう</p>
        <button id="main-login-btn" class="m-btn m-btn-primary m-btn-full" style="max-width:280px;margin:0 auto;">
            Googleでログイン
        </button>
        <div style="margin-top:0.75rem;">
            <button id="test-login-btn" class="m-btn" style="font-size:0.75rem;padding:0.4rem 0.8rem;">
                🧪 テスターログイン
            </button>
        </div>
    </div>

    <!-- メインコンテンツ（ログイン後） -->
    <main id="main-content" class="m-content" style="display:none;">

        <!-- 統計サマリー -->
        <div class="stat-row">
            <div class="stat-card">
                <div class="stat-label">累計誤答</div>
                <div class="stat-value" id="total-errors-display">00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">今日の演習</div>
                <div class="stat-value" id="solved-today-display">00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">記憶定着率</div>
                <div class="stat-value" id="retention-rate-display">0%</div>
                <div class="retention-bar-wrap">
                    <div class="retention-bar-fill" id="retention-bar-display" style="width:0%;"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">本日要対応</div>
                <div class="stat-value text-error" id="due-count-display">0</div>
                <div class="stat-sub">問</div>
            </div>
        </div>

        <!-- 検索バー -->
        <div class="m-search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="問題を検索...">
        </div>

        <!-- 教科フィルター（横スクロール） -->
        <div class="m-filter-chips" id="subject-chips"></div>

        <!-- 問題一覧 -->
        <div id="problem-list" style="margin-top:0.5rem;"></div>

    </main>

    <!-- FAB: 問題登録ボタン -->
    <button type="button" class="m-fab" id="fab-add" style="display:none;" title="問題を追加">📸</button>

    <!-- 📸 写真から問題登録モーダル（スマホ完結） -->
    <div class="add-prob-modal-overlay" id="add-prob-modal">
        <div class="add-prob-modal-sheet">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem;">
                <h3 style="font-family:var(--font-heading); font-size:1.05rem; font-weight:800;">📸 写真から問題を登録</h3>
                <button type="button" id="close-add-prob-modal-btn" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);">✕</button>
            </div>

            <!-- 教科選択 -->
            <div style="margin-bottom:0.75rem;">
                <label style="font-size:0.75rem; font-weight:700; color:var(--text-secondary); display:block; margin-bottom:0.3rem;">教科</label>
                <select id="prob-subject-select" class="m-input" style="padding:0.4rem 0.6rem;">
                    <option value="数学">📐 数学</option>
                    <option value="物理">⚡ 物理</option>
                    <option value="化学">🧪 化学</option>
                    <option value="生物">🧬 生物</option>
                    <option value="情報">💻 情報</option>
                    <option value="地理">🗺️ 地理</option>
                    <option value="日本史">⛩️ 日本史</option>
                    <option value="世界史">🏛️ 世界史</option>
                    <option value="英語">🔤 英語</option>
                    <option value="国語">📜 国語</option>
                    <option value="公民">⚖️ 公民</option>
                </select>
            </div>

            <!-- 写真選択 -->
            <div style="margin-bottom:0.75rem;">
                <label style="font-size:0.75rem; font-weight:700; color:var(--text-secondary); display:block; margin-bottom:0.3rem;">問題の写真（カメラまたはアルバムから）</label>
                <input type="file" accept="image/*" multiple id="prob-photo-input" class="m-input" style="padding:0.4rem;">
                <div id="prob-thumb-preview" style="display:flex; gap:0.4rem; overflow-x:auto; margin-top:0.4rem;"></div>
            </div>

            <!-- メモ（任意） -->
            <div style="margin-bottom:1rem;">
                <label style="font-size:0.75rem; font-weight:700; color:var(--text-secondary); display:block; margin-bottom:0.3rem;">自分のメモ・間違えた理由（任意）</label>
                <input type="text" id="prob-memo-input" class="m-input" placeholder="例：計算ミス、公式をど忘れした">
            </div>

            <button type="button" class="m-btn m-btn-primary m-btn-full" id="run-add-prob-btn" style="min-height:48px; font-size:0.95rem;">
                ✨ AIで解析して誤答ノートに追加
            </button>
        </div>
    </div>

    <!-- ボトムナビ -->
    <script src="bottom-nav.js"></script>

    <!-- Firebase & ロジック -->
    <script type="module">
        import { initApiKeyManager, showToast, getGeminiKeys, callGeminiJSON, generateTinyThumbnail } from "../api-key-manager.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithPopup, signInWithEmailAndPassword, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB55MdhpjJizQaLEdRu-XhBVJ4PqrHsAyY",
            authDomain: "buturi-2449e.firebaseapp.com",
            databaseURL: "https://buturi-2449e-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "buturi-2449e",
            storageBucket: "buturi-2449e.appspot.com",
            messagingSenderId: "976306696124",
            appId: "1:976306696124:web:e455c1953544bff5c345b9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);
        const provider = new GoogleAuthProvider();

        initApiKeyManager({ needGemini: true, needDeepseek: false });

        let currentUser = null;
        let lastProblems = {};
        let currentSubjectFilter = "ALL";
        let currentSearchQuery = "";
        let probSelectedImages = [];

        // ==================== 認証 ====================
        onAuthStateChanged(auth, (user) => {
            const loginNotice = document.getElementById("login-notice");
            const mainContent = document.getElementById("main-content");
            const fab = document.getElementById("fab-add");

            if (user) {
                currentUser = user;
                loginNotice.style.display = "none";
                mainContent.style.display = "block";
                fab.style.display = "flex";
                listenToProblems(user.uid);
            } else {
                currentUser = null;
                loginNotice.style.display = "block";
                mainContent.style.display = "none";
                fab.style.display = "none";
            }
        });

        function doLogin() { signInWithPopup(auth, provider).catch(e => console.error(e)); }
        document.getElementById("main-login-btn").addEventListener("click", doLogin);

        async function doTestLogin() {
            try {
                await signInWithEmailAndPassword(auth, "tester@flora.local", "flora1234");
                if (window.mToast) mToast("✅ テスターログイン成功");
            } catch (e) {
                console.error("Test login failed:", e);
                if (window.mToast) mToast("⚠️ ログイン失敗");
            }
        }
        document.getElementById("test-login-btn")?.addEventListener("click", doTestLogin);
        window.floraTestLogin = doTestLogin;

        if (new URLSearchParams(location.search).has("autologin") || new URLSearchParams(location.search).has("test")) {
            setTimeout(() => { if (!auth.currentUser) doTestLogin(); }, 500);
        }

        // ==================== データ取得 ====================
        function listenToProblems(uid) {
            const problemsRef = ref(database, `users/${uid}/problems`);
            onValue(problemsRef, (snapshot) => {
                lastProblems = snapshot.val() || {};
                renderDashboard();
            });
        }

        // ==================== 検索 ====================
        document.getElementById("search-input").addEventListener("input", (e) => {
            currentSearchQuery = e.target.value.trim().toLowerCase();
            renderDashboard();
        });

        // ==================== 復習優先度 ====================
        function getUrgency(p) {
            const boostedAt = p.lessonReviewPriorityAt ? new Date(p.lessonReviewPriorityAt) : null;
            const alreadyReviewed = boostedAt && p.lastAttemptAt && new Date(p.lastAttemptAt) >= boostedAt;
            if (boostedAt && !alreadyReviewed) return "overdue";

            if (!p.lastAttemptAt) return "new";

            const diffDays = (Date.now() - new Date(p.lastAttemptAt).getTime()) / (1000 * 60 * 60 * 24);
            const difficulty = Number(p.errorCount || 1);
            let interval = 7;
            if (difficulty === 1) interval = 4;
            if (difficulty === 2) interval = 2;
            if (difficulty >= 3) interval = 1;

            if (p.errorCount === 0 || p.lastResult === true) return "safe";
            if (diffDays >= interval * 1.5) return "overdue";
            if (diffDays >= interval) return "critical";
            return "pending";
        }

        const urgencyConfig = {
            overdue:  { label: "⚠️ 忘却危機", color: "var(--accent-yellow)" },
            critical: { label: "🔥 要復習",   color: "var(--accent-magenta)" },
            new:      { label: "🆕 未挑戦",   color: "#888" },
            pending:  { label: "⏳ 定着中",   color: "#b16eff" },
            safe:     { label: "✨ 克服済",   color: "var(--accent-cyan)" },
        };
        const sectionOrder = ["overdue", "critical", "new", "pending", "safe"];

        // ==================== 描画 ====================
        function renderDashboard() {
            const listEl = document.getElementById("problem-list");
            const chipsEl = document.getElementById("subject-chips");

            const subjects = new Set();
            Object.values(lastProblems).forEach(p => subjects.add(p.subject || "未分類"));

            let chipsHtml = `<button class="m-chip ${currentSubjectFilter === 'ALL' ? 'active' : ''}" data-subj="ALL">✨ すべて</button>`;
            subjects.forEach(s => {
                chipsHtml += `<button class="m-chip ${currentSubjectFilter === s ? 'active' : ''}" data-subj="${s}">${s}</button>`;
            });
            chipsEl.innerHTML = chipsHtml;
            chipsEl.querySelectorAll(".m-chip").forEach(btn => {
                btn.addEventListener("click", () => {
                    currentSubjectFilter = btn.dataset.subj;
                    renderDashboard();
                });
            });

            const buckets = { overdue: [], critical: [], new: [], pending: [], safe: [] };
            let totalErrors = 0, solvedToday = 0, safeCount = 0, criticalDue = 0, totalFiltered = 0;
            const todayStr = new Date().toDateString();

            Object.entries(lastProblems).forEach(([id, p]) => {
                if (!p) return;
                const subj = p.subject || "未分類";
                if (currentSubjectFilter !== "ALL" && subj !== currentSubjectFilter) return;
                if (currentSearchQuery) {
                    const hay = [p.short_title, p.title, p.field, p.subject, p.insight, p.trap_description]
                        .filter(Boolean).join(" ").toLowerCase();
                    if (!hay.includes(currentSearchQuery)) return;
                }

                totalFiltered++;
                totalErrors += Number(p.errorCount || 0);
                if (p.lastAttemptAt && p.lastResult === true && new Date(p.lastAttemptAt).toDateString() === todayStr) {
                    solvedToday++;
                }

                const urgency = getUrgency(p);
                if (urgency === "safe") safeCount++;
                if (urgency === "overdue" || urgency === "critical" || urgency === "new") criticalDue++;

                buckets[urgency].push({ id, ...p });
            });

            document.getElementById("total-errors-display").textContent = String(totalErrors).padStart(2, '0');
            document.getElementById("solved-today-display").textContent = String(solvedToday).padStart(2, '0');
            const retention = totalFiltered > 0 ? Math.round((safeCount / totalFiltered) * 100) : 0;
            document.getElementById("retention-rate-display").textContent = `${retention}%`;
            document.getElementById("retention-bar-display").style.width = `${retention}%`;
            document.getElementById("due-count-display").textContent = criticalDue;

            let html = "";
            sectionOrder.forEach(key => {
                const items = buckets[key];
                if (!items || items.length === 0) return;
                const cfg = urgencyConfig[key];

                html += `
                    <div class="section-header" data-section="${key}" onclick="this.classList.toggle('collapsed');this.nextElementSibling.classList.toggle('collapsed');">
                        <div class="section-header-left">
                            <span class="section-chevron">▼</span>
                            <span>${cfg.label}</span>
                        </div>
                        <span class="section-count">${items.length}</span>
                    </div>
                    <div class="section-rows" data-section-rows="${key}">
                `;

                items.forEach(p => {
                    let thumbContent = "";
                    if (p.thumb) {
                        thumbContent = `<img src="${p.thumb}">`;
                    } else {
                        const subj = p.subject || "";
                        let icon = "📝";
                        if (subj.includes("数学")) icon = "📐";
                        else if (subj.includes("物理")) icon = "⚡";
                        else if (subj.includes("化学")) icon = "🧪";
                        else if (subj.includes("世界史")) icon = "🌍";
                        else if (subj.includes("日本史")) icon = "⛩️";
                        else if (subj.includes("英語")) icon = "🔤";
                        else if (subj.includes("国語")) icon = "📖";
                        else if (subj.includes("地理")) icon = "🗺️";
                        else if (subj.includes("情報")) icon = "💻";
                        else if (subj.includes("生物")) icon = "🧬";
                        thumbContent = icon;
                    }

                    const subjClass = getSubjectClass(p.subject || "");

                    html += `
                        <div class="p-row" style="border-left-color:${cfg.color};" onclick="location.href='problem.html?id=${p.id}'">
                            <div class="p-thumb">${thumbContent}</div>
                            <div class="p-main">
                                <div class="p-title">${escHtml(p.short_title || p.title || "無題")}</div>
                                <div class="p-badges">
                                    <span class="m-subject-badge ${subjClass}">${escHtml(p.subject || "未分類")}</span>
                                    ${p.field ? `<span class="m-subject-badge" style="background:var(--bg-subtle);color:var(--text-secondary);border:1px solid var(--border-color);">${escHtml(truncate(p.field, 15))}</span>` : ""}
                                </div>
                            </div>
                            <div class="p-err" style="color:${cfg.color};">
                                <div>${String(p.errorCount || 0).padStart(2, '0')}</div>
                                <div class="p-err-label">誤答</div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
            });

            if (totalFiltered === 0 && Object.keys(lastProblems).length === 0) {
                html = `
                    <div class="m-empty-state" style="margin-top:2rem;">
                        <div class="m-empty-state-icon">📚</div>
                        <div class="m-empty-state-title">まだ問題が登録されていません</div>
                        <div class="m-empty-state-text">右下の「📸」ボタンから<br>写真を撮って問題を追加してみましょう！</div>
                    </div>
                `;
            } else if (totalFiltered === 0) {
                html = `<div class="m-empty-state"><div class="m-empty-state-text">条件に一致する問題がありません</div></div>`;
            }

            listEl.innerHTML = html;
        }

        // ==================== 📸 問題登録モーダル（スマホ完結） ====================
        const addProbModal = document.getElementById("add-prob-modal");
        document.getElementById("fab-add")?.addEventListener("click", () => {
            addProbModal.style.display = "flex";
        });
        document.getElementById("close-add-prob-modal-btn")?.addEventListener("click", () => {
            addProbModal.style.display = "none";
        });
        addProbModal?.addEventListener("click", (e) => {
            if (e.target === addProbModal) addProbModal.style.display = "none";
        });

        document.getElementById("prob-photo-input")?.addEventListener("change", (e) => {
            const files = Array.from(e.target.files || []);
            probSelectedImages = [];
            const previewEl = document.getElementById("prob-thumb-preview");
            previewEl.innerHTML = "";

            files.forEach(f => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const dataUrl = ev.target.result;
                    probSelectedImages.push({
                        mimeType: f.type || "image/jpeg",
                        data: dataUrl.split(",")[1],
                        dataUrl
                    });
                    previewEl.innerHTML += `<img src="${dataUrl}" style="height:60px; border-radius:6px; border:1px solid var(--border-color);">`;
                };
                reader.readAsDataURL(f);
            });
        });

        document.getElementById("run-add-prob-btn")?.addEventListener("click", async () => {
            if (!currentUser) {
                if (window.mToast) mToast("⚠️ ログインしてください");
                return;
            }
            if (probSelectedImages.length === 0) {
                if (window.mToast) mToast("⚠️ 写真を選択してください");
                return;
            }

            const subject = document.getElementById("prob-subject-select").value;
            const memo = document.getElementById("prob-memo-input").value.trim();
            const btn = document.getElementById("run-add-prob-btn");

            btn.disabled = true;
            btn.textContent = "AIが問題を解析中...";

            try {
                const parts = [{ text: `教科「${subject}」の問題です。写真から問題文、罠の解説、定石パターン、模範解答を抽出してJSONで返してください。` }];
                if (memo) parts[0].text += `\n生徒のメモ: ${memo}`;
                probSelectedImages.forEach(img => {
                    parts.push({ inlineData: { mimeType: img.mimeType, data: img.data } });
                });

                const schema = {
                    type: "OBJECT",
                    properties: {
                        short_title: { type: "STRING" },
                        extracted_text: { type: "STRING" },
                        field: { type: "STRING" },
                        trap_description: { type: "STRING" },
                        strategy_pattern: { type: "STRING" },
                        model_answer: { type: "STRING" }
                    },
                    required: ["short_title", "extracted_text", "model_answer"]
                };

                const res = await callGeminiJSON(parts, "高校各教科のエキスパート誤答分析AIです。数式は$ $で囲むこと。", {
                    responseSchema: schema,
                    featureId: "subject_analysis"
                });

                // サムネイル生成
                let thumb = null;
                try {
                    thumb = await generateTinyThumbnail(probSelectedImages[0].dataUrl);
                } catch(e) {
                    thumb = probSelectedImages[0].dataUrl;
                }

                const newId = "CUSTOM_" + Date.now();
                const nowIso = new Date().toISOString();
                const newProblem = {
                    id: newId,
                    title: res.extracted_text || "問題文",
                    short_title: res.short_title || `【${subject}】問題`,
                    subject,
                    field: res.field || "演習問題",
                    trap_description: res.trap_description || "",
                    strategyPattern: res.strategy_pattern || "",
                    model_answer: res.model_answer || "",
                    answerFormula: res.model_answer || "",
                    errorCount: 1,
                    lastAttemptAt: nowIso,
                    lastResult: false,
                    thumb,
                    imageCount: probSelectedImages.length,
                    createdAt: nowIso
                };

                // Firebase保存
                await set(ref(database, `users/${currentUser.uid}/problems/${newId}`), newProblem);
                await set(ref(database, `users/${currentUser.uid}/problemImages/${newId}`), {
                    images: probSelectedImages.map(i => i.dataUrl)
                });

                addProbModal.style.display = "none";
                if (window.mToast) mToast("🎉 誤答ノートに問題を追加しました！");

            } catch(e) {
                console.error(e);
                if (window.mToast) mToast("⚠️ 解析エラー: " + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "✨ AIで解析して誤答ノートに追加";
            }
        });

        function getSubjectClass(subj) {
            if (subj.includes("数学")) return "subj-数学";
            if (subj.includes("物理")) return "subj-物理";
            if (subj.includes("化学")) return "subj-化学";
            if (subj.includes("世界史")) return "subj-世界史";
            if (subj.includes("英語")) return "subj-英語";
            if (subj.includes("国語")) return "subj-国語";
            if (subj.includes("公民")) return "subj-公民";
            if (subj.includes("情報")) return "subj-情報";
            if (subj.includes("地理")) return "subj-地理";
            if (subj.includes("日本史")) return "subj-日本史";
            if (subj.includes("生物")) return "subj-生物";
            return "";
        }

        function escHtml(s) {
            if (!s) return "";
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        function truncate(s, n) {
            if (!s) return "";
            return s.length > n ? s.slice(0, n) + "…" : s;
        }
    </script>

</body>
